    if (q) {
      // Search across datasets, prioritizing exact and prefix label matches.
      const hit = (e) => `${e.m.label} ${e.m.ref}`.toLowerCase().includes(q);
      const es = P.idx.filter(hit);
      const rank = (e) => e.m.label.toLowerCase() === q ? 0 : e.m.label.toLowerCase().startsWith(q) ? 1 : 2;
      es.sort((a, b) => rank(a) - rank(b) || byLabel(a, b));
      const spans = new Set(es.map((e) => e.ds)).size > 1;
      html = es.slice(0, 50).map((e) => row(e, spans ? e.ds.label : '')).join('');
      if (html) html = `<div class="gtitle" role="status">${es.length > 50 ? 'Showing first 50 matches' : `${es.length} match${es.length === 1 ? '' : 'es'}`}</div><div role="group" aria-label="Matching metrics">${html}</div>`;
      list.classList.add('flat');
      if (!html) html = `<div class="tp-empty"><span role="status">No metrics match “${esc(P.q.trim())}”.</span><button class="btn quiet" data-tp="catalog" data-q="${esc(P.q.trim())}">Search catalog</button></div>`;
    } else {
      list.classList.remove('flat');
      // Groups in the same order as the host sidebar: alphabetical by label. Each group lists all its metrics.
      const groups = DATASETS.map((ds) => ({ ds, es: P.idx.filter((e) => e.ds === ds).sort(byLabel) }))
        .filter((g) => g.es.length).sort((a, b) => a.ds.label.localeCompare(b.ds.label));
      for (const g of groups) {
        const open = P.openDs.has(g.ds.uname);
        const groupId = `root-group-${esc(g.ds.uname)}`;
        const seen = {}; for (const e of g.es) seen[e.m.label] = (seen[e.m.label] || 0) + 1;
        html += `<div class="root-group" role="group" aria-label="${esc(g.ds.label)}"><div class="grp-row"><button class="grp-head" data-stop data-tp="group" data-ds="${esc(g.ds.uname)}" aria-expanded="${open}" ${open ? `aria-controls="${groupId}"` : ''}>${ICON.chevR.replace('class="ico"', 'class="ico chev"')}<span class="gname">${esc(g.ds.label)}</span><span class="gcount">${g.es.length} metric${g.es.length === 1 ? '' : 's'}</span></button><button class="viewall" data-stop data-tp="viewall" data-ds="${esc(g.ds.uname)}" aria-label="Show all metrics in ${esc(g.ds.label)}" title="Show the complete dataset graph">${ICON.expand}Show all metrics</button></div>`;
        if (!open) { html += '</div>'; continue; }
        html += `<div class="root-children" id="${groupId}">`;
        html += g.es.map((e) => row(e, seen[e.m.label] > 1 && e.parent ? `in ${parentLabel(e)}` : '')).join('');
        html += '</div></div>';
      }
    }
    list.innerHTML = html;
    const stops = [...list.querySelectorAll('[data-stop]')];
    stops.forEach((el, i) => { el.id = `tp-s-${i}`; });
    if (P.activeKey) { const k = stops.findIndex((el) => `${el.dataset.tp}|${el.dataset.id || el.dataset.ds}` === P.activeKey); if (k >= 0) P.active = k; }
    // First open: the selected root is the active row.
    else if (!q) { const k = stops.findIndex((el) => el.dataset.tp === 'root' && el.dataset.id === S.tree.root); if (k >= 0) P.active = k; }
    const first = !P.activeKey;
    setActive(Math.min(P.active || 0, stops.length - 1));
    // First open: the selected root's row sits in the middle of the list, clear of the sticky group header.
    if (first && !q) stops[P.active]?.scrollIntoView({ block: 'center' });
  }
  function setActive (i, focus = false) {
    const P = tpopState; if (!P) return;
    const stops = [...tpop.querySelectorAll('#tpop-list [data-stop]')];
    stops.forEach((el) => el.classList.remove('active'));
    if (i < 0 || !stops[i]) return;
    P.active = i; P.activeKey = `${stops[i].dataset.tp}|${stops[i].dataset.id || stops[i].dataset.ds}`;
    stops[i].classList.add('active');
    if (focus) stops[i].focus({ preventScroll: true });
    stops[i].scrollIntoView({ block: 'nearest' });
  }
  function findMatches (q) {
    const tree = S.tree.tree; if (!tree) return [];
    const s = q.trim().toLowerCase(); if (!s) return [];
    return [...tree.nodes.keys()].filter((r) => `${labelOf(tree, r)} ${r}`.toLowerCase().includes(s)).slice(0, 8);
  }
  function wireFind (input) {
    const clr = $('#find-clear');
    const sync = () => { if (clr) clr.hidden = !input.value; };
    clr?.addEventListener('click', () => { input.value = ''; sync(); closeTpop(); input.focus(); });
    input.addEventListener('input', sync);
    input.addEventListener('input', () => {
      const hits = findMatches(input.value);
      if (!input.value.trim()) { closeTpop(); return; }
      tpopState = { kind: 'find', anchor: input, hits };
      placeTpop($('#find-wrap') || input, true); input.setAttribute('aria-expanded', 'true');
      tpop.innerHTML = `<div class="tpop-list" id="tpop-list" role="listbox" aria-label="Matches">${hits.length
        ? hits.map((r) => { const t = labelOf(S.tree.tree, r); const qq = input.value.trim().toLowerCase(); const i = t.toLowerCase().indexOf(qq); const name = i < 0 ? esc(t) : `${esc(t.slice(0, i))}<mark>${esc(t.slice(i, i + qq.length))}</mark>${esc(t.slice(i + qq.length))}`; return `<button class="opt" role="option" aria-selected="false" data-tp="find" data-ref="${esc(r)}"><span class="oname">${name}</span></button>`; }).join('')
        : `<div class="empty">No match in this tree. <button class="link-btn" data-tp="catalog" data-q="${esc(input.value.trim())}">Search Catalog</button></div>`}</div>`;
      tpop.hidden = false;
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' && tpopState?.kind === 'find') { e.preventDefault(); tpop.querySelector('.opt')?.focus(); }
      if (e.key === 'Enter') { const r = findMatches(input.value)[0]; if (r) { e.preventDefault(); input.value = labelOf(S.tree.tree, r); closeTpop(); focusNode(r); } }
      if (e.key === 'Escape') { if (!tpop.hidden) { e.stopPropagation(); closeTpop(); } else if (input.value) { e.stopPropagation(); input.value = ''; } }
    });
  }
  tpop.addEventListener('input', (e) => { if (e.target.id === 'tp-q' && tpopState) { tpopState.q = e.target.value; tpopState.active = 0; tpopState.activeKey = null; renderRootList(); } });
  tpop.addEventListener('keydown', (e) => {
    if (tpopState?.kind === 'root') {
      const P = tpopState; const stops = [...tpop.querySelectorAll('#tpop-list [data-stop]')];
      const input = tpop.querySelector('#tp-q'); const typing = e.target === input;
      const i = stops.indexOf(document.activeElement); const cur = stops[i];
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(stops.length - 1, i + 1), true); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); if (i <= 0) input.focus(); else setActive(i - 1, true); return; }
      if (!typing && e.key === 'Home') { e.preventDefault(); setActive(0, true); return; }
      if (!typing && e.key === 'End') { e.preventDefault(); setActive(stops.length - 1, true); return; }
      if (!typing && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && cur?.dataset.tp === 'group') {
        const open = e.key === 'ArrowRight'; const u = cur.dataset.ds;
        if (open !== P.openDs.has(u)) { e.preventDefault(); P.activeKey = `group|${u}`; if (open) P.openDs.add(u); else P.openDs.delete(u); renderRootList(); setActive(P.active, true); }
        return;
      }
      if (typing && e.key === 'Enter') { e.preventDefault(); stops.find((s) => s.dataset.tp === 'root' || s.dataset.tp === 'leaf')?.click(); return; }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (input.value) { input.value = ''; P.q = ''; P.active = 0; P.activeKey = null; renderRootList(); input.focus(); } else closeTpop(true); return; }
      return;
    }
    const opts = [...tpop.querySelectorAll('.opt')]; const i = opts.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); opts[Math.min(opts.length - 1, i + 1)]?.focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (i <= 0) (tpop.querySelector('#tp-q') || tpopState?.anchor)?.focus(); else opts[i - 1].focus(); }
    if (e.key === 'Enter' && e.target.id === 'tp-q') { e.preventDefault(); opts[0]?.click(); }
    if (e.key === 'Escape') { e.stopPropagation(); closeTpop(true); }
  });
  tpop.addEventListener('click', (e) => {
    const el = e.target.closest('[data-tp]'); if (!el) return;
    if (el.dataset.tp === 'root') { closeTpop(); traceMetric(el.dataset.id); $('#root-btn')?.focus({ preventScroll: true }); return; }
    if (el.dataset.tp === 'leaf') { closeTpop(); traceMetric(el.dataset.id, { focus: el.dataset.ref }); return; }
    if (el.dataset.tp === 'standalone' || el.dataset.tp === 'group') {
      const u = el.dataset.ds; const set = el.dataset.tp === 'group' ? tpopState.openDs : tpopState.openStand;
      if (set.has(u)) set.delete(u); else set.add(u);
      tpopState.activeKey = `${el.dataset.tp}|${u}`;
      renderRootList(); setActive(tpopState.active, true); return;
    }
    if (el.dataset.tp === 'viewall') {
      // Whole dataset as a forest, rooted at its biggest tree.
      const g = (tpopState.idx || []).filter((e) => e.ds.uname === el.dataset.ds).sort((a, b) => b.n - a.n)[0];
      if (g && S.tree.mode !== 'all' && S.tree.root) S.tree.back = { root: S.tree.root, selected: S.tree.selected, expanded: S.tree.expanded && new Set(S.tree.expanded) };
      closeTpop(); if (g) { traceMetric(g.id, { mode: 'all', keepBack: true }); $('#root-btn')?.focus({ preventScroll: true }); } return;
    }
    if (el.dataset.tp === 'range' || el.dataset.tp === 'cmp') {
      if (el.dataset.tp === 'range') S.range = el.dataset.v; else S.cmp = el.dataset.v;
      closeTpop(); render(); $('#period-btn')?.focus(); return;
    }
    if (el.dataset.tp === 'catalog') { closeTpop(); S.search = el.dataset.q || ''; S.view = 'catalogue'; render(); return; }
    if (el.dataset.tp === 'date') {
      const ds = DATASETS.find((d) => d.uname === el.dataset.ds); closeTpop(true);
      if (!ds || ds.dateRef === el.dataset.ref) return;
      ds.dateRef = el.dataset.ref; S.open.add(ds.uname);
      loadAnchors([ds]).then(() => { if (S.view === 'catalogue') renderCatList(); });
      return;
    }
    if (el.dataset.tp === 'find') {
      const input = $('#find'); const r = el.dataset.ref;
      if (input) input.value = labelOf(S.tree.tree, r);
      closeTpop(); focusNode(r);
    }
  });
  document.addEventListener('pointerdown', (e) => {
    if (!tpop.hidden && !tpop.contains(e.target) && e.target !== tpopState?.anchor && !tpopState?.anchor?.contains(e.target)) closeTpop();
  });
  // Compare labels follow the width: shorter on small screens.
  function syncCompareLabels () {
    const labels = Object.fromEntries(compareOptions());
    root.querySelectorAll('select[data-bind="cmp"] option').forEach((o) => { if (labels[o.value] && o.textContent !== labels[o.value]) o.textContent = labels[o.value]; });
  }
  window.addEventListener('resize', syncCompareLabels);
  window.addEventListener('resize', () => { const n = $('#period-nm'); if (n) n.textContent = periodText(); if (S.view === 'tree' && S.tree.tree) renderInsights(); });
  // Refit on resize until the reader moves the view.
  window.addEventListener('resize', () => { if (S.view === 'tree') closeTpop(); });
  window.addEventListener('scroll', () => closeTpop(), { passive: true });

  /* ----------------------------------------------------------------
  Tree actions (clicks) and keyboard
  ---------------------------------------------------------------- */
  // Source app: open it in a new tab. The frame may block popups: then copy the link, else show it to copy.
  // Bring a panel control into view inside the panel only, so the page and the host never scroll sideways.
  function revealInPanel (el) {
    const b = el.closest('.drawer-body'); if (!b) return;
    const r = el.getBoundingClientRect(); const br = b.getBoundingClientRect();
    if (r.top < br.top || r.bottom > br.bottom) b.scrollTop += r.top - br.top - 16;
  }
  function openSource (path) {
    let url = path;
    try { const base = /^https?:/.test(location.href) ? location.href : document.referrer; if (base) url = new URL(path, base).href; } catch (_) { /* keep the path */ }
    let win = null;
    try { win = window.open(url, '_blank'); if (win) win.opener = null; } catch (_) { win = null; }
    if (win) return;
    copyText(url).then((ok) => {
      if (ok) { toast('Link copied. Paste it in a new tab.'); return; }
      showModal('Source app', `<input class="search" readonly value="${esc(url)}" aria-label="App link" style="width:100%">`);
      const f = modal.querySelector('input'); f.focus(); f.select();
    });
  }
  function treeAction (action, el) {
    const T = S.tree;
    if (/^(expand-all|collapse-all|fit|zoom-in|zoom-out|node-toggle|node-select|focus-node)$/.test(action)) dismissIntro();
    switch (action) {
      case 'node-select': selectNode(el.dataset.ref); return true;
      case 'node-toggle': toggleNode(el.dataset.ref); return true;
      case 'chip-node': focusNode(el.dataset.ref, { select: true, focus: false, keepFrom: true }); $('#drawer-title')?.focus({ preventScroll: true }); return true;
      case 'focus-node': focusNode(el.dataset.ref); return true;
      case 'annotations': T.annotationPanel = !T.annotationPanel; T.selected = null; T.from = null; renderInsights(); renderCanvas(); renderDrawer(); return true;
      case 'annotation-visibility': T.annotationsVisible = !T.annotationsVisible; renderCanvas(); renderDrawer(); $('#drawer [data-action="annotation-visibility"]')?.focus(); return true;
      case 'annotation-open': {
        // Notes → metric, one level deep: remember where the reader was in the list.
        T.notesScroll = $('#drawer .drawer-body')?.scrollTop || 0; T.notesRef = el.dataset.ref; T.from = 'notes';
        swapFade(); focusNode(el.dataset.ref, { select: true, focus: false, keepFrom: true });
        $('#drawer-title')?.focus({ preventScroll: true }); $('#metric-notes')?.scrollIntoView({ block: 'nearest' }); return true;
      }
      case 'notes-back': backToNotes(); return true;
      case 'fav-toggle': {
        const id = el.dataset.id; if (S.favorites.has(id)) S.favorites.delete(id); else S.favorites.add(id);
        if (!S.favorites.size) S.favOnly = false;
        renderCanvas(); renderDrawer(); $('#drawer .fav-btn')?.focus(); toast(S.favorites.has(id) ? 'Added to favorites' : 'Removed from favorites'); return true;
      }
      case 'open-source': revealInPanel(el); openSource(el.dataset.path); return true;
      case 'sheet-size': if (sheetDrag.suppress) return true; T.sheetFull = !T.sheetFull; renderDrawer(); $('#drawer .grab')?.focus(); if (T.selected) ensureVisible(T.selected, true); return true;
      case 'all-inputs': T.allInputs ||= {}; T.allInputs[el.dataset.ref] = !T.allInputs[el.dataset.ref]; renderDrawer(); return true;
      case 'drawer-close': { if (T.from === 'notes' && T.selected) { backToNotes(); return true; } T.from = null; const r = T.selected; const annotations = T.annotationPanel; T.selected = null; T.annotationPanel = false; renderInsights(); renderCanvas(); renderDrawer(); if (annotations) $('#annotations-btn')?.focus(); else if (r) nodeEl(r)?.querySelector('.node-main')?.focus({ preventScroll: true }); return true; }
      case 'expand-all': if (T.tree) { T.autoExpanded = false; T.expanded = new Set([...T.tree.nodes.values()].filter((n) => n.inputs.length).map((n) => n.ref)); renderCanvas(); fitView(true); } return true;
      case 'collapse-all': if (T.tree) { T.expanded = new Set(T.tree.roots || [T.tree.root]); T.followOn = false; renderInsights(); renderCanvas(); renderDrawer(); fitView(true); } return true;
      case 'fit': T.autoExpanded = false; T.userMoved = true; fitView(true, true); return true;
      case 'focus-selection': { const ref = T.selected || T.follow?.at(-1); if (ref) { T.userMoved = true; T.fitTarget = null; centerOn(ref, true); } return true; }
      case 'range-next': S.range = el.dataset.range; render(); return true;
      case 'defs-retry': indexPromise = null; render(); return true;
      case 'values-retry': if (T.tree) { $('#canvas-note').hidden = true; loadTreeValues(T.tree, renderToken); refreshTreeData(); } return true;
      case 'follow': if (T.followOn) stopFollow(); else startFollow(); return true;
      case 'scope': {
        const mode = el.dataset.scope === 'all' ? 'all' : 'root';
        if (mode !== T.mode) {
          // Back from "all metrics": restore the previous root, selection and expansion.
          const b = mode === 'root' ? T.back : null;
          Object.assign(T, { mode, expanded: b?.expanded || null, selected: b?.selected || null, annotationPanel: false, focus: b?.selected || null, tf: null, intro: false, userMoved: false, followOn: false, follow: null, back: null });
          if (b?.root) T.root = b.root;
          render();
        }
        return true;
      }
      case 'zoom-in': zoomBy(1.25); return true;
      case 'zoom-out': zoomBy(1 / 1.25); return true;
      case 'minimap-toggle': {
        T.minimap = !T.minimap;
        $('#minimap')?.classList.toggle('closed', !T.minimap);
        el.setAttribute('aria-expanded', String(T.minimap)); el.setAttribute('aria-label', `${T.minimap ? 'Hide' : 'Show'} minimap`);
        return true;
      }
      case 'root-picker': openRootPicker(el); return true;
      case 'ds-menu': openDateMenu(el); return true;
      case 'period-picker': openPeriodPicker(el); return true;
      case 'movers-toggle': T.moversOpen = !T.moversOpen; renderInsights(); $('.movers-toggle')?.focus(); return true;
      case 'copy-def': { const d = T.tree?.nodes.get(T.selected)?.def?.definition; if (d) copyText(d).then((ok) => toast(ok ? 'Copied' : 'Copy blocked')); return true; }
      default: return false;
    }
  }

  function navigate (ref, key) {
    const T = S.tree; const L = T.layout; const p = L?.pos.get(ref);
    if (!p) return;
    let next = null;
    if (key === 'ArrowRight') {
      if (!T.expanded.has(ref) && T.tree.nodes.get(ref).inputs.length) toggleNode(ref);
      next = T.layout.kids.get(ref)?.[0] || null;
    } else if (key === 'ArrowLeft') {
      if (T.expanded.has(ref) && L.kids.get(ref)?.length) { toggleNode(ref); next = ref; } else next = p.parent;
    } else {
      const col = [...T.layout.pos.entries()].filter(([, q]) => q.depth === p.depth).sort((a, b) => a[1].y - b[1].y).map(([r]) => r);
      const i = col.indexOf(ref);
      next = col[key === 'ArrowDown' ? i + 1 : i - 1] || null;
    }
    if (!next) return;
    T.focus = next;
    root.querySelectorAll('.node-main').forEach((b) => { b.tabIndex = b.dataset.ref === next ? 0 : -1; });
    nodeEl(next)?.querySelector('.node-main')?.focus({ preventScroll: true });
    ensureVisible(next);
  }

  document.addEventListener('keydown', (e) => {
    if (S.view !== 'tree' || !S.tree.tree || (!root.contains(e.target) && e.target !== document.body)) return;
    const t = e.target; const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName);
    if (e.key === 'Escape') {
      if (S.tree.selected || S.tree.annotationPanel) { e.preventDefault(); treeAction('drawer-close'); } else if (S.tree.followOn) { e.preventDefault(); stopFollow(); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    const nodeRef = t.closest?.('.node')?.dataset.ref;
    if (e.key === '+' || e.key === '=') zoomBy(1.25);
    else if (e.key === '-' || e.key === '_') zoomBy(1 / 1.25);
    else if (e.key === '0') treeAction('fit');
    else if (nodeRef && /^Arrow(Up|Down|Left|Right)$/.test(e.key)) navigate(nodeRef, e.key);
    else return;
    e.preventDefault();
  });

  if (!DATASETS.length) {
    root.innerHTML = '<div class="card empty" data-anfra-block="no-metrics" data-anfra-label="No metrics"><b>No metrics found.</b>Add a metric or measure to a dataset.</div>';
    return;
  }
  root.innerHTML = `${tabsHtml(S.view === 'catalogue' ? 'catalogue' : 'tree')}<div class="card empty">${shimmer(200)}</div>`;
  // Dates and definitions load in parallel; the tree skeleton shows meanwhile.
  // The tree asks for its own dataset's date first; the other datasets follow at low priority.
  treeIndex();
  render();
})();
</script>
