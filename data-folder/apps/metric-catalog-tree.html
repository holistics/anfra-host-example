<style>

  :root {

    --shadow-1: 0 1px 2px rgba(24, 20, 31, .08);

    --fs-display: 28px; --fs-title: 20px; --fs-value: 20px; --fs-body: 14px; --fs-caption: 12px; --fs-micro: 12px;

    border-radius: var(--r-sm); padding: 0 var(--s8) 0 var(--s3); color: var(--text); max-width: 100%; font-size: var(--fs-body); }

  .seg button { border: 0; background: none; height: 28px; white-space: nowrap; padding: 0 var(--s3); border-radius: var(--r-xs); font-size: var(--fs-body); color: var(--text-weak); transition: background 120ms ease, color 120ms ease; }
  @media (hover: hover) and (pointer: fine) { .seg button:hover { color: var(--text); } }

  .series-chart .dot { fill: var(--text); }
  .scroll { overflow-x: auto; }
  .scroll.tall { max-height: 460px; overflow-y: auto; }
  .scroll.tall th { position: sticky; top: 0; }
  .sheet td.cell { cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .sheet td.cell:hover { background: var(--hover); } }
  .sheet td.cell.on { background: var(--violet-wash); box-shadow: inset 0 0 0 1.5px var(--violet); }
  .sheet tr.group td { background: var(--surface-2); font-weight: 600; }
  .sheet tr.sub td { font-size: var(--fs-caption); color: var(--text-weak); padding-top: 6px; padding-bottom: 6px; }
  details.aql { margin-top: var(--s3); }
  details.aql summary { cursor: pointer; color: var(--text-muted); font-size: var(--fs-caption); }
  pre.code, details.aql pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: var(--s3); overflow: auto; font: var(--fs-caption)/var(--lh-caption) var(--font-mono); color: var(--text); margin: var(--s1) 0 0; }
  .cell-img { max-height: 48px; max-width: 120px; border-radius: var(--r-xs); vertical-align: middle; }
  @media (hover: hover) and (pointer: fine) { td a:hover { text-decoration: underline; } }
  .dimbar { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; min-height: 48px; padding: var(--s2) var(--s3); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); margin-bottom: var(--s4); }
  .dimbtn { border: 0; background: none; font-size: var(--fs-caption); color: var(--text-weak); font-weight: 600; height: var(--control-h); padding: 0 var(--s1); border-radius: var(--r-xs); }
  @media (hover: hover) and (pointer: fine) { .dimbtn:hover { color: var(--text); } }
  .vsep { width: 1px; height: 20px; background: var(--border-strong); }
  .dchip { display: inline-flex; align-items: center; gap: var(--s1); height: 28px; padding: 0 var(--s2); border-radius: var(--r-sm); font-size: var(--fs-caption); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
  .dchip select { border: 0; background: transparent; color: inherit; font-weight: 600; font-size: var(--fs-caption); max-width: 200px; padding: 0; }
  .dchip button { border: 0; background: none; color: inherit; padding: 0 0 0 2px; opacity: .7; font-size: var(--fs-body); line-height: 1; }
  @media (hover: hover) and (pointer: fine) { .dchip button:hover { opacity: 1; } }
  .dchip.green { border-style: dashed; }
  .dchip.amber { border-color: var(--warn-edge); background: var(--warn-bg); color: var(--warn-text); }
  .badge { font-size: var(--fs-caption); background: var(--text); color: var(--bg); border-radius: 999px; padding: 0 6px; margin-left: var(--s1); }

  /* Floating surfaces */
  .pop { position: absolute; z-index: 50; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); box-shadow: var(--shadow-2); width: min(620px, 92vw); max-height: 70vh; display: flex; flex-direction: column; font: var(--fs-body)/var(--lh-body) var(--font-sans); color: var(--text); transform-origin: top left; opacity: 1; transform: none; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }
  @starting-style { .pop { opacity: 0; transform: scale(.98); } }
  .pop.menu { width: 240px; padding: var(--s1); }
  .menu-item { display: flex; gap: var(--s2); align-items: center; width: 100%; border: 0; background: none; text-align: left; height: var(--control-h); padding: 0 var(--s2); color: var(--text); border-radius: var(--r-sm); transition: transform 160ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .menu-item:hover:not(:disabled) { background: var(--hover); } }
  .menu-item:focus-visible { outline-offset: -2px; }
  .menu-item .mi { width: 16px; text-align: center; color: var(--text-muted); }
  .menu-item .mi { display: inline-grid; place-items: center; }
  .menu-item.fav-on .mi { color: var(--violet-text); }
  .menu-item.fav-on .mi svg { fill: currentColor; }
  .menu-item .mi svg { width: 16px; height: 16px; }
  .menu-sep { height: 1px; background: var(--border); margin: var(--s1) 0; }
  .menu-cap { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-muted); padding: var(--s2) var(--s2) var(--s1); font-weight: 600; }
  .kebab { border: 0; background: none; color: var(--text-muted); font-size: var(--fs-body); width: var(--control-h); height: var(--control-h); border-radius: var(--r-sm); line-height: 1; display: inline-grid; place-items: center; }
  @media (hover: hover) and (pointer: fine) { .kebab:hover { background: var(--hover); color: var(--text); } }
  .fav { color: var(--violet-text); margin-left: var(--s1); display: inline-flex; vertical-align: -1px; }
  .fav svg { width: 12px; height: 12px; fill: currentColor; }
  #fav-only svg { width: 14px; height: 14px; fill: currentColor; color: var(--violet-text); }
  .modal { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 60px var(--s4); overflow: auto; }
  .modal-card { background: var(--surface); border-radius: var(--r-lg); width: min(760px, 100%); box-shadow: var(--shadow-2); border: 1px solid var(--border-strong); }
  .modal-card textarea { width: 100%; height: 260px; font: var(--fs-caption)/var(--lh-caption) var(--font-mono); border: 1px solid var(--border-field); border-radius: var(--r-sm); padding: var(--s3); background: var(--surface-2); color: var(--text); }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: var(--s2) var(--s4); }
  .kv .k { color: var(--text-muted); }
  .toast { position: fixed; bottom: var(--s5); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: var(--s2) var(--s4); border-radius: var(--r-sm); z-index: 70; box-shadow: var(--shadow-2); }
  .pop-head { padding: var(--s3); border-bottom: 1px solid var(--border); display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
  .pop-head .search { min-width: 0; }
  .pop-body { overflow: auto; padding: var(--s2) var(--s3) var(--s3); }
  .pop-foot { padding: var(--s3); border-top: 1px solid var(--border); display: flex; gap: var(--s2); align-items: center; }
  .pick-model { font-weight: 600; font-size: var(--fs-caption); line-height: var(--lh-caption); margin: var(--s3) var(--s1) var(--s1); color: var(--text-muted); }
  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px; }
  .pick-field { text-align: left; border: 1px solid transparent; background: none; border-radius: var(--r-sm); height: var(--control-h); padding: 0 var(--s2); font-size: var(--fs-caption); display: flex; gap: 6px; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); }
  @media (hover: hover) and (pointer: fine) { .pick-field:hover { background: var(--hover); } }
  .pick-field.on { background: var(--violet-wash); color: var(--violet-text); font-weight: 600; }
  .ti { font-size: var(--fs-caption); color: var(--text-faint); font-family: var(--font-mono); min-width: 20px; }
  .frow { display: grid; grid-template-columns: 1.5fr .9fr 1fr 1fr 24px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .frow .select, .frow input { width: 100%; font-size: var(--fs-caption); }
  .frow input { height: var(--control-h); border: 1px solid var(--border-field); border-radius: var(--r-sm); padding: 0 var(--s2); background: var(--surface); color: var(--text); }
  .frow button { border: 0; background: none; color: var(--text-muted); font-size: var(--fs-body); }
  .legend { display: flex; gap: var(--s3); flex-wrap: wrap; font-size: var(--fs-caption); margin: var(--s2) 0 2px; color: var(--text-weak); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .chart .stack { display: flex; flex-direction: column-reverse; border-radius: var(--r-xs) var(--r-xs) 0 0; overflow: hidden; min-height: 2px; }
  .chart .col.on .stack { outline: 2px solid var(--violet); outline-offset: 1px; }
  .chart .col:not(.on) .stack { opacity: .75; }
  .hint { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-muted); text-wrap-style: pretty; }

  @media (max-width: 900px) {
    .detail-grid { grid-template-columns: 1fr; }
    .detail-grid > div + div { border-left: 0; border-top: 1px solid var(--border); }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .hide-sm { display: none; }
    .cat-table { min-width: 0; }
  }
  @media (max-width: 720px) {
    .page { padding: var(--s3) var(--s4) var(--s6); }
    .view-head { align-items: stretch; flex-direction: column; }
    .controls { width: 100%; }
    .controls > .select { flex: 1 1 140px; min-width: 0; }
    .controls > .search { flex: 1 1 100%; min-width: 0; }
    .jump { display: none; }
    .section-head .date-pick { margin-left: 0; width: 100%; }
    .section-head .date-pick .select { flex: 1; min-width: 0; }
    .cat-table th:nth-child(4), .cat-table td:nth-child(4) { display: none; }
    .cat-table { table-layout: auto; }
    .cat-table td:nth-child(3) { white-space: nowrap; }
    .cat-table .row-desc { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    td, th { padding: var(--s2); }
    .toolbar .btn { flex: 1; }
    .dimbar .vsep { display: none; }
    .dimbar { gap: var(--s1) var(--s2); }
  }

  /* ------------------------------------------------------------------
     Metric tree canvas. A tidy left-to-right tree on a pannable, zoomable
     surface. Violet marks the selected node and its path from the root.
     ------------------------------------------------------------------ */
  .tree-shell { position: relative; display: flex; flex-direction: column; overflow: hidden; height: max(520px, calc(100vh - 114px)); }
  .page:has(.tree-shell) { height: 100dvh; display: flex; flex-direction: column; padding-bottom: var(--s4); }
  .page:has(.tree-shell) > .masthead { flex: none; }
  .page .tree-shell { height: auto; min-height: 0; flex: 1; }
  .page .tree-shell .canvas { min-height: 120px; }
  .tree-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border); background: var(--surface); position: relative; z-index: 4; }
  .tree-bar .grp { display: flex; align-items: center; gap: var(--s1); }
  .tree-bar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 var(--s1); flex: none; }
  .tree-bar .spacer { flex: 1; }
  .root-btn { max-width: 360px; font-weight: 600; }
  .period-btn { max-width: 340px; }
  .canvas-tools { position: absolute; left: var(--s3); bottom: var(--s3); z-index: 3; display: flex; align-items: center; gap: var(--s2); max-width: calc(100% - 24px); }
  .canvas-tools .zoom-ctl, .canvas-tools .legend-key { position: static; }
  .period-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back-chip { position: absolute; left: var(--s3); top: var(--s3); z-index: 4; height: 28px; font-size: var(--fs-caption); box-shadow: var(--shadow-1); }
  .zsep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
  .lvl { position: absolute; font-size: 14px; line-height: 20px; color: var(--text-faint); font-weight: 500; white-space: nowrap; pointer-events: none; }
  .canvas.mid .lvl { font-size: 18px; }
  .canvas.far .lvl { display: none; }
  .root-btn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; min-width: 3ch; }
  .root-btn .ds-sfx { flex: 0 1000 auto; }
  .find { position: relative; flex: 0 1 180px; min-width: 132px; }
  .find .search { width: 100%; min-width: 0; padding-left: 32px; padding-right: 28px; }
  .find > svg { position: absolute; left: 10px; top: 8px; color: var(--text-muted); pointer-events: none; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--text); font-weight: 600; text-decoration: underline; text-decoration-color: var(--violet); text-underline-offset: 3px; border-radius: var(--r-xs); }
  @media (hover: hover) and (pointer: fine) { .link-btn:hover { color: var(--violet-text); } }
  .abs { margin-left: 4px; font-size: var(--fs-caption); color: var(--text-muted); font-weight: 500; }
  .desc { font-size: var(--fs-body); line-height: var(--lh-body); color: var(--text-weak); text-wrap: pretty; }
  .row-desc { margin-top: 2px; font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }

  .canvas { position: relative; flex: 1 1 auto; min-height: 280px; overflow: clip; touch-action: none; cursor: grab; background-color: var(--bg);
    background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1.2px); background-size: 20px 20px; outline: none; }
  .canvas.panning { cursor: grabbing; }
  .canvas.panning .node { pointer-events: none; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .canvas.glide .world { transition: transform 200ms var(--ease-out); }
  .canvas.glide { transition: background-position 200ms var(--ease-out), background-size 200ms var(--ease-out); }
  .edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .edges path { fill: none; stroke: var(--text-faint); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
  .edges path.cross { stroke-dasharray: 4 4; }
  .edges path.ah { fill: var(--text-faint); stroke: none; }
  .edges path.ah.on { fill: var(--violet); }
  .edges path.on { stroke: var(--violet); stroke-width: 2px; }
  .edges path.dim { opacity: .35; }

  .node { position: absolute; width: 224px; height: 96px; transition: opacity 160ms ease; }
  .node.dim { opacity: .45; }
  .node-main { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 2px; padding: var(--s3) var(--s4) var(--s3) var(--s3); overflow: hidden; text-align: left; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-md); color: var(--text); box-shadow: var(--shadow-1); transition: border-color 120ms ease, box-shadow 120ms ease; }
  @media (hover: hover) and (pointer: fine) { .node-main:hover { border-color: var(--text-muted); } }
  .node.on-path .node-main { border-color: var(--violet); }
  .node.is-selected .node-main { border-color: var(--violet); box-shadow: 0 0 0 3px color-mix(in srgb, var(--violet) 35%, transparent); }
  .node.flash .node-main { animation: flash 1.2s var(--ease-out); }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--violet) 45%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .node-name { display: flex; align-items: center; gap: 6px; font-size: var(--fs-body); line-height: var(--lh-body); font-weight: 600; min-width: 0; }
  .node-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node.on-path .node-name, .node.is-selected .node-name { color: var(--violet-text); }
  .nodata { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-caption); font-weight: 500; color: var(--text-muted); }
  .nodata::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--text-muted); }
  .used { position: absolute; top: -10px; right: var(--s4); z-index: 2; height: 20px; padding: 0 var(--s2); display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); font-size: var(--fs-caption); font-weight: 500; color: var(--text-muted); white-space: nowrap; pointer-events: none; }
  .canvas.far .used, .canvas.tiny .used { display: none; }
  .canvas.mm-overlap .minimap { opacity: 0; pointer-events: none; }
  .node.is-driver .node-main { border-color: var(--violet); border-style: dashed; }
  .canvas-skel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 88px; pointer-events: none; }
  .canvas-skel .sk { display: block; width: 224px; height: 96px; border-radius: var(--r-md); background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite; }
  .canvas-skel .sk-col { display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 720px) { .canvas-skel { gap: 24px; } .canvas-skel .sk { width: 140px; height: 64px; } }
  .node-value { font-size: var(--fs-value); line-height: 24px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-value.none { color: var(--text-faint); }
  .node-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 24px; }
  .node-foot .spark { width: 64px; }
  .node-toggle { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); z-index: 2; display: inline-flex; align-items: center; gap: 2px; height: 24px; min-width: 28px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border-field); background: var(--surface); color: var(--text-weak); font-size: var(--fs-caption); font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { .node-toggle:hover { color: var(--text); background: var(--hover); } }
  .node-toggle::before { content: ""; position: absolute; inset: -6px -4px; }
  .node-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .node-toggle svg { width: 12px; height: 12px; transition: transform 160ms var(--ease-out); }
  .node-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .node-toggle[aria-expanded="true"] { border-color: var(--border-strong); }
  /* Far zoom: name and change only. */
  /* Mid zoom (below 80%): larger card text so it stays readable on screen. */
  .canvas.mid .node-main { padding: 8px 14px 8px 12px; gap: 0; }
  .canvas.mid .node-name { font-size: 19px; line-height: 23px; }
  .canvas.mid .node-value { font-size: 22px; line-height: 27px; }
  .canvas.mid .node .delta { font-size: 19px; line-height: 22px; }
  .canvas.mid .node .delta svg { width: 13px; height: 13px; }
  .canvas.mid .nodata, .canvas.mid .used { display: none; }
  .canvas.mid .node-toggle { height: 34px; min-width: 44px; right: -22px; font-size: 18px; }
  .canvas.mid .node-toggle svg { width: 16px; height: 16px; }
  /* Far zoom (below 50%): label-only chips. */
  .canvas.far .node-value, .canvas.far .node-foot { display: none; }
  .canvas.far .node-main { justify-content: center; }
  .canvas.far .node-name { font-size: 28px; line-height: 34px; }
  .canvas.far .node-name span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  /* Overview zoom: each card becomes a block tinted by change direction. */
  .canvas.tiny .node-foot, .canvas.tiny .nodata, .canvas.tiny .node-value { display: none; }
  .canvas.tiny .node-name { font-size: 28px; line-height: 34px; }
  .canvas.tiny .node-name span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .canvas.tiny .node-toggle { display: none; }
  .canvas.tiny .node.d-up .node-main { background: color-mix(in srgb, var(--up-mark) 30%, var(--surface)); border-color: var(--up-mark); }
  .canvas.tiny .node.d-down .node-main { background: color-mix(in srgb, var(--down-mark) 30%, var(--surface)); border-color: var(--down-mark); }
  .canvas.tiny .node.is-selected .node-main { box-shadow: 0 0 0 12px var(--violet); }

  .legend-key { position: absolute; left: 132px; bottom: var(--s3); z-index: 3; display: flex; align-items: center; gap: var(--s3); height: var(--control-h); padding: 0 var(--s3); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); font-size: var(--fs-caption); color: var(--text-muted); white-space: nowrap; }
  .legend-key .k { display: inline-flex; align-items: center; gap: 4px; }
  .legend-key svg { width: 9px; height: 9px; fill: currentColor; }
  .legend-key .up svg { color: var(--up-mark); }
  .legend-key .down svg { color: var(--down-mark); }
  .legend-key .drv i { width: 12px; height: 9px; border-radius: 2px; border: 1.5px dashed var(--violet); }
  .legend-key .note .sm { display: none; }
  .legend-key .note i { width: 8px; height: 8px; border-radius: 50%; background: var(--violet); }
  .legend-key .none i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--text-muted); }
  .canvas:not(.mm-ready) .minimap { display: none; }
  .edges path.cross:not(.on) { opacity: 0; transition: opacity 120ms ease; }
  .edges path.cross.show { opacity: .9; }
  .zoom-ctl { position: absolute; left: var(--s3); bottom: var(--s3); z-index: 3; display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); box-shadow: var(--shadow-1); }
  .zoom-ctl button { width: var(--control-h); height: var(--control-h); border: 0; background: none; color: var(--text-weak); display: grid; place-items: center; border-radius: var(--r-sm); }
  @media (hover: hover) and (pointer: fine) { .zoom-ctl button:hover { background: var(--hover); color: var(--text); } }
  .zoom-ctl .pct { min-width: 44px; text-align: center; font-size: var(--fs-caption); color: var(--text-weak); font-weight: 500; }

  .minimap { position: absolute; right: var(--s3); bottom: var(--s3); z-index: 3; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); box-shadow: var(--shadow-1); overflow: hidden; }
  .minimap-head { display: flex; justify-content: flex-end; }

<div id="root" class="page" data-anfra-container="page" data-anfra-label="Metric Catalog"></div>


<script>
(() => {
  const H = window.Anfra;
  const root = document.getElementById('root');

  /* NOTES: the clone point. Authored context that ships with this file; edit or empty it for another repo.
     Keys are stable ids (dataset uname, metric ref), never labels. Entries not in the loaded tree are skipped.
     about: one "About this tree" text (max 160 chars). usage: one "Usage note" per metric (max 140 chars),
     with optional author and date (YYYY-MM-DD); a caption such as "Alex · 2026-09-30" shows only when one is set.
     groups: a labelled frame around member metrics. sources: the app a metric comes from (host path). */
  const NOTES = {
    about: [
      { dataset: 'metric_layers', metric: 'profit', text: 'Links show which metrics each formula uses, not causes. The data is synthetic, daily by channel and device, and ends on 2025-12-31.' },
    ],
    usage: [
      { dataset: 'metric_layers', metric: 'profit', text: 'Profit is revenue minus total cost. A small % change here can hide large moves in both branches.' },
      { dataset: 'metric_layers', metric: 'conversion_rate', text: 'Read the % change as relative. A move from 3.0% to 3.3% is +10%, or +0.3 percentage points.' },
      { dataset: 'metric_layers', metric: 'paid_sessions', text: 'Two formulas use this metric: sessions and marketing cost. It feeds both the revenue and the cost branch.' },
      { dataset: 'metric_layers', metric: 'sessions', text: 'Orders multiplies sessions by conversion rate, and conversion rate divides by sessions. Sessions shows up twice.' },
      { dataset: 'metric_layers', metric: 'cost_per_paid_session', text: 'This divides all marketing cost, email included, by paid social sessions only.' },
      { dataset: 'metric_layers', metric: 'shipping_cost', text: 'Part of shipping cost is a daily amount that barely depends on orders, so it moves less than orders.' },
      { dataset: 'metric_layers', metric: 'support_cost', text: 'Most of support cost is a daily team amount that barely depends on customers, so it changes little when customers change.' },
      { dataset: 'metric_layers', metric: 'discount_rate', text: 'Discount rate is discount over list sales. A rise lowers average unit price through its formula.' },
    ],
    groups: [
      { dataset: 'metric_layers', metric: 'total_cost', label: 'Cost components', members: ['product_cost', 'shipping_cost', 'marketing_cost', 'support_cost'] },
    ],
    sources: [
      { dataset: 'consistency_scan', metric: 'net_revenue', label: 'Sales overview', path: '/apps/consistency-scan/governed-view' },
      { dataset: 'consistency_scan', metric: 'paid_orders', label: 'Sales overview', path: '/apps/consistency-scan/governed-view' },
      { dataset: 'consistency_scan', metric: 'aov', label: 'Sales overview', path: '/apps/consistency-scan/governed-view' },
      { dataset: 'consistency_scan', metric: 'gross_revenue', label: 'Revenue dashboard', path: '/apps/consistency-scan/revenue-dashboard' },
    ],
  };
  // Notes for a loaded tree. Text is read-only; it is not stored anywhere else.
  const noteKey = (ds, ref) => (e) => e.dataset === ds.uname && e.metric === ref;
  const usageNote = (ds, ref) => NOTES.usage.find(noteKey(ds, ref))?.text || '';
  const sourceOf = (ds, ref) => NOTES.sources.find(noteKey(ds, ref)) || null;
  function notesFor (tree) {
    if (!tree) return { about: null, usage: [], groups: [] };
    const inTree = (e) => e.dataset === tree.ds.uname && tree.nodes.has(e.metric);
    return { about: NOTES.about.find(inTree) || null, usage: NOTES.usage.filter(inTree), groups: NOTES.groups.filter(inTree) };
  }

  /* ----------------------------------------------------------------
  Catalogue model — everything comes from Anfra.datasets
  ---------------------------------------------------------------- */
  const CHUNK = 12;
  const humanize = (s) => String(s).replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
  const isDateType = (t) => /date|time/i.test(t || '');
  const isNumberType = (t) => /number|int|float|double|decimal|numeric/i.test(t || '');

  function pickDateField (fields) {
    const score = (f) => {
      const n = f.name;
      let s = 0;
      if (/^(date|day|created_at|created_date|event_date|event_at|occurred_at)$/.test(n)) s += 4;
      if (/date|_at$|time/.test(n)) s += 1;
      if (/updated|deleted|birth|dob|expire|end|modified/.test(n)) s -= 4;
      return s;
    };
    return [...fields].sort((a, b) => score(b) - score(a))[0];
  }

  // Internal key columns (row keys, ids, primary keys) are not offered to break down or filter by.
  const isKeyField = (f) => !!(f.primary_key || f.is_primary_key || f.primaryKey) || /(^|_)(row_key|key|id|uuid|pk)$/i.test(f.name || '');
  const DATASETS = Object.entries(H.datasets).map(([uname, ds]) => {
    const dateFields = []; const dimFields = []; const measures = []; const fieldsByModel = {};
    for (const m of ds.data_models || []) {
      const modelLabel = m.label || humanize(m.name);
      for (const f of m.fields || []) {
        const item = {
          ref: `${m.name}.${f.name}`, name: f.name, model: m.name, modelLabel, label: f.label || humanize(f.name), type: f.type,
          key: isKeyField(f),
        };
        if (f.is_custom_measure) { measures.push(item); continue; }
        (fieldsByModel[m.name] ||= []).push(item);
        if (isDateType(f.type)) dateFields.push(item);
        else if (!isNumberType(f.type) && !item.key) dimFields.push(item);
      }
    }
    const metrics = (ds.metrics || []).map((m) => ({
      ref: m.name, label: m.label || humanize(m.name), kind: 'metric', source: 'Dataset metric', description: m.description || '',
    }));
    measures.forEach((m) => metrics.push({
      ref: m.ref, label: m.label, kind: 'measure', source: `${m.modelLabel} measure`,
    }));
    const ds_ = {
      uname, label: ds.label || humanize(ds.name || uname), dateFields, dimFields, fieldsByModel, metrics,
      modelLabels: Object.fromEntries((ds.data_models || []).map((m) => [m.name, m.label || humanize(m.name)])),
      dateRef: pickDateField(dateFields)?.ref,
    };
    ds_.allFields = Object.values(fieldsByModel).flat();
    ds_.fieldMap = Object.fromEntries(ds_.allFields.map((f) => [f.ref, f]));
    metrics.forEach((m) => { m.id = `${uname}::${m.ref}`; m.ds = ds_; });
    return ds_;
  }).filter((d) => d.metrics.length).sort((a, b) => a.label.localeCompare(b.label));

  const METRICS = Object.fromEntries(DATASETS.flatMap((d) => d.metrics).map((m) => [m.id, m]));
  const dateField = (ds) => ds.dateFields.find((f) => f.ref === ds.dateRef);

  /* ----------------------------------------------------------------
  Dates, ranges and grains
  ---------------------------------------------------------------- */
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const monthStart = (d, offset = 0) => new Date(d.getFullYear(), d.getMonth() + offset, 1);
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const minusYear = (d) => new Date(d.getFullYear() - 1, d.getMonth(), d.getDate());
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const RANGES = {
    ytd: { label: 'Year to date', grain: 'month', span: (t) => [new Date(t.getFullYear(), 0, 1), t] },
    l3m: { label: 'Past 3 months', grain: 'week', months: 3 },
    l6m: { label: 'Past 6 months', grain: 'month', months: 6 },
    l12m: { label: 'Past 12 months', grain: 'month', months: 12 },
    l18m: { label: 'Past 18 months', grain: 'month', months: 18 },
    l24m: { label: 'Past 24 months', grain: 'month', months: 24 },
  };
  const COMPARE = { prev: 'vs previous period', yoy: 'vs same period last year' };
  const GRAINS = ['week', 'month', 'quarter', 'year'];

  // Ranges end at the dataset's latest data date, not today, so stale data still shows.
  // One max(date) query per dataset and date field, cached.
  const ANCHOR = {};
  const dataTo = (ds) => { const a = ds && ds.dateRef && ANCHOR[anchorKey(ds)]; return a ? `Data ends ${MONTHS[a.getMonth()]} ${a.getDate()}, ${a.getFullYear()}` : ''; };
  const anchorKey = (ds) => `${ds.uname}|${ds.dateRef}`;
  function anchorOf (ds) {
    const a = ds && ANCHOR[anchorKey(ds)]; const t = today();
    return a && a < t ? a : t;
  }
  // Up to 3 tries with backoff. A failure is not stored, so values never use a guessed period.
  async function loadAnchor (ds) {
    const spec = { mx: { dataset: ds.uname, aql: `explore {\n  measures { mx: max(${ds.dateRef}) }\n}` } };
    for (let i = 0; i < 3; i += 1) {
      if (i) await new Promise((r) => setTimeout(r, i === 1 ? 1500 : 4000));
      try {
        const { mx } = await run(spec);
        if (!mx.error) { ANCHOR[anchorKey(ds)] = toDate(mx.rows?.[0]?.mx); return; }
      } catch (_) { /* try again */ }
    }
  }
  function loadAnchors (list) {
    return Promise.all(list.filter((ds) => ds.dateRef && !(anchorKey(ds) in ANCHOR)).map(loadAnchor));
  }
  // A date as the warehouse returns it: ISO text, a Date, epoch milliseconds or epoch days.
  function toDate (v) {
    if (v instanceof Date && !Number.isNaN(+v)) return new Date(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate());
    if (typeof v === 'number' || (typeof v === 'string' && /^-?\d+$/.test(v))) {
      const n = Number(v); const d = new Date(Math.abs(n) > 1e11 ? n : n * 864e5);
      return Number.isNaN(+d) ? null : new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    }
    return parsePeriod(v);
  }
  function spanOf (key, ds) {
    const r = RANGES[key]; const t = anchorOf(ds);
    return r.span ? r.span(t) : [monthStart(t, -(r.months - 1)), t];
  }
  // Previous period: the same length right before. Same period last year: one year back.

    const groups = Object.entries(byModel);

  }
  pop.addEventListener('input', (e) => {
    const el = e.target; const P = popState;

  });
  pop.addEventListener('change', (e) => {

  });
  pop.addEventListener('keydown', (e) => { if (e.key === 'Enter' && popState?.kind === 'filter') pop.querySelector('[data-pa=apply]').click(); });
  pop.addEventListener('click', (e) => {
    const el = e.target.closest('[data-pa]'); if (!el) return;
    const P = popState; const a = el.dataset.pa;
    if (a === 'pick') {
      const { ref } = el.dataset; const { kind, localId } = P; closePop();
      if (localId) {
        const cur = S.sheet.local[localId];
        S.sheet.local[localId] = cur?.breakdown === ref ? { mode: cur.mode } : { breakdown: ref, mode: cur?.mode || 'subline' };
        S.sheet.cell = null; render(); return;
      }
      if (kind === 'drill') addDrill(ref);
      else { S.slice.breakdown = S.slice.breakdown === ref ? null : ref; if (S.slice.breakdown) S.detail.dim = ref; render(); }

    }
    if (a === 'menu') { const id = P.metricId; closePop(true); menuCommand(el.dataset.cmd, id); return; }
    if (a === 'conj') P.draft.conj = el.dataset.v;

  document.addEventListener('mousedown', (e) => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('[data-action=pop]')) closePop(); });

  /* ----------------------------------------------------------------
  Metric overflow menu
  ---------------------------------------------------------------- */
  const modal = document.createElement('div'); modal.className = 'modal'; modal.hidden = true;
  const toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.hidden = true; toastEl.setAttribute('role', 'status');
  document.body.append(modal, toastEl);
  let toastTimer;
  // One star everywhere: the panel's SVG star, filled.
  const favMark = () => `<span class="fav" role="img" aria-label="Favorite" title="Favorite">${ICON.star}</span>`;
  const toast = (msg) => {
    // Above the bottom sheet on small screens: 8px over the sheet's top edge.
    const sh = document.querySelector('#drawer'); const sheet = sh && !sh.hidden && getComputedStyle(sh).position === 'fixed';
    toastEl.style.bottom = sheet ? `${Math.round(window.innerHeight - sh.getBoundingClientRect().top + 8)}px` : '';
    toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2500); };
  const showModal = (title, body) => {
    modal.innerHTML = `<div class="modal-card"><div class="panel-head"><h3>${title}</h3><span style="flex:1"></span><button class="btn" data-modal="close">Close</button></div><div style="padding:16px 20px">${body}</div></div>`;
    modal.hidden = false;
  };
  modal.addEventListener('click', (e) => {
    if (e.target === modal || e.target.closest('[data-modal=close]')) { modal.hidden = true; return; }
    if (e.target.closest('[data-modal=copy]')) {

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.hidden = true; });

  // The trend a metric's menu acts on: the view's own range, grain and slice when it has them.
  function contextTrend (m) {
    const ds = m.ds;
    const onDetail = S.view === 'metric' && S.metricId === m.id; const onSheet = S.view === 'sheet';
    const ctx = onDetail ? S.detail : onSheet ? S.sheet : { range: S.range, grain: RANGES[S.range].grain };
    const extra = onDetail || onSheet ? sliceFilters(ds) : [];
    return { ctx, spec: { dataset: ds.uname, aql: aql.trend(ds, [m], ctx.grain, spanOf(ctx.range, ds), extra) } };
  }

  function menuCommand (cmd, id) {
    const m = METRICS[id];
    if (cmd === 'explore') openMetric(id);
    if (cmd === 'trace') traceMetric(id);
    if (cmd === 'copy-def') loadDefinitions(m.ds).then((d) => { const t = d.byRef?.[m.ref]?.definition; if (!t) { toast('No definition found'); return; } copyText(t).then((ok) => toast(ok ? 'Definition copied' : 'Press ⌘C to copy')); });
    if (cmd === 'open-source') { const src = sourceOf(m.ds, m.ref); if (src) openSource(src.path); }
    if (cmd === 'refresh') { refreshDataset(m.ds.uname); render(); toast('Refreshing…'); }
    if (cmd === 'add-sheet') {
      if (S.selected.has(id)) { S.selected.delete(id); toast('Removed from sheet'); } else { S.selected.add(id); toast('Added to sheet'); }
      render();
    }
    if (cmd === 'row-breakdown') {
      const anchor = root.querySelector(`.kebab[data-id="${CSS.escape(id)}"]`);
      openPop(anchor, 'breakdown', m.ds.allFields); popState.anchor = anchor; popState.localId = id; renderPop();
    }
    if (cmd === 'row-mode') { const l = S.sheet.local[id]; l.mode = l.mode === 'replace' ? 'subline' : 'replace'; S.sheet.cell = null; render(); }
    if (cmd === 'row-breakdown-clear') { S.sheet.local[id] = { mode: S.sheet.local[id]?.mode }; S.sheet.cell = null; render(); }
    if (cmd === 'new-sheet') { S.sheet.range = S.range; S.sheet.grain = RANGES[S.range].grain; S.selected = new Set([id]); S.sheet.cell = null; S.view = 'sheet'; render(); window.scrollTo(0, 0); }

      if (S.favorites.has(id)) S.favorites.delete(id); else S.favorites.add(id);
      if (!S.favorites.size) S.favOnly = false;
      render(); toast(S.favorites.has(id) ? 'Added to favorites' : 'Removed from favorites');
    }
    if (cmd === 'copy-csv' || cmd === 'details') {
      if (!m.ds.dateRef) { toast('No date field'); return; }
      const { ctx, spec } = contextTrend(m);
      showModal(esc(m.label), shimmer(240));
      run({ trend: spec }).then(({ trend }) => {
        if (modal.hidden) return;
        if (cmd === 'copy-csv') {
          if (trend.error) { showModal('Copy as CSV', errBox(trend.error)); return; }

                const df = dateField(m.ds);
        showModal(`${esc(m.label)}`, `
          <div class="kv">
            <div class="k">Source</div><div>${esc(m.source)}</div>
            <div class="k">Dataset</div><div>${esc(m.ds.label)} <span class="ref">${esc(m.ds.uname)}</span></div>

  /* ----------------------------------------------------------------
  Catalogue view
  ---------------------------------------------------------------- */
  function catKey (ds) { return `${ds.uname}|${ds.dateRef}|${S.range}|${S.cmp}`; }

  function loadCatalogue (ds) {
    const key = catKey(ds);
    if (S.catData[key] || !ds.dateRef) return;
    const entry = S.catData[key] = { byRef: {}, errors: [], pending: 1 };
    loadAnchors([ds]).catch(() => {}).then(() => {
    entry.pending -= 1;
    const span = spanOf(S.range, ds); const prevSpan = compareSpan(S.range, S.cmp, ds); const grain = RANGES[S.range].grain;
    for (const group of chunks(ds.metrics, CHUNK)) {
      entry.pending += 1;
      run({
        cur: { dataset: ds.uname, aql: aql.totals(ds, group, span) },
        prev: { dataset: ds.uname, aql: aql.totals(ds, group, prevSpan) },
        trend: { dataset: ds.uname, aql: aql.trend(ds, group, grain, span) },
      }).then((res) => {
        const periods = res.trend.rows ? sortedPeriods(res.trend.rows) : [];
        group.forEach((m, i) => {
          entry.byRef[m.ref] = {
            cur: res.cur.rows?.[0]?.[`m${i}`],
            prev: res.prev.rows?.[0]?.[`m${i}`],
            spark: periods.map((p) => p.row[`m${i}`]),
            error: res.cur.error,
          };
        });
        for (const r of [res.cur, res.trend]) if (r.error && !entry.errors.includes(r.error)) entry.errors.push(r.error);
      }).catch((e) => { entry.errors.push(e.message || String(e)); })
        .finally(() => { entry.pending -= 1; if (S.view === 'catalogue') renderCatList(); else if (S.view === 'metric' && !entry.pending && METRICS[S.metricId]?.ds === ds) renderDetailFacts(ds, METRICS[S.metricId], renderToken); });
    }
    });
  }

  function matches (m) {
    const q = S.search.trim().toLowerCase();
    return !q || `${m.label} ${m.ref} ${m.ds.label} ${m.source} ${descOf(m.ds, m.ref)}`.toLowerCase().includes(q);
  }

  // How many metrics of the same dataset reference each metric, from the definitions.

            return `<tr>

                <div class="row-desc" title="${esc(descOf(ds, m.ref))}">${!ds.usedBy && !m.description ? '' : descOf(ds, m.ref) ? esc(descOf(ds, m.ref)) : '<span class="faint">Not documented</span>'}</div></td>

          <span class="date-pick">${dateSel}</span>

        ${isOpen ? `<div class="card">${body}</div>` : ''}
      </div>`;
    }).join('');
  }

  /* ----------------------------------------------------------------

  ---------------------------------------------------------------- */

  const DIM_PICK = {}; const dimPickP = {};

    if (ds.uname in DIM_PICK) return Promise.resolve(DIM_PICK[ds.uname]);
    if (dimPickP[ds.uname]) return dimPickP[ds.uname];
    const cands = breakdownCandidates(ds).slice(0, 16);
    const fallback = cands[0]?.ref || ds.dimFields[0]?.ref || '';
    if (!cands.length) { DIM_PICK[ds.uname] = fallback; return Promise.resolve(fallback); }

      .then(({ n }) => {
        const row = n.rows?.[0] || {};

        return (DIM_PICK[ds.uname] = hit?.ref || fallback);

    run(specs).then(({ trend, by: byRes, cur, prev }) => {

      // Compact numbers on screen, the exact value in a tooltip. Ratios read as percents.
      const mv = { cur: last.v, prev: before?.v, spark: periods.map((p) => p.v) };

      const every = Math.ceil(periods.length / (narrow() ? 4 : 9));

      // Y axis with 3 ticks. Ratios start from a baseline just under their lowest value, not zero.

      const axis = `<div class="axis">${periods.map((p, i) => `<span>${i % every === 0 || i === periods.length - 1 ? esc(periodLabel(p.start, D.grain, true)) : ''}</span>`).join('')}</div>`;

    const x = (i) => left + i * (width - left - right) / Math.max(points.length - 1, 1);
    const y = (v) => top + (high - v) * (height - top - bottom) / (high - low || 1);
    const paths = []; let path = [];
    points.forEach((v, i) => {
      if (v === null) { if (path.length) paths.push(path); path = []; }
      else path.push(`${path.length ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    });
    if (path.length) paths.push(path);
    return `<div class="panel-head"><h3>${esc(entry.label)}</h3><span class="muted">${points.length} periods</span><span style="flex:1"></span><button class="btn" data-action="close-series">Close</button></div>

    const groups = DATASETS.map((ds) => ({ ds, metrics: picked.filter((m) => m.ds === ds) })).filter((g) => g.metrics.length);

    root.innerHTML = `${tabsHtml('catalogue')}
      <div class="view-head" data-anfra-block="sheet-header" data-anfra-label="Sheet range and grain">
        <div class="crumbs"><button data-action="home">← Catalog</button><span class="faint">/</span><b>Sheet (${picked.length})</b></div>
        <div class="controls">
          <select class="select" data-bind="sheet.range" aria-label="Period">${options(Object.entries(RANGES).map(([k, r]) => [k, r.label]), T.range)}</select>
          <div class="seg" role="group" aria-label="Grain">${GRAINS.map((g) => `<button class="${g === T.grain ? 'on' : ''}" aria-pressed="${g === T.grain}" data-action="grain" data-target="sheet" data-grain="${g}">${humanize(g)}</button>`).join('')}</div>
        </div>
      </div>
      ${dimBar({ breakdown: true })}
      <div class="card" id="series-panel" style="margin-bottom:16px" hidden data-anfra-block="series" data-anfra-label="Time series"></div>
      <div class="card scroll" id="sheet" data-anfra-block="sheet" data-anfra-label="Metric sheet">${shimmer(300)}</div>
      <div id="sheet-detail" data-anfra-container="selected-detail" data-anfra-label="Selected value"></div>`;

    Promise.all(groups.map(({ ds, metrics }) => {
      if (!ds.dateRef) return Promise.resolve({ ds, metrics, res: { error: 'No date field.' }, by: {} });
      const extra = sliceFilters(ds);
      const specs = { trend: { dataset: ds.uname, aql: aql.trend(ds, metrics, T.grain, spanOf(T.range, ds), extra) } };
      metrics.forEach((m, i) => {
        const b = sheetBreakdown(m);
        if (b) specs[`by${i}`] = { dataset: ds.uname, aql: aql.trendBy(ds, m, T.grain, b.ref, spanOf(T.range, ds), extra) };
      });
      return run(specs).then((r) => ({ ds, metrics, res: r.trend, by: r }));
    })).then((results) => {
      if (token !== renderToken) return;
      const keys = new Map();
      for (const r of results) for (const p of r.res.rows ? sortedPeriods(r.res.rows) : []) keys.set(iso(p.start), p.start);
      const cols = [...keys.values()].sort((a, b) => a - b);
      const lookup = (r, i) => {
        const map = {};
        for (const p of r.res.rows ? sortedPeriods(r.res.rows) : []) map[iso(p.start)] = p.row[`m${i}`];
        return map;
      };
      const segmentsOf = (res) => {
        const totals = new Map(); const cells = new Map();
        for (const p of sortedPeriods(res.rows)) {
          const k = p.row.dim; const v = num(p.row.m0);
          totals.set(k, (totals.get(k) || 0) + Math.abs(v || 0));
          cells.set(`${iso(p.start)}|${k}`, v);
        }
        const ranked = [...totals.entries()].sort((a, b) => b[1] - a[1]);
        return {
          more: Math.max(0, ranked.length - SEG_LIMIT),
          segs: ranked.slice(0, SEG_LIMIT).map(([k], i) => ({ k, color: PALETTE[i % PALETTE.length], map: Object.fromEntries(cols.map((c) => [iso(c), cells.get(`${iso(c)}|${k}`)])) })),
        };
      };
      sheetSegs = []; sheetCharts = new Map();
      const cellsRow = (m, map, seg) => cols.map((c) => {
        const segIdx = seg ? sheetSegs.length - 1 : '';
        const on = T.cell && T.cell.id === m.id && T.cell.period === iso(c) && (T.cell.seg ?? '') === segIdx;
        return `<td class="num cell ${on ? 'on' : ''}" data-action="cell" data-id="${esc(m.id)}" data-period="${iso(c)}" data-seg="${segIdx}">${fmt(map[iso(c)])}</td>`;
      }).join('');
      const kebab = (m) => `<button class="kebab" data-action="pop" data-pop="kebab" aria-haspopup="menu" aria-expanded="false" data-id="${esc(m.id)}" aria-label="More actions for ${esc(m.label)}">${ICON.more}</button>`;

      root.querySelector('#sheet').innerHTML = `<table class="sheet">
        <thead><tr><th>Metric</th><th class="hide-sm"></th>${cols.map((c) => `<th class="num">${esc(periodLabel(c, T.grain))}</th>`).join('')}</tr></thead>
        <tbody>${results.map((r) => `
          <tr class="group"><td colspan="${cols.length + 2}">${esc(r.ds.label)}${skippedSlice(r.ds).length ? ` <span class="hint" style="font-weight:400">· Filter skipped: ${skippedSlice(r.ds).map((ref) => esc(fieldByRef(ref)?.label || ref)).join(', ')}</span>` : ''}${S.slice.breakdown && !r.ds.fieldMap[S.slice.breakdown] ? ` <span class="hint" style="font-weight:400">· Breakdown skipped</span>` : ''}</td></tr>
          ${r.res.error ? `<tr><td colspan="${cols.length + 2}">${errBox(r.res.error)}</td></tr>` : r.metrics.map((m, i) => {
            const map = lookup(r, i);
            sheetCharts.set(`${m.id}|`, { label: m.label, values: cols.map((c) => map[iso(c)]), cols });
            const b = sheetBreakdown(m); const byRes = r.by[`by${i}`];
            const bField = b ? r.ds.fieldMap[b.ref] : null;
            const chip = b ? `<span class="dchip green" style="margin-left:6px">by ${esc(bField.label)}${b.local ? `<button data-action="row-breakdown-clear" data-id="${esc(m.id)}" aria-label="Remove breakdown">×</button>` : ''}</span>` : '';
            const main = `<tr><td style="white-space:nowrap"><button class="metric-name" data-action="open-metric" data-id="${esc(m.id)}">${esc(m.label)}</button> ${kebab(m)}${chip}</td>
              <td class="hide-sm"><button class="spark-button ${T.chart?.id === m.id && !T.chart.seg ? 'on' : ''}" data-action="show-series" data-id="${esc(m.id)}" data-seg="" title="Show time series for ${esc(m.label)}" aria-label="Show time series for ${esc(m.label)}">${spark(cols.map((c) => map[iso(c)]), 'navy')}</button></td>${cellsRow(m, map, null)}</tr>`;
            if (!b || !byRes) return main;
            if (byRes.error) return `${main}<tr><td colspan="${cols.length + 2}">${errBox(`Breakdown by ${bField.label} failed: ${byRes.error}`)}</td></tr>`;
            const { segs, more } = segmentsOf(byRes);
            const subs = segs.map((g) => {
              sheetSegs.push({ ref: b.ref, value: g.k });
              const segIdx = sheetSegs.length - 1;
              sheetCharts.set(`${m.id}|${segIdx}`, { label: `${m.label} · ${g.k === null ? '∅ (empty)' : String(g.k)}`, values: cols.map((c) => g.map[iso(c)]), cols });
              return `<tr class="sub"><td style="padding-left:${b.mode === 'replace' ? 12 : 28}px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis">
                  <i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${g.color};margin-right:6px"></i>${g.k === null ? '<span class="faint">∅ (empty)</span>' : esc(g.k)}${b.mode === 'replace' ? ` <span class="faint">· ${esc(m.label)}</span>` : ''}</td>
                <td class="hide-sm"><button class="spark-button ${T.chart?.id === m.id && T.chart.seg === String(segIdx) ? 'on' : ''}" data-action="show-series" data-id="${esc(m.id)}" data-seg="${segIdx}" title="Show time series for ${esc(m.label)} · ${esc(g.k === null ? 'empty' : g.k)}" aria-label="Show time series for ${esc(m.label)} · ${esc(g.k === null ? 'empty' : g.k)}">${spark(cols.map((c) => g.map[iso(c)]), 'navy')}</button></td>${cellsRow(m, g.map, g)}</tr>`;
            }).join('');
            const tail = more ? `<tr class="sub"><td colspan="${cols.length + 2}" class="hint" style="padding-left:28px">+${more} more</td></tr>` : '';
            return b.mode === 'replace' ? `<tr><td colspan="${cols.length + 2}" style="white-space:nowrap"><button class="metric-name" data-action="open-metric" data-id="${esc(m.id)}">${esc(m.label)}</button> ${kebab(m)}${chip}</td></tr>${subs}${tail}` : main + subs + tail;
          }).join('')}`).join('')}
        </tbody></table>`;
      const chart = T.chart && sheetCharts.get(`${T.chart.id}|${T.chart.seg}`);
      const panel = root.querySelector('#series-panel');
      panel.hidden = !chart;
      if (chart) panel.innerHTML = timeSeries(chart, T.grain);
      if (chart && T.scrollToChart) {
        T.scrollToChart = false;
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      if (T.cell) renderSheetDetail(token);
    });
  }

  function renderSheetDetail (token) {
    const T = S.sheet; const m = METRICS[T.cell.id];
    const seg = T.cell.seg === '' || T.cell.seg === undefined ? null : sheetSegs[+T.cell.seg];
    const host = root.querySelector('#sheet-detail');
    const segLabel = seg ? ` · ${esc(fieldByRef(seg.ref)?.label)} = ${seg.value === null ? '∅' : esc(seg.value)}` : '';
    host.innerHTML = `
      <div class="label-caps" style="margin:20px 0 8px">${esc(m.label)}${segLabel}</div>
      <div class="card" id="breakdown" data-anfra-block="breakdown" data-anfra-label="Breakdown"></div>
      <div class="card" style="margin-top:16px" id="records" data-anfra-block="records" data-anfra-label="Underlying data"></div>`;
    if (!T.dim) T.dim = DIM_PICK[m.ds.uname] || breakdownCandidates(m.ds)[0]?.ref || '';
    const extra = seg ? [drillAql(m.ds, seg)] : [];
    renderBreakdown(m.ds, m, { grain: T.grain, period: T.cell.period, dim: T.dim, extra }, token, host);
  }

  /* ----------------------------------------------------------------
  Events
  ---------------------------------------------------------------- */
  root.addEventListener('change', (e) => {
    const el = e.target;
    const bind = el.dataset.bind;
    if (bind) {
      const [a, b] = bind.split('.');
      if (b) { S[a][b] = el.value; if (a === 'detail') { S.detail.period = null; S.detail.picked = null; } if (a === 'sheet') S.sheet.cell = null; } else S[a] = el.value;
      render(); return;
    }
    const action = el.dataset.action;
    if (action === 'toggle') { el.checked ? S.selected.add(el.dataset.id) : S.selected.delete(el.dataset.id); renderCatList(); }
    if (action === 'date-field') {
      const ds = DATASETS.find((d) => d.uname === el.dataset.ds); ds.dateRef = el.value; S.open.add(ds.uname);
      loadAnchors([ds]).then(() => { if (S.view === 'catalogue') renderCatList(); });
    }
    if (action === 'drill-value') {
      const d = S.slice.drills[+el.dataset.i]; d.value = d.values[+el.value]; render();
    }
    if (action === 'dim') {
      if (el.dataset.target === 'detail') { S.detail.dim = el.value; S.detail.picked = null; renderToken += 1; renderBreakdown(METRICS[S.metricId].ds, METRICS[S.metricId], S.detail, renderToken); }
      else { S.sheet.dim = el.value; renderToken += 1; renderSheetDetail(renderToken); }
    }
  });

  root.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'SELECT' || el.type === 'checkbox') return;
    const { action } = el.dataset;
    if (action === 'fav-only') { S.favOnly = !S.favOnly; renderCatList(); }
    // Retry failed values: failed queries are never cached, so a new run asks again.
    if (action === 'cat-retry') { const ds = DATASETS.find((d) => d.uname === el.dataset.ds); if (ds) { delete S.catData[catKey(ds)]; renderCatList(); } return; }
    if (action === 'metric-retry') { renderMetric(); return; }
    if (action === 'tab') { if (S.view !== el.dataset.tab || el.dataset.tab === 'catalogue') { S.view = el.dataset.tab; render(); window.scrollTo(0, 0); } return; }
    if (action === 'trace') { traceMetric(el.dataset.id); return; }
    if (action === 'clear-search') { S.search = ''; render(); return; }
    if (treeAction(action, el)) return;
    if (action === 'pop' && el.dataset.pop === 'kebab') {
      if (!pop.hidden && popState?.anchor === el) { closePop(); return; }
      openPop(el, 'kebab', []); popState.anchor = el; popState.metricId = el.dataset.id; renderPop();
      el.setAttribute('aria-expanded', 'true'); pop.querySelector('.menu-item:not(:disabled)')?.focus();
      return;
    }
    if (action === 'pop') {
      if (!pop.hidden && popState?.anchor === el) { closePop(); return; }
      const dsList = S.view === 'metric' ? [METRICS[S.metricId].ds] : [...new Set([...S.selected].map((id) => METRICS[id]?.ds).filter(Boolean))];
      const fields = fieldsFor(dsList);
      openPop(el, el.dataset.pop, el.dataset.pop === 'filter' ? fields : fields.filter((f) => f.ref !== dsList[0]?.dateRef || el.dataset.pop === 'drill'));
      popState.anchor = el;
      return;
    }
    if (action === 'drill-remove') { S.slice.drills.splice(+el.dataset.i, 1); render(); }
    if (action === 'breakdown-remove') { S.slice.breakdown = null; S.sheet.cell = null; render(); }
    if (action === 'row-breakdown-clear') { S.sheet.local[el.dataset.id] = { mode: S.sheet.local[el.dataset.id]?.mode }; S.sheet.cell = null; render(); }
    if (action === 'home') { S.view = S.view === 'metric' ? S.back : 'catalogue'; render(); window.scrollTo(0, 0); }
    if (action === 'crumb-sheet') { if (S.metricReturn) S.slice = S.metricReturn.slice; S.view = 'sheet'; render(); window.scrollTo(0, 0); }
    if (action === 'crumb-ds') {
      const u = el.dataset.ds;
      S.view = 'catalogue'; S.search = ''; S.favOnly = false; S.open.add(u); render();
      document.getElementById(`ds-${u}`)?.scrollIntoView({ block: 'start' });
    }
    if (action === 'open-metric') openMetric(el.dataset.id);
    if (action === 'open-sheet') { S.sheet.range = S.range; S.sheet.grain = RANGES[S.range].grain; S.sheet.cell = null; S.view = 'sheet'; render(); window.scrollTo(0, 0); }
    if (action === 'clear-sel') { S.selected.clear(); renderCatList(); }
    if (action === 'toggle-ds') { const u = el.dataset.ds; S.open.has(u) ? S.open.delete(u) : S.open.add(u); renderCatList(); }
    if (action === 'jump') { S.open.add(el.dataset.ds); renderCatList(); document.getElementById(`ds-${el.dataset.ds}`)?.scrollIntoView({ behavior: 'smooth' }); }
    if (action === 'grain') { S[el.dataset.target].grain = el.dataset.grain; S[el.dataset.target].period = null; S[el.dataset.target].cell = null; render(); }
    if (action === 'show-series') {
      S.sheet.chart = { id: el.dataset.id, seg: el.dataset.seg };
      S.sheet.scrollToChart = true;
      render();
    }
    if (action === 'close-series') { S.sheet.chart = null; render(); }
    if (action === 'pick-period') {
      S.detail.period = el.dataset.period;
      S.detail.picked = null;
      root.querySelectorAll('.chart .col').forEach((c) => c.classList.toggle('on', c === el));
      renderToken += 1; renderBreakdown(METRICS[S.metricId].ds, METRICS[S.metricId], S.detail, renderToken);
    }
    if (action === 'cell') {
      const m = METRICS[el.dataset.id];
      if (S.sheet.cell?.id !== m.id) S.sheet.dim = '';
      S.sheet.cell = { id: m.id, period: el.dataset.period, seg: el.dataset.seg };
      root.querySelectorAll('.sheet td.cell').forEach((c) => c.classList.toggle('on', c === el));
      renderToken += 1; renderSheetDetail(renderToken);
      root.querySelector('#sheet-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (action === 'pick-breakdown' && activeBreakdown?.rows) {
      const { ds, m, state, host, rows } = activeBreakdown;
      const row = rows[+el.dataset.index];
      if (!row) return;
      state.picked = { ref: state.dim, value: row.k };
      renderToken += 1;
      renderBreakdown(ds, m, state, renderToken, host);
      host.querySelector('#records')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  /* ----------------------------------------------------------------
  Metric tree view: the lineage of any catalog metric, built from the metric definitions.
  Definitions come from the lineage catalog (Anfra.lineage): one trace per dataset returns the
  dataset card with every metric, its AQL definition and the model fields it refers to.
  Edges between metrics are parsed from the definition text: a bare identifier that names a
  metric of the same dataset is an input. A metric with no such reference is a leaf.
  ---------------------------------------------------------------- */
  // Masthead: product name and the view switch. Nothing else.
  const tabsHtml = (active) => `<div class="masthead" data-anfra-block="masthead" data-anfra-label="Title and views">
      <h1>Metrics</h1>
      <nav class="seg" aria-label="Views">${[['tree', 'Tree'], ['catalogue', 'Catalog']].map(([k, l]) => `<button class="${active === k ? 'on' : ''}" data-action="tab" data-tab="${k}" aria-pressed="${active === k}">${l}</button>`).join('')}</nav>
    </div>`;

  const hasLineage = () => !!(H.plugins && typeof H.plugins.has === 'function' && H.plugins.has('lineage') && typeof H.lineage === 'function');
  const defsCache = new Map();

  // One lineage trace per dataset. The dataset card lists every metric with its AQL definition and the
  // model fields it refers to. A model measure is traced as a model field. Result: { byRef, error }.
  function loadDefinitions (ds) {
    if (defsCache.has(ds.uname)) return defsCache.get(ds.uname);
    const p = (async () => {
      const out = { byRef: {}, error: null };
      if (!hasLineage()) { out.error = 'The lineage plugin is not installed on this host, so metric definitions cannot be read.'; return out; }
      const targets = [];
      const first = ds.metrics.find((m) => m.kind === 'metric');
      if (first) targets.push({ parent: ds.uname, child: first.ref });
      for (const m of ds.metrics) if (m.kind === 'measure') { const [model, field] = m.ref.split('.'); targets.push({ parent: model, child: field }); }
      if (!targets.length) return out;
      // Up to 3 tries with backoff. A call that never answers times out after 15 s.
      // A failure is not cached, so a later Retry asks again.
      let results = null; let lastErr = null;
      for (let attempt = 0; attempt < 3 && !results; attempt += 1) {
        if (attempt) await new Promise((r) => setTimeout(r, attempt === 1 ? 600 : 1800));
        try {
          const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Definitions timed out.')), 15000));
          const res = await Promise.race([H.lineage(targets), timeout]);
          if ((res?.results || []).length && res.results.every((r) => r.error)) throw new Error(res.results[0].error);
          results = res?.results || [];
        } catch (e) { lastErr = e; }
      }
      if (!results) { out.error = lastErr?.message || String(lastErr); out.failed = true; defsCache.delete(ds.uname); return out; }
      ds.defs = out;
      const nodes = {}; const errors = [];
      const walk = (list) => { for (const n of list || []) { nodes[n.id] = n; for (const s of n.sections || []) walk(s.nodes); } };
      for (const r of results || []) { if (r.error) errors.push(r.error); else walk(r.diagram?.cards); }
      const measureRefs = new Set(ds.metrics.filter((m) => m.kind === 'measure').map((m) => m.ref));
      for (const n of Object.values(nodes)) {
        const p = n.props || {}; const fqn = String(p.fqn || '');
        let ref = null;
        if (n.type === 'aml.metric' && fqn.startsWith(`${ds.uname}.`)) ref = fqn.slice(ds.uname.length + 1);
        else if (n.type !== 'aml.model' && measureRefs.has(fqn)) ref = fqn;
        if (!ref || out.byRef[ref]) continue;
        out.byRef[ref] = {
          definition: String(p.definition ?? '').trim(),
          description: p.description || '',
          // Governance fields only when the catalog exposes them; nothing is invented.
          owner: p.owner || '', certified: p.certified === true || p.certified === 'true',
          reads: (n.links || []).filter((l) => l.type === 'refers').map((l) => nodes[l.to]?.props?.fqn).filter(Boolean),
        };
      }
      if (errors.length && !Object.keys(out.byRef).length) out.error = errors[0];
      return out;
    })();
    defsCache.set(ds.uname, p);
    return p;
  }

  // Metric references in an AQL definition. String literals are blanked first. A bare identifier that
  // names a metric of the same dataset is a reference; a `model.field` part or a `name(` call is not.
  const stripStrings = (s) => String(s || '').replace(/'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"/g, (m) => ' '.repeat(m.length));
  function metricRefs (definition, names) {
    const src = stripStrings(definition); const out = [];
    const re = /(^|[^\w.])([A-Za-z_]\w*)(?![\w.])(?!\s*\()/g;
    let m;
    while ((m = re.exec(src))) { const id = m[2]; if (names.has(id) && !out.includes(id)) out.push(id); }
    return out;
  }
  const fieldRefs = (definition) => [...new Set(stripStrings(definition).match(/\b[A-Za-z_]\w*\.[A-Za-z_]\w*\b/g) || [])];
  const modelRefs = (definition) => [...new Set(fieldRefs(definition).map((f) => f.split('.')[0]))];

  // The tree: nodes reachable from the root through metric references, rows by depth (longest path),
  // edges from a metric to each input, and the inverse map (which metrics of the dataset use each one).
  function buildTree (rootMetric, defs) {
    const ds = rootMetric.ds;
    const names = new Set(ds.metrics.filter((m) => m.kind === 'metric').map((m) => m.ref));
    const nodes = new Map(); const edges = [];
    const visit = (ref, stack) => {
      if (nodes.has(ref)) return;
      const node = { ref, metric: ds.metrics.find((m) => m.ref === ref), def: defs.byRef[ref] || null, inputs: [], cyclic: [] };
      nodes.set(ref, node);
      const refs = node.def ? metricRefs(node.def.definition, names).filter((r) => r !== ref) : [];
      for (const r of refs) {
        if (stack.includes(r)) { node.cyclic.push(r); continue; }
        node.inputs.push(r); edges.push([ref, r]); visit(r, [...stack, ref]);
      }
    };
    visit(rootMetric.ref, []);
    const depth = {};
    const place = (ref, d, stack) => {
      if (stack.includes(ref) || (depth[ref] !== undefined && depth[ref] >= d)) return;
      depth[ref] = d;
      for (const r of nodes.get(ref).inputs) place(r, d + 1, [...stack, ref]);
    };
    place(rootMetric.ref, 0, []);
    const rows = [];
    for (const ref of nodes.keys()) (rows[depth[ref]] ||= []).push(ref);
    const usedBy = {};
    for (const m of ds.metrics) {
      const d = defs.byRef[m.ref]; if (!d || m.kind !== 'metric') continue;
      for (const r of metricRefs(d.definition, names)) if (r !== m.ref) (usedBy[r] ||= []).push(m.ref);
    }
    return { ds, root: rootMetric.ref, nodes, edges, rows, depth, usedBy };
  }

  // Every metric of a dataset as a forest. Roots are metrics no other metric uses,
  // biggest first; metrics only reachable through a cycle become roots too.
  function buildForest (ds, defs) {
    const names = new Set(ds.metrics.filter((m) => m.kind === 'metric').map((m) => m.ref));
    const nodes = new Map(); const edges = []; const usedBy = {};
    for (const m of ds.metrics) {
      if (m.kind !== 'metric') continue;
      const def = defs.byRef[m.ref] || null;
      const inputs = def ? metricRefs(def.definition, names).filter((r) => r !== m.ref) : [];
      nodes.set(m.ref, { ref: m.ref, metric: m, def, inputs, cyclic: [] });
      for (const r of inputs) { edges.push([m.ref, r]); (usedBy[r] ||= []).push(m.ref); }
    }
    const reach = (r, seen = new Set()) => { if (seen.has(r)) return seen; seen.add(r); for (const i of nodes.get(r)?.inputs || []) reach(i, seen); return seen; };
    const size = Object.fromEntries([...nodes.keys()].map((r) => [r, reach(r).size]));
