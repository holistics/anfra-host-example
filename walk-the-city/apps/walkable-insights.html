.stamp.round { width: 104px; height: 104px; border-radius: 50%; display: inline-grid; place-items: center; text-align: center; padding: 10px; font-size: 14px; line-height: 1; border-style: double; border-width: 6px; }
.stamp.walk { color: var(--walk-t); } .stamp.water, .stamp.blue { color: var(--water-t); } .stamp.ink { color: var(--ink); } .stamp.green { color: var(--green-t); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s5);
  border: var(--line) solid var(--ink); border-radius: var(--r-pill); background: var(--paper-hi); color: var(--ink);
  font-family: var(--f-display); text-transform: uppercase; letter-spacing: .05em; font-size: 16px; line-height: 1;
  cursor: pointer; box-shadow: 2px 3px 0 var(--ink); white-space: nowrap;
  transition: transform var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out), background-color var(--dur-1);
}
.btn:hover { background: var(--paper-2); }   /* secondary hover stays neutral: yellow fill = primary only */
.btn:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--ink); }
/* hierarchy (2026-10-21): ONE .primary per section = yellow fill, black text (11.5:1). Everything else = paper outline (.btn) or .btn.ghost. */
.btn.primary { background: var(--yellow); }
.btn.primary:hover { background: var(--yellow-2); }
.btn.ghost { box-shadow: none; border-color: transparent; background: transparent; text-decoration: underline 2px; text-underline-offset: 4px; }
.btn.ghost:hover { background: var(--paper-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper-hi); }
.btn .ico { width: 18px; height: 18px; }

/* chip toggle (for choices). Use <button aria-pressed>. */
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px;
  border: 1.5px solid var(--ink); border-radius: var(--r-pill); background: transparent; cursor: pointer;
  font-family: var(--f-hand); font-weight: 600; font-size: 15px; font-variation-settings: "INFM" 50;
}
.chip[aria-pressed="true"] { background: var(--purple); }
.chip:hover { background: var(--paper-2); } .chip[aria-pressed="true"]:hover { background: var(--purple); }
.chip .ico { width: 16px; height: 16px; }

/* range slider in ink */
.range { appearance: none; -webkit-appearance: none; width: 100%; height: 28px; background: transparent; cursor: pointer; }
.range::-webkit-slider-runnable-track { height: 4px; background: var(--ink); border-radius: 2px; }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink); }
.range::-moz-range-track { height: 4px; background: var(--ink); }
.range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink); }

/* sticky breadcrumb as a ticket strip */
.crumbs {
  position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none;
  padding: var(--s2) clamp(16px, 4vw, 64px); background: var(--paper);
  border-bottom: var(--line) solid var(--ink);
}
.crumbs::-webkit-scrollbar { display: none; }
.crumbs button {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px;
  border: 0; background: none; cursor: pointer; border-radius: var(--r-pill);
  font-family: var(--f-display); text-transform: uppercase; letter-spacing: .04em; font-size: 15px; white-space: nowrap;
}
.crumbs button:hover { background: var(--paper-2); }
.crumbs button[aria-current] { background: var(--purple); }
.crumbs .sep { flex: none; width: 18px; height: 2px; border-top: 2px dashed var(--ink-3); }

/* ---------- charts ---------- */
.chart { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--f-mono); }
.chart text:not([fill]) { fill: var(--ink); }
.chart .axis line, .chart .axis path { stroke: var(--ink); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.chart .axis .tick text { font-family: var(--f-mono); font-size: var(--t-micro); fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart .axis-title { font-family: var(--f-hand); font-size: var(--t-hand-s); font-weight: 600; fill: var(--ink-2); }
.chart .grid line { stroke: var(--ink); stroke-opacity: .16; stroke-width: 1; stroke-dasharray: 1 5; stroke-linecap: round; }
.chart .mark { stroke: var(--paper); stroke-width: 2; }          /* 2px paper ring between marks */
.chart .mark.ctx { fill: url(#ht-grey-50); stroke: var(--ink-3); stroke-width: 1; }
.chart .mark.sel { fill: var(--purple); stroke: var(--ink); stroke-width: 2; }
.chart .line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.chart .label { font-family: var(--f-hand); font-weight: 700; font-size: var(--t-hand-s); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.chart .value { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
.chart .hit { fill: transparent; stroke: none; cursor: pointer; }
.chart [tabindex]:focus { outline: none; }
.chart [tabindex]:focus-visible { outline: none; stroke: var(--ink); stroke-width: 3; }
.chart [tabindex]:focus-visible .mark, .chart [tabindex]:hover .mark { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 4 2; }
.chart [tabindex]:focus-visible .focus-ring, .chart .focus-ring.on { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 3 3; fill: none; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); font-family: var(--f-hand); font-size: var(--t-hand-s); font-weight: 600; }
.legend .sw { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 50%; vertical-align: -2px; margin-right: 6px; }

/* tooltip as sticker */
.tip {
  position: absolute; z-index: var(--z-tip); pointer-events: none; left: 0; top: 0;
  background: var(--paper-hi); color: var(--ink); border: 2px solid var(--ink); border-radius: 6px;
  padding: 8px 12px; min-width: 120px; max-width: 240px; font-size: 14px; line-height: 1.35;
  box-shadow: 3px 4px 0 var(--ink); rotate: -1.5deg; opacity: 0; translate: 0 6px;
  transition: opacity var(--dur-1) var(--ease-out), translate var(--dur-1) var(--ease-out);
}
.tip.on { opacity: 1; translate: 0 0; }
.tip::before {
  content: ""; position: absolute; top: -12px; left: 50%; width: 54px; height: 18px; translate: -50% 0; rotate: 3deg;
  background: color-mix(in srgb, var(--yellow) 65%, transparent); mix-blend-mode: multiply;
}
.tip .tip-title { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .03em; font-size: 16px; line-height: 1.1; margin-bottom: 2px; }
.tip .tip-row { display: flex; justify-content: space-between; gap: 12px; }
.tip .tip-row b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }

/* SVG text helpers */
.svg-hand { font-family: var(--f-hand); font-weight: 700; font-variation-settings: "INFM" 70, "BNCE" 40; }
.svg-display { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.svg-mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.halo { paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; }

/* radar glyph (Kit.radar; Kit.flower is an alias since 2026-10-21) */
.radar .rd-ring { fill: none; stroke: var(--ink); stroke-opacity: .28; stroke-width: 1; stroke-dasharray: 1 4; stroke-linecap: round; }
.radar .rd-ring.outer { stroke-opacity: .55; stroke-dasharray: none; stroke-width: 1.4; }
.radar .rd-spoke { stroke: var(--ink); stroke-opacity: .3; stroke-width: 1; }
.radar .rd-tick { font-family: var(--f-mono); font-size: 10px; fill: var(--ink-3); }
.radar .rd-label { font-family: var(--f-hand); font-weight: 700; font-size: 13px; fill: var(--ink); font-variation-settings: "INFM" 60, "BNCE" 30; }
.radar .rd-value { font-family: var(--f-mono); font-size: 12px; font-weight: 500; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.radar .rd-score { font-family: var(--f-display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.radar .rd-dot { stroke: var(--ink); stroke-width: 1.4; }
.radar .rd-hit { fill: transparent; cursor: default; }
.radar .rd-axis:hover .rd-spoke, .radar .rd-axis:focus-visible .rd-spoke, .radar .rd-axis.on .rd-spoke { stroke-opacity: 1; stroke-width: 2; stroke-dasharray: 3 3; }
.radar .rd-axis:focus-visible { outline: none; }
.radar .rd-axis:focus-visible .rd-hit { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 2 3; }
.radar .rd-axis:hover .rd-label, .radar .rd-axis:focus-visible .rd-label { text-decoration: underline; }

/* ---------- accessibility ---------- */
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; box-shadow: 0 0 0 6px var(--yellow); }
.btn:focus-visible, .chip:focus-visible, .crumbs button:focus-visible { outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 99; }
.skip:focus { top: 8px; }


/* gentle entrance for printed parts */
@media (prefers-reduced-motion: no-preference) {
  .reveal { opacity: 0; translate: 0 10px; rotate: var(--reveal-rot, 0deg); transition: opacity .36s var(--ease-out), translate .36s var(--ease-out); }
  .reveal.in { opacity: 1; translate: 0 0; }
  .wiggle:hover { animation: wiggle .36s var(--ease-out); }
  @keyframes wiggle { 30% { rotate: 3deg; } 60% { rotate: -2deg; } }
  .draw-in { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000); animation: draw .9s var(--ease-out) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) {
  .sticker, .card, .btn, .tip { border: 2px solid CanvasText; }
  .misreg::after { display: none; }
}

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .poster { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .poster > * { --span: 6; }
  .poster > .span-3, .poster > .span-4 { --span: 3; }
}
@media (max-width: 640px) {
  :root { --t-body: 16px; --s7: 32px; }
  .poster { grid-template-columns: minmax(0, 1fr); gap: var(--s5); padding: var(--s6) 16px; }
  .poster > * { grid-column: 1 / -1; grid-row: auto; }
  .push-down, .pull-up { margin-top: 0; }
  .tilt-l, .tilt-r { rotate: 0deg; } .tilt-l2 { rotate: -1deg; } .tilt-r2 { rotate: 1deg; }
  .card { padding: var(--s4); box-shadow: 2px 3px 0 var(--ink); }
  .card-head { margin: calc(var(--s4) * -1) calc(var(--s4) * -1) var(--s3); }
  .crumbs { padding: var(--s1) 16px; }
  .crumbs button { font-size: 14px; padding: 0 8px; }
  .tip { max-width: 200px; }
}

/* ===== shell.css ===== */
/* =====================================================================
   walkable insights v2 - shell layout (cover, breadcrumb, levels, states)
   Loaded after kit.css. Level builders put their own styles in levels/<id>.css
   and prefix every selector with #level-<id>.
   ===================================================================== */

:root { --crumb-h: 54px; }
@media (max-width: 640px) { :root { --crumb-h: 46px; } }

#main { position: relative; overflow: clip; }   /* tilted cards and big level numbers must not widen the page */

/* ---------- breadcrumb (sticky ticket strip) ---------- */
.crumbs { min-height: var(--crumb-h); }
.crumbs ol { display: flex; align-items: center; gap: 2px; margin: 0; padding: 0; list-style: none; }
.crumbs li { display: flex; align-items: center; gap: 2px; flex: none; }
.crumbs .crumb-ghost { padding: 0 10px; font-size: 15px; color: var(--ink-3); white-space: nowrap; }
.crumbs button .ico { width: 16px; height: 16px; }
.crumbs button[aria-current] { background: var(--purple); box-shadow: inset 0 0 0 2px var(--ink); }   /* violet = current; key line = second cue */
/* level crumbs (You, Sources) sit after the place path, split by a solid rule */
.crumbs .crumb-levels { margin-left: var(--s3); padding-left: var(--s3); border-left: var(--line) solid var(--ink); }

/* ---------- levels ---------- */
.shell-level { scroll-margin-top: var(--crumb-h); border-top: var(--line) dashed var(--ink-3); }
.shell-level > .poster { padding-top: var(--s8); }
/* big printed level number behind the content */
.shell-level::before {
  content: attr(data-n); position: absolute; top: var(--s5); right: clamp(8px, 3vw, 48px); z-index: 0;
  font-family: var(--f-display); font-size: clamp(120px, 20vw, 300px); line-height: .8; color: transparent;
  -webkit-text-stroke: 2px var(--ink-3); opacity: .35; pointer-events: none;
}
.shell-head { grid-column: span 7; align-self: start; align-content: start; }
/* the selected-place ticket on every level (planet, city, neighbourhood, street): one look */
.shell-ticket {
  background-color: var(--paper-hi); border: var(--line) solid var(--ink); border-radius: var(--r-box);
  box-shadow: var(--shadow); padding: var(--s5);
}
@media (max-width: 640px) { .shell-ticket { padding: var(--s4); box-shadow: 2px 3px 0 var(--ink); } }
.shell-kicker { margin: 0; rotate: -1.5deg; }
.shell-level h1[tabindex="-1"]:focus { outline: none; box-shadow: none; }   /* focus moves here after a crumb or drill scroll; no ring on a heading */

/* next-question cards: removed 2026-10-21 (one page). ctx.ui.bridge() returns this hidden stub. */
.shell-bridge-gone { display: none !important; }

/* placeholder chart slot */
.shell-slot {
  display: grid; align-content: center; justify-items: start; gap: var(--s2);
  min-height: 260px; padding: var(--s5); border: 2px dashed var(--ink-3); border-radius: var(--r-box);
  background-color: var(--paper-hi);
}
.shell-slot-title { font-size: var(--t-h3); }
.shell-slot.ht { background-color: var(--paper-hi); }

/* query states (set by ctx.query on opts.el) */
[data-qstate] { position: relative; }
.q-status {
  position: absolute; left: var(--s3); top: var(--s3); z-index: 5;
  font-family: var(--f-hand); font-weight: 700; font-size: var(--t-hand-s);
  padding: 4px 10px; border: 1.5px solid var(--ink); border-radius: var(--r-pill); background: var(--paper-hi);
}
.q-status.q-executing { background: var(--yellow); }
.q-status.q-error { position: static; display: block; border-radius: var(--r-box); background: var(--paper-hi); color: var(--purple-t); border-color: var(--purple-t); max-width: 62ch; }
.q-status.q-empty { color: var(--ink-2); }
[data-qstate="executing"] > :not(.q-status) { opacity: .45; transition: opacity var(--dur-2) var(--ease-out); }


/* ---------- cover ---------- */
.shell-cover { display: grid; align-items: start; }
.shell-cover .poster { width: 100%; align-items: center; padding-top: var(--s6); padding-bottom: calc(var(--s8) + 24px); row-gap: var(--s5);
  min-height: calc(100svh - var(--crumb-h)); }   /* no parallax since 2026-10-21 (perf pass): no extra scroll room */
.sheets .shell-cover .poster { padding-bottom: calc(112px + 26px); }   /* 112 px of paper under the note, plus the 26 px the next sheet overlaps */
.shell-cover-title { position: relative; }
.shell-cover-kicker { margin: 0 0 var(--s4); rotate: -2deg; }
.shell-mega { font-size: var(--t-mega); line-height: .84; }
.shell-cover-hook { margin: var(--s4) 0 0; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .02em; font-size: clamp(20px, 2.4vw, 30px); line-height: 1.05; }
.shell-cover .lead { margin-top: var(--s3); max-width: 44ch; }
.shell-cover-cta { margin-top: var(--s5); gap: var(--s4); }
.shell-cover-side { align-self: stretch; display: grid; align-items: center; }

/* collage: pieces sit on a yellow sun and a black street band; positions are % of the frame */
.shell-collage { position: relative; width: 100%; aspect-ratio: 1 / .85; max-width: 520px; margin-inline: auto; }
.cg-sun { position: absolute; left: 14%; top: 0; width: 62%; aspect-ratio: 1; border-radius: 50%; background: var(--yellow); border: var(--line) solid var(--ink); box-shadow: var(--shadow);
  background-image: radial-gradient(circle, rgb(31 30 36 / .22) 1.4px, transparent 1.6px); background-size: 9px 9px; }
.cg-street { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: var(--ink); border-radius: 6px; transform: rotate(-1.5deg); }
.cg-dash { position: absolute; left: 4%; right: 4%; bottom: 14%; height: 0; border-top: 4px dashed var(--paper-hi); transform: rotate(-1.5deg); z-index: 1; }
.cg-piece { position: absolute; display: block; line-height: 0; filter: drop-shadow(3px 4px 0 rgb(31 30 36 / .35)); }
.cg-piece img { display: block; width: 100%; height: auto; }

/* how to read: numbered stops on a dashed walking line, then three tips */
.shell-how { display: grid; gap: var(--s3); }
.shell-how-title { margin: 0; font-size: var(--t-hand-l); font-weight: 700; color: var(--walk-t); }
.shell-stops { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s4); position: relative; counter-reset: none; }
.shell-stops::before { content: ""; position: absolute; left: 18px; right: 18px; top: 18px; border-top: 3px dashed var(--walk); z-index: 0; }
.stop { position: relative; z-index: 1; }
.stop a { display: grid; gap: 2px; align-content: start; color: var(--ink); text-decoration: none; padding: 0 var(--s1) var(--s2) 0; border-radius: var(--r-box); }
.stop-n { display: grid; place-items: center; width: 38px; height: 38px; margin-bottom: var(--s2); border-radius: 50%; border: var(--line) solid var(--ink); background: var(--yellow); font-family: var(--f-display); font-size: 18px; box-shadow: 2px 3px 0 var(--ink); transition: transform var(--dur-1) var(--ease-out); }
.stop-you .stop-n { background: var(--purple); }
.stop-name { font-size: 20px; text-transform: uppercase; line-height: 1; }
.stop-q { font-size: 15px; line-height: 1.25; color: var(--ink-2); max-width: 24ch; }
.stop a:hover .stop-n { transform: translate(-1px, -2px) rotate(-6deg); }
.stop a:hover .stop-name { text-decoration: underline 3px var(--yellow-2); text-underline-offset: 4px; }
.stop a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.shell-tips { list-style: none; margin: var(--s2) 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--s2) var(--s6); }
.shell-tips li { display: flex; align-items: flex-start; gap: var(--s2); font-size: 15px; line-height: 1.3; max-width: 34ch; }
.shell-tips .ico { flex: none; margin-top: 2px; color: var(--walk-t); }

/* "Just so you know": in the hero, last row, centred and static (parallax and tilt animation removed 2026-10-21, perf pass) */
.shell-note { grid-column: 1 / -1; width: 100%; max-width: 720px; justify-self: center; font-size: var(--t-body); rotate: -1deg; margin-top: var(--s5); }
.shell-note p { margin: 0 0 var(--s3); max-width: 60ch; }
.shell-note p:last-child { margin-bottom: 0; }
.shell-note a { color: var(--walk-t); font-weight: 600; text-underline-offset: 3px; }
.shell-note-title { font-size: 18px; letter-spacing: .04em; margin: 0; }
.shell-note-lead { font-family: var(--f-hand); font-weight: 700; font-size: var(--t-hand-l); line-height: 1.1; }

/* ---------- sheets: stacked overlay (set by setupSheets; not under reduced motion).
   Each section (the cover too) is position: sticky with top = --sheet-top = min(0, viewport - section height), set by script.
   A tall section scrolls normally until its bottom edge (bottom padding included) reaches the viewport bottom, then pins;
   the next sheet (paper, rounded ink top edge, upward shadow) then slides up over it. So the last row of cards is fully
   in view before any cover starts. The 26 px overlap and the shadow fall in the extra bottom padding, never on a card.
   Nothing inside a section is sticky. #main and .level use overflow: clip (not hidden/auto), which keeps sticky working.
   Perf pass 2026-10-21: the pinned section no longer scales (a JS scale on a 2000-3000 px layer re-rastered the whole
   section, its SVG filters too, on every frame: tiles flashed). Only a dim veil fades in. The veil covers just the
   pinned, visible part (bottom 100vh of the section) and is its own small compositor layer, so its opacity costs no paint.
   The grain is a background tile of each sheet (see kit.css), not a blend layer on top.
   Paint fix 2026-10-21: sticky only in the pin window (.sheet-pin, set by setupSheets), else position: relative; see shell.js. ---------- */
.sheets #main > .level { position: relative; isolation: isolate; background: var(--grain) 0 0 / 220px 220px, var(--paper); }
/* sticky only in its pin window (class set by setupSheets): one or two sheet layers at a time, not seven (paint fix 2026-10-21) */
.sheets #main > .level.sheet-pin { position: sticky; top: var(--sheet-top, 0px); }
.sheets .shell-level { border-top: var(--line) solid var(--ink); border-radius: 26px 26px 0 0; margin-top: -26px;
  box-shadow: 0 -14px 28px -10px rgb(31 30 36 / .35); }
.sheets .shell-level > .poster { padding-top: calc(var(--s8) + 26px); padding-bottom: calc(var(--s8) + 56px); }
.sheet-dim[hidden] { display: none; }
.sheet-dim { position: absolute; left: 0; right: 0; bottom: 0; height: min(100%, 100vh); z-index: 30; pointer-events: none;
  background: var(--ink); opacity: 0; will-change: opacity; }
@media (max-width: 640px) { .sheets .shell-level { border-radius: 18px 18px 0 0; margin-top: -18px; } .sheets .shell-level > .poster { padding-top: calc(var(--s7) + 18px); padding-bottom: calc(var(--s7) + 44px); }

/* ===== levels/planet.css ===== */
/* Level 1: Planet. Every selector starts with #level-planet. Palette v2: yellow accent, violet = selected, deep blue = walking. */
#level-planet figure { margin: 0; }
#level-planet .pl-poster { align-items: start; }
#level-planet .pl-note { margin: 0 0 var(--s2); color: var(--ink-2); font-size: var(--t-hand-s); max-width: 52ch; }
#level-planet .chart g[role="button"] { cursor: pointer; outline: none; }
#level-planet .chart g[role="button"]:focus-visible .mark { stroke: var(--water-t); stroke-width: 3; stroke-dasharray: 4 2; }
#level-planet .pl-sel-label { fill: var(--purple-t); font-size: 17px; }
#level-planet .pl-ctx-label { fill: var(--ink-2); font-size: 14px; }
#level-planet .pl-sticker { fill: var(--yellow); stroke: var(--ink); stroke-width: 2; }

/* ---------- head: globe cut-out + footsteps ---------- */
#level-planet .pl-trailwrap { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s4); }
#level-planet .pl-trail { flex: 1; min-width: 0; width: 100%; max-width: 600px; height: auto; display: block; }
#level-planet .pl-globe-art { flex: none; rotate: -6deg; }
#level-planet .pl-art-fallback { width: 120px; }

/* ---------- globe ---------- */
#level-planet .pl-globe-card { grid-column: span 5; position: relative; margin-top: calc(var(--s7) * -0.5); padding: var(--s4) var(--s5) var(--s5); }
#level-planet .pl-globe { max-width: 440px; margin: 0 auto; }
#level-planet .pl-orbit { fill: none; stroke: var(--ink-3); stroke-width: 1.4; stroke-dasharray: 2 6; stroke-linecap: round; }
#level-planet .pl-star { stroke: var(--ink-3); stroke-width: 1.4; stroke-linecap: round; }
#level-planet .pl-grat { fill: none; stroke: var(--water-t); stroke-opacity: .3; stroke-width: 1; stroke-dasharray: 1 4; stroke-linecap: round; }
#level-planet .pl-blob { fill: url(#ht-grey-50); stroke: var(--ink); stroke-width: 1.4; filter: url(#kit-rough-2); mix-blend-mode: multiply; }
#level-planet .pl-blob-line { fill: none; stroke: var(--walk); stroke-width: 1.3; mix-blend-mode: multiply; filter: url(#kit-rough-2); }
#level-planet .pl-pin { cursor: pointer; }
#level-planet .pl-pin-dot { fill: var(--paper-hi); stroke: var(--ink); stroke-width: 1.5; }
#level-planet .pl-pin:hover .pl-pin-dot, #level-planet .pl-pin:focus-visible .pl-pin-dot { fill: var(--yellow); stroke-width: 2.4; }
#level-planet .pl-you-label { font-size: 22px; fill: var(--ink); }
#level-planet .pl-you-sub { font-size: 15px; fill: var(--ink-2); }
#level-planet .pl-globe-cap { margin-top: var(--s2); }
#level-planet .pl-globe-cap p { margin: 0 0 var(--s1); }
#level-planet .pl-hi { color: var(--purple-t); }
#level-planet .pl-hint { color: var(--ink-3); }

/* ---------- ticket ---------- */
#level-planet .pl-pick { display: grid; gap: var(--s2); align-content: start; margin-top: var(--s5); padding-bottom: var(--s6); align-self: start; }
#level-planet .pl-pick p { margin: 0; }
#level-planet .pl-pick-kicker { font-size: var(--t-hand); rotate: -2deg; }
#level-planet .pl-pick-name { font-size: clamp(36px, 4vw, 56px); line-height: .9; }
#level-planet .pl-pick-steps { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
#level-planet .pl-pick-num { color: var(--walk); }
#level-planet .pl-big-svg { width: 100%; max-width: 320px; margin: var(--s2) auto 0; }
#level-planet .pl-pick .legend { margin: 0; }
#level-planet .pl-pick .legend .sw.ht { background-color: var(--paper-hi); }
#level-planet .pl-pick .legend b { font-weight: 700; }
#level-planet .pl-pick-label { margin-top: var(--s3); font-size: var(--t-hand-s); }
#level-planet .pl-select {
  min-height: 44px; padding: 0 var(--s4); border: var(--line) solid var(--ink); border-radius: var(--r-pill);
  background-color: var(--paper-hi); font-family: var(--f-hand); font-weight: 600; font-size: 16px; cursor: pointer;
}
#level-planet .pl-shoes-art { justify-self: end; rotate: 5deg; margin-top: var(--s2); }
#level-planet .pl-shoes { width: 130px; }

/* ---------- race ---------- */
#level-planet .pl-track { fill: var(--paper-2); stroke: var(--ink); stroke-width: 1.6; rx: 3; }
#level-planet .pl-laneline { stroke: var(--paper-hi); stroke-width: 1.4; }
#level-planet .pl-startline { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 3 3; }
#level-planet .pl-race .grid line { stroke-opacity: .3; }
#level-planet .pl-lane { cursor: pointer; }
#level-planet .pl-lane-sel { fill: var(--purple-wash); stroke: var(--ink); stroke-width: 2; }
#level-planet .pl-lane:hover .hit, #level-planet .pl-lane:focus-visible .hit { fill: var(--yellow); fill-opacity: .45; }
#level-planet .pl-lane:focus-visible { outline: none; }
#level-planet .pl-lane:focus-visible .hit, #level-planet .pl-lane:focus-visible .pl-lane-sel { stroke: var(--water-t); stroke-width: 2.5; stroke-dasharray: 4 3; }
#level-planet .pl-lane-name { font-family: var(--f-hand); font-weight: 600; fill: var(--ink-2); }
#level-planet .pl-lane-name.on { fill: var(--ink); font-weight: 800; }
#level-planet .pl-foot { fill: var(--walk); opacity: .55; mix-blend-mode: multiply; }
#level-planet .pl-foot.on { fill: var(--purple); stroke: var(--ink); stroke-width: 1.1; opacity: 1; }
#level-planet .pl-lane-val { font-family: var(--f-mono); font-size: 12px; fill: var(--ink-2); paint-order: stroke; stroke: var(--paper-hi); stroke-width: 3px; stroke-linejoin: round; }
#level-planet .pl-lane-val.on { fill: var(--ink); font-weight: 500; font-size: 13px; }
#level-planet .pl-gap { font-family: var(--f-mono); font-size: 11px; fill: var(--ink-3); }
#level-planet .pl-mean { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 6 5; }
#level-planet .pl-flag { fill: var(--yellow); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
#level-planet .pl-mean-label { font-size: 14px; }
#level-planet .pl-race-btn { margin: var(--s2) 0 var(--s3); min-height: 40px; font-size: 14px; }

/* ---------- radar grid ---------- */
#level-planet .pl-rd-card { margin-top: var(--s5); }
#level-planet .pl-rd-lead { max-width: 62ch; }
#level-planet .pl-rd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--s1) var(--s2); }
#level-planet .pl-rd {
  display: grid; justify-items: center; gap: 0; padding: var(--s1) 2px var(--s2);
  background: none; border: 1.5px solid transparent; border-radius: var(--r-box); cursor: pointer; color: var(--ink);
  transition: background-color var(--dur-1), border-color var(--dur-1);
}
#level-planet .pl-rd:hover { background: var(--paper-2); border-color: var(--ink); }
#level-planet .pl-rd.on { background: var(--purple-wash); border: 2px solid var(--ink); box-shadow: 2px 3px 0 var(--ink); }
#level-planet .pl-rd-svg { width: 100%; max-width: 92px; height: auto; overflow: visible; }
#level-planet .pl-rd-name { font-family: var(--f-hand); font-weight: 600; font-size: 12.5px; line-height: 1.15; text-align: center; }
#level-planet .pl-rd.on .pl-rd-name { color: var(--purple-t); font-weight: 800; }
#level-planet .pl-rd-num { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); margin-left: 2px; }
#level-planet .pl-rd.on .pl-rd-num { color: var(--ink); }

/* ---------- entrance motion (played once per block, when it scrolls in) ---------- */
#level-planet .pl-pop { transform-box: fill-box; transform-origin: center; }
#level-planet .pl-zoom { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  #level-planet .pl-anim:not(.pl-in) .pl-pop, #level-planet .pl-anim:not(.pl-in) .pl-pop2,
  #level-planet .pl-anim:not(.pl-in) .pl-zoom, #level-planet .pl-anim:not(.pl-in) .pl-rd { opacity: 0; }
  #level-planet .pl-anim.pl-in:not(.pl-still) .pl-pop { animation: pl-pop .32s var(--ease-out) backwards; animation-delay: var(--d, 0ms); }
  #level-planet .pl-anim.pl-in:not(.pl-still) .pl-pop2 { animation: pl-step .32s var(--ease-out) backwards; animation-delay: var(--d, 0ms); }
  #level-planet .pl-anim.pl-in:not(.pl-still) .pl-zoom { animation: pl-zoom .7s var(--ease-out) backwards; }
  #level-planet .pl-anim.pl-in:not(.pl-still) .pl-draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: pl-draw .9s var(--ease-out) .2s forwards; }
  #level-planet .pl-anim.pl-in .pl-rd { animation: pl-pop .32s var(--ease-out) backwards; }
  #level-planet .pl-anim.pl-in .pl-rd:nth-child(4n+1) { animation-delay: 60ms; }
  #level-planet .pl-anim.pl-in .pl-rd:nth-child(4n+2) { animation-delay: 140ms; }
  #level-planet .pl-anim.pl-in .pl-rd:nth-child(4n+3) { animation-delay: 220ms; }
  #level-planet .pl-anim.pl-in .pl-rd:nth-child(4n) { animation-delay: 300ms; }
  @keyframes pl-pop { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
  @keyframes pl-step { from { opacity: 0; translate: -8px 0; } to { opacity: 1; translate: 0 0; } }
  @keyframes pl-zoom { 0% { opacity: 0; transform: scale(.6) rotate(-12deg); } 40% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes pl-draw { to { stroke-dashoffset: 0; } }
}
@media (prefers-reduced-motion: reduce) {
  #level-planet .pl-dot { transition: none; }
}

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  #level-planet .pl-globe-card { grid-column: 1 / -1; margin-top: 0; }
}
@media (max-width: 640px) {
  #level-planet .pl-globe-card { padding: var(--s3); }
  #level-planet .pl-hero-card, #level-planet .pl-pick, #level-planet .pl-race-card, #level-planet .pl-rd-card { margin-top: 0; }
  #level-planet .pl-rd-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
  #level-planet .pl-rd-name { font-size: 11px; }
  #level-planet .pl-rd-num { display: block; margin: 0; }
  #level-planet .pl-shoes-art { margin-top: calc(var(--s6) * -1); }
}

/* ---------- race + card: one unit ---------- */
#level-planet .pl-race-card { padding-right: var(--s5); }
#level-planet .pl-race-sel { display: none; margin: 0 0 var(--s2); color: var(--purple-t); }
#level-planet .pl-pick { transition: box-shadow var(--dur-1); }
#level-planet .pl-pick.pl-preview { box-shadow: 0 0 0 3px var(--yellow); }
@media (max-width: 900px) {
  #level-planet .pl-pick, #level-planet .pl-race-card { grid-column: 1 / -1; }
  #level-planet .pl-pick { position: static; margin-top: 0; }
  #level-planet .pl-race-sel { display: block; }
}

/* ===== levels/city.css ===== */
/* Level 2: City. Every selector starts with #level-city. */

#level-city figure.card { margin: 0; }
#level-city .cty-note { margin: var(--s2) 0; font-size: var(--t-hand); color: var(--ink); min-height: 2.4em; }

#level-city .chart .mark.mine { fill: var(--paper-hi); stroke: var(--ink); stroke-width: 2; }
#level-city .chart .hit { pointer-events: all; }

/* ---------- ticket ---------- */
#level-city .cty-ticket { --tape-x: 60%; padding-top: var(--s4); overflow: visible; align-self: start; }
#level-city .cty-ticket-body { position: relative; display: grid; gap: var(--s1); }
#level-city .cty-ticket-art { line-height: 0; margin: 0 0 var(--s2); }
#level-city .cty-ticket-art svg { width: 100%; max-width: 300px; height: auto; display: block; }
#level-city .cty-ticket-art.has-photo { position: absolute; right: -30px; top: -44px; z-index: 3; rotate: 5deg; pointer-events: none; margin: 0; }
#level-city .cty-ticket-art.has-photo ~ .cty-ticket-kicker { margin-top: 112px; }
#level-city .cty-ticket-art.has-photo ~ .cty-ticket-name, #level-city .cty-ticket-art.has-photo ~ .cty-ticket-country { max-width: 62%; }
#level-city .cty-ticket-kicker { margin: 0; color: var(--ink-3); font-size: var(--t-hand-s); }
#level-city .cty-ticket-name { margin: 0; font-family: var(--f-display); text-transform: uppercase; line-height: .92; font-size: clamp(34px, 3.6vw, 54px); color: var(--ink); }
#level-city .cty-ticket-name span { background: linear-gradient(transparent 58%, var(--purple) 58% 90%, transparent 90%); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 .06em; }
#level-city .cty-ticket-country { margin: 6px 0 0; font-size: var(--t-hand); color: var(--ink-2); }
#level-city .cty-ticket-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; margin-top: var(--s2); }
#level-city .cty-ticket-score { margin: 0; display: flex; align-items: baseline; gap: var(--s2); }
#level-city .cty-ticket-climate { margin: 0; }
#level-city .cty-ticket-mode { margin: 0; font-size: var(--t-hand-s); color: var(--ink); }
#level-city .cty-ticket-mode[hidden] { display: none; }
#level-city .cty-ticket-radar { margin-top: var(--s3); border-top: 2px dashed var(--ink-3); padding-top: var(--s3); }
#level-city .cty-ticket-radar svg { display: block; width: 100%; max-width: 380px; margin: 0 auto; min-height: 260px; }
#level-city .cty-ticket-radar .legend { justify-content: center; margin: var(--s2) 0 0; }
#level-city .cty-radar-note { text-align: center; margin: var(--s2) 0 0; font-size: var(--t-hand-s); }
#level-city .cty-select { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s3); font-size: var(--t-hand-s); }
#level-city .cty-select[hidden] { display: none; }
#level-city .cty-select-in {
  min-height: 40px; padding: 0 44px 0 16px; border: 1.5px solid var(--ink); border-radius: var(--r-pill); background-color: var(--paper-hi);
  font-family: var(--f-hand); font-weight: 600; font-size: 15px; cursor: pointer; appearance: none; -webkit-appearance: none;

}

/* desktop: the ticket spans the head row and the hero row, so the hero sits beside it (no empty column) */
/* desktop: two column stacks (left: head, twin, rank; right: ticket, atlas), so a tall card never leaves an empty cell beside it */
#level-city .cty-col { display: flex; flex-direction: column; gap: var(--s6); min-width: 0; }

#level-city .cty-town-1 { background-image: radial-gradient(circle, #857f7640 1.2px, transparent 1.6px); background-size: 6px 6px; }
#level-city .cty-town.chosen { box-shadow: 6px 8px 0 var(--ink); outline: 3px solid var(--purple); outline-offset: 3px; }
#level-city .cty-town-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); padding-bottom: var(--s2); border-bottom: 2px dashed var(--ink-3); }
#level-city .cty-town-name { font-size: clamp(30px, 3vw, 44px); }
#level-city .cty-town-sub { color: var(--ink-2); font-size: var(--t-hand-s); }
#level-city .cty-you { margin-left: auto; }
#level-city .cty-you[hidden] { display: none; }
#level-city .cty-tram-art { position: absolute; right: -14px; bottom: -18px; z-index: 3; rotate: -4deg; pointer-events: none; }
#level-city .cty-town-block { margin-top: var(--s3); }
#level-city .cty-town-stat { margin: 0; display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
#level-city .cty-town-stat .big-num { font-size: clamp(44px, 5vw, 72px); }
#level-city .cty-town-stat .hand { font-size: var(--t-hand); }
#level-city .cty-town-pin { display: flex; align-items: center; gap: 6px; min-height: 30px; margin: var(--s3) 0 0; font-size: var(--t-hand); color: var(--purple-t); }
#level-city .cty-take { margin: var(--s5) 0 0; max-width: 60ch; min-height: 2.3em; }

/* ---------- support A: rank ---------- */
#level-city .cty-rank-leg { margin: 0 0 var(--s2); }
#level-city .cty-leg-dot { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; margin-right: 6px; overflow: visible; }
#level-city .cty-rank svg.chart:not(.cty-leg-dot) { min-height: 340px; }

/* ---------- support B: atlas ---------- */
#level-city .cty-atlas-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4) var(--s4); }
#level-city .cty-panel { min-width: 0; }
#level-city .cty-panel svg { background: var(--paper); border: 1.5px solid var(--ink); }
#level-city .cty-panel-title { display: flex; align-items: center; gap: var(--s2); margin: 0 0 var(--s2); font-family: var(--f-display); text-transform: uppercase; letter-spacing: .04em; font-size: 15px; }
#level-city .cty-plate { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 2px solid var(--ink); border-radius: 50%; background: var(--yellow); font-size: 13px; flex: none; }
#level-city .cty-leg { margin: var(--s1) 0 0; font-size: 12px; gap: 2px var(--s3); }
#level-city .sw-green { background: var(--green); }
#level-city .sw-dots { background: radial-gradient(circle, var(--ink) 30%, transparent 36%) 0 0 / 4px 4px, var(--paper-hi); }
#level-city .sw-dots-ink { background: var(--ink); width: 8px !important; height: 8px !important; vertical-align: 1px !important; }
#level-city .sw-hatch { background: repeating-linear-gradient(45deg, var(--ink) 0 2px, var(--paper-hi) 2px 5px); }
#level-city .sw-paper { background: var(--paper-hi); }
#level-city .sw-grey { background: radial-gradient(circle, var(--grey) 42%, transparent 48%) 0 0 / 4px 4px, var(--paper-hi); }
#level-city .sw-ring-water { border: 2px solid var(--water-t) !important; background: transparent; }
#level-city .sw-ring-rail { border: 2px dashed var(--water-t) !important; background: transparent; }
#level-city .sw-ring-walk { border: 2px dashed var(--walk-t) !important; background: transparent; }
#level-city .cty-cell { outline: none; }
#level-city .cty-cell.sel .cty-cell-shape { stroke-width: 3.5; }
#level-city .cty-cell.hot .cty-cell-shape, #level-city .cty-cell:focus-visible .cty-cell-shape { stroke: var(--walk-t); stroke-width: 3.5; stroke-dasharray: 5 3; }
#level-city .cty-access-ring { opacity: 0; transition: opacity var(--dur-2) var(--ease-out); }
#level-city .cty-access-ring.on { opacity: 1; }
#level-city .cty-tabs { display: none; margin-bottom: var(--s3); gap: var(--s2); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  #level-city .cty-atlas-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  #level-city .cty-ticket-art.has-photo { right: -6px; top: -30px; }
  #level-city .cty-ticket-art.has-photo .cutout-print { width: 120px !important; height: auto !important; }
  #level-city .cty-ticket-art.has-photo ~ .cty-ticket-kicker { margin-top: 70px; }
  #level-city .cty-ticket-radar svg { min-height: 0; }
  #level-city .cty-twin-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: var(--s5); }
  #level-city .cty-twin-body .cty-town-0, #level-city .cty-twin-body .cty-town-1, #level-city .cty-twin-body .cty-twin-aside { grid-column: 1 !important; grid-row: auto !important; }
  #level-city .cty-vs { display: none; }
  #level-city .cty-town { padding: var(--s4); }
  #level-city .cty-tram-art { right: -6px; bottom: -12px; }
  #level-city .cty-tram-art .cutout-print { width: 100px !important; height: auto !important; }
  #level-city .cty-rank svg.chart:not(.cty-leg-dot) { min-height: 0; }
  #level-city .cty-tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
  #level-city .cty-tabs .chip { flex: none; }
  #level-city .cty-atlas-grid { grid-template-columns: minmax(0, 1fr); }
  #level-city .cty-atlas-grid .cty-panel { display: none; }
  #level-city .cty-atlas-grid[data-tab="land"] [data-panel="land"],
  #level-city .cty-atlas-grid[data-tab="transit"] [data-panel="transit"],
  #level-city .cty-atlas-grid[data-tab="access"] [data-panel="access"],
  #level-city .cty-atlas-grid[data-tab="parking"] [data-panel="parking"] { display: block; }
}

#level-city .cty-leg-dot .mark.sel { fill: var(--purple); stroke: var(--ink); stroke-width: 2; }
#level-city .cty-leg-dot .mark.mine { fill: var(--paper-hi); stroke: var(--ink); stroke-width: 2; }
#level-city .cty-leg-dot .mark.ctx { fill: url(#ht-grey-50); stroke: var(--ink-3); stroke-width: 1; }

/* ---------- collage on the reader's town card: one row per mode (cut-out, minutes, share) ---------- */
#level-city .cty-collage { margin-top: var(--s4); padding-top: var(--s3); border-top: 2px dashed var(--ink-3); }
#level-city .cty-collage-title { margin: 0 0 var(--s2); font-size: var(--t-hand-s); color: var(--ink-2); }
#level-city .cty-collage-grid { display: grid; gap: var(--s2); }
#level-city .cty-mode { display: grid; grid-template-columns: 92px minmax(0, 1fr); grid-template-areas: "art name" "art min" "art share"; align-items: center; column-gap: var(--s3); row-gap: 0; min-width: 0; }
#level-city .cty-mode-art { grid-area: art; height: 66px; display: flex; align-items: center; justify-content: center; rotate: var(--rot, 0deg); }
#level-city .cty-mode-art .cutout, #level-city .cty-mode-art .cutout-print { max-height: 66px; }
#level-city .cty-mode-art .cutout-print { height: 66px !important; width: auto !important; }
#level-city .cty-mode-art .cutout-print img { height: 100%; width: auto; max-width: 92px; object-fit: contain; }
#level-city .cty-mode-name { grid-area: name; margin: 0; font-family: var(--f-display); text-transform: uppercase; font-size: 14px; letter-spacing: .04em; }
#level-city .cty-mode-min { grid-area: min; margin: 0; line-height: 1; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
#level-city .cty-mode-min .big-num { font-size: clamp(26px, 2.4vw, 34px); }
#level-city .cty-mode-share { grid-area: share; margin: 0; font-size: var(--t-hand-s); color: var(--ink-2); }
#level-city .cty-sharebar { display: flex; height: 16px; margin-top: var(--s3); border: 2px solid var(--ink); background: var(--paper-hi); }
#level-city .cty-sharebar .seg { min-width: 0; border-right: 1.5px solid var(--ink); }
#level-city .cty-sharebar .seg:last-child { border-right: 0; }
#level-city .seg-walk { background: var(--walk); }
#level-city .seg-car { background: var(--purple); }
#level-city .seg-moto { background: var(--yellow); }
#level-city .seg-rest { background: var(--paper-hi); background-image: radial-gradient(circle, var(--grey) 42%, transparent 48%); background-size: 4px 4px; }
#level-city .cty-sharebar-cap { margin: 4px 0 0; }
#level-city .cty-swatch { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--ink); vertical-align: -1px; }

/* ===== levels/neighbourhood.css ===== */
/* Level 3: Neighbourhood. Every selector starts with #level-neighbourhood.
   Reading order (docs/revision-plan.md 3.1): head + ticket, hero map, kids, access, home, shops, bridge. */

#level-neighbourhood .nb-card { margin: 0; }
#level-neighbourhood .nb-card figcaption { margin-top: var(--s3); }
#level-neighbourhood .nb-takeaway { margin: var(--s3) 0 0; font-size: 17px; line-height: 1.3; max-width: 52ch; }

/* ---------- ticket (selected place + radar vs city) ---------- */
#level-neighbourhood .nb-ticket {
  position: relative; align-self: start; display: grid; gap: var(--s3);
}
#level-neighbourhood .nb-ticket > .sticker { justify-self: start; margin-top: calc(var(--s6) * -1); }
#level-neighbourhood .nb-ticket-name { margin: 0; font-size: clamp(30px, 3.4vw, 46px); color: var(--purple-t, var(--pink-t)); rotate: -2deg; }
#level-neighbourhood .nb-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); margin: 0; }
#level-neighbourhood .nb-facts div { border-top: 2px solid var(--ink); padding-top: var(--s2); }
#level-neighbourhood .nb-facts dt { font-family: var(--f-hand); font-weight: 700; font-size: 14px; line-height: 1.15; }
#level-neighbourhood .nb-facts dd { margin: 0; }
#level-neighbourhood .nb-facts .big-num { font-size: clamp(30px, 3vw, 44px); margin: 4px 0 2px; }
#level-neighbourhood .nb-facts .small { font-size: 13px; line-height: 1.25; }
#level-neighbourhood .nb-radar-wrap { display: grid; justify-items: center; gap: var(--s2); }
#level-neighbourhood .nb-radar { width: 100%; max-width: 340px; height: auto; }
#level-neighbourhood .nb-radar-key { justify-content: center; }
#level-neighbourhood .nb-select { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
#level-neighbourhood .nb-select .hand { font-size: 15px; }
#level-neighbourhood .nb-pick {
  min-height: 40px; padding: 0 44px 0 16px; border: 1.5px solid var(--ink); border-radius: var(--r-pill);
  background-color: var(--paper-hi); font-family: var(--f-hand); font-weight: 600; font-size: 16px; cursor: pointer;
}
#level-neighbourhood .nb-strip { display: none; }

/* ---------- hero map ---------- */
#level-neighbourhood .nb-map-card { padding: var(--s4); }
#level-neighbourhood .nb-map-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2) var(--s4); margin-bottom: var(--s3); }
#level-neighbourhood .nb-map-title { font-size: clamp(30px, 3.4vw, 50px); }
#level-neighbourhood .nb-map-sub { margin: 0; font-size: var(--t-hand-s); color: var(--ink-2); }
#level-neighbourhood .nb-map { border: 2px solid var(--ink); background: var(--paper-hi); overflow: hidden; }
#level-neighbourhood .nb-cell { cursor: pointer; outline: none; }
@media (hover: hover) and (pointer: fine) {
  #level-neighbourhood .nb-cell:not(.is-sel):hover .nb-cell-fill { fill: url(#ht-pink-30); }
}
#level-neighbourhood .nb-cell:focus-visible .nb-cell-hit { stroke: var(--ink); stroke-width: 5; stroke-dasharray: 8 5; }
#level-neighbourhood .nb-name { font-weight: 700; }
#level-neighbourhood .nb-name-sub { fill: var(--ink-2); paint-order: stroke; stroke: var(--paper-hi); stroke-width: 3px; }
#level-neighbourhood .nb-amenity { outline: none; cursor: default; }
#level-neighbourhood .nb-amenity:focus-visible circle:nth-child(2) { stroke: var(--ink); stroke-width: 3; }
#level-neighbourhood .nb-amen-label { fill: var(--ink); }
#level-neighbourhood .nb-amenity.is-far .nb-amen-label { fill: var(--ink-2); }
#level-neighbourhood .nb-stops-wrap { margin-top: var(--s3); }
#level-neighbourhood .nb-stops-h { font-size: 18px; margin: 0 0 var(--s2); letter-spacing: .04em; }
#level-neighbourhood .nb-stops { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); list-style: none; margin: 0 0 var(--s2); padding: 0; }
#level-neighbourhood .nb-stops li { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
#level-neighbourhood .nb-stops .marker { width: 24px; height: 24px; font-size: 13px; color: var(--paper-hi); }
#level-neighbourhood .nb-stops .num { color: var(--ink-2); font-size: 13px; }

/* ---------- kids ---------- */
#level-neighbourhood .nb-kid-head { display: flex; align-items: center; gap: var(--s3); min-height: 70px; }
#level-neighbourhood .nb-kid-year { font-size: 64px; color: var(--ink); }
#level-neighbourhood .nb-kid-pct { font-size: 16px; color: var(--walk-t, var(--orange-t)); max-width: 16ch; }
#level-neighbourhood .nb-kid-ghost { cursor: pointer; outline: none; }
#level-neighbourhood .nb-kid-ghost.is-on circle:first-child { stroke: var(--ink); stroke-width: 2; }
#level-neighbourhood .nb-kid-ghost:focus-visible circle:first-child { stroke: var(--ink); stroke-width: 3; }
#level-neighbourhood .nb-kid-today { outline: none; }
#level-neighbourhood .nb-kid-r { margin: var(--s2) 0; }
#level-neighbourhood .nb-kid-chips { gap: 6px; }
#level-neighbourhood .nb-kid-chips .chip { min-height: 32px; padding: 0 10px; font-family: var(--f-mono); font-size: 13px; }

/* ---------- scatter ---------- */
#level-neighbourhood .chart .mark.city { fill: var(--pink); fill-opacity: .55; stroke: var(--ink); stroke-width: 1.2; }
#level-neighbourhood .nb-acc-dot { cursor: pointer; }
#level-neighbourhood .nb-acc-legend, #level-neighbourhood .nb-radar-key { gap: var(--s2) var(--s4); }
#level-neighbourhood .nb-acc-legend { margin-bottom: var(--s2); }
#level-neighbourhood .nb-sw-sel { background: var(--pink); }
#level-neighbourhood .nb-sw-city { background: color-mix(in srgb, var(--pink) 55%, var(--paper-hi)); width: 11px !important; height: 11px !important; }
#level-neighbourhood .nb-sw-ctx { background: radial-gradient(circle, var(--grey) 38%, transparent 44%) 0 0 / 4px 4px; border-color: var(--ink-3) !important; }

/* ---------- home ---------- */
#level-neighbourhood .nb-drag { cursor: grab; touch-action: none; outline: none; }
#level-neighbourhood .nb-drag.is-drag { cursor: grabbing; }
#level-neighbourhood .nb-drag .hit { fill: transparent; }
#level-neighbourhood .nb-drag:focus-visible .hit { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 4 3; }
#level-neighbourhood .nb-home-card .nb-takeaway { min-height: 2.6em; }
@media (prefers-reduced-motion: no-preference) {
  #level-neighbourhood .nb-drag .nb-tag { transition: transform var(--dur-1) var(--ease-out); }
  #level-neighbourhood .nb-drag.is-drag .nb-tag { transform: translateY(-6px) rotate(-3deg); }
}

/* ---------- shops ---------- */
#level-neighbourhood .nb-bagcol { outline: none; }
#level-neighbourhood .nb-bagcol:focus-visible path { stroke: var(--ink); stroke-width: 3; }
#level-neighbourhood .nb-bags { max-width: 460px; margin: 0 auto; }
/* desktop: one full-width row, bags left, takeaway and note right (no half-empty row) */
@media (min-width: 901px) {
  #level-neighbourhood .nb-bags-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr auto auto 1fr; column-gap: var(--s7); align-items: start; }
  #level-neighbourhood .nb-bags-card > .card-head { grid-column: 1 / -1; }
  #level-neighbourhood .nb-bags-card > .nb-bags { grid-column: 1; grid-row: 2 / -1; width: 100%; max-width: 480px; }
  #level-neighbourhood .nb-bags-card > .nb-takeaway { grid-column: 2; grid-row: 3; margin-top: 0; font-size: 22px; }
  #level-neighbourhood .nb-bags-card > .nb-bags-note { grid-column: 2; grid-row: 4; }
}
#level-neighbourhood .nb-bags-card .nb-takeaway { min-height: 2.6em; }
#level-neighbourhood .nb-bags-note, #level-neighbourhood .nb-home-card figcaption { min-height: 2.8em; }

/* ---------- layout rhythm ---------- */
#level-neighbourhood .nb-acc-card, #level-neighbourhood .nb-home-card { margin-top: var(--s5); }

/* ---------- photo cut-outs (window.KitArt): market, bike, house ---------- */
#level-neighbourhood .nb-art { position: absolute; z-index: 4; pointer-events: none; line-height: 0; }
#level-neighbourhood .nb-art .cutout { padding: 6px; }
#level-neighbourhood .nb-ticket-art { right: -36px; bottom: 74px; rotate: 4deg; }
#level-neighbourhood .nb-ticket-art .cutout { width: auto; }
@media (min-width: 901px) { #level-neighbourhood .nb-radar-wrap { justify-items: start; } #level-neighbourhood .nb-radar { max-width: 300px; } }
#level-neighbourhood .nb-art-bike { right: -40px; top: -118px; rotate: 6deg; }
#level-neighbourhood .nb-art-house { right: -30px; top: -84px; rotate: 5deg; }

@media (max-width: 900px) {
  #level-neighbourhood .nb-acc-card, #level-neighbourhood .nb-home-card { margin-top: 0; }
  #level-neighbourhood .nb-ticket-art { display: none; }
  #level-neighbourhood .nb-art-bike { right: -8px; top: -84px; scale: .7; transform-origin: top right; }
  #level-neighbourhood .nb-art-house { right: -8px; top: -60px; scale: .7; transform-origin: top right; }
}
@media (max-width: 640px) {
  /* phone order: head, one-line ticket strip, hero map + takeaway, full ticket, kids, access, home, shops, bridge */
  #level-neighbourhood .nb-poster > * { order: 5; }
  #level-neighbourhood .nb-poster > .shell-head { order: 0; }
  #level-neighbourhood .nb-strip {
    order: 1; display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    padding: var(--s2) var(--s3); border: 2px dashed var(--ink); background: var(--paper-hi);
  }
  #level-neighbourhood .nb-strip-name { font-size: 18px; color: var(--purple-t, var(--pink-t)); }
  #level-neighbourhood .nb-strip-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #level-neighbourhood .nb-strip .nb-select { flex: 1 1 auto; justify-content: flex-end; min-width: 0; }
  #level-neighbourhood .nb-strip .nb-pick { width: 100%; max-width: 210px; }
  #level-neighbourhood .nb-art-bike { top: -64px; scale: .55; }
  #level-neighbourhood .nb-map-card { order: 2; padding: var(--s3); }
  #level-neighbourhood .nb-ticket { order: 3; margin-top: var(--s5); }
  #level-neighbourhood .nb-select-ticket { display: none; }
  #level-neighbourhood .nb-kids-card { order: 4; }
  #level-neighbourhood .nb-facts { gap: var(--s2); }
  #level-neighbourhood .nb-facts .big-num { font-size: 28px; }
  #level-neighbourhood .nb-kid-year { font-size: 48px; }
  #level-neighbourhood .nb-art-house { display: none; }
}


/* ===== levels/street.css ===== */
/* Level 4: Street. Every selector starts with #level-street. */

/* ---------- picker: street-name signs (level ticket) ---------- */
#level-street .st-picker { align-self: start; display: grid; gap: var(--s2); }
#level-street .st-pick-kicker { margin: 0; color: var(--ink-2); font-size: var(--t-hand); }
#level-street .st-sel-name { margin: 0 0 var(--s2); rotate: -2deg; font-size: clamp(28px, 3vw, 40px); color: var(--purple-t); }
#level-street .st-chips { display: flex; flex-wrap: wrap; gap: 10px 8px; }
#level-street .st-chip {
  display: inline-grid; gap: 2px; justify-items: start; min-height: 44px; padding: 6px 12px 7px;
  border: 2px solid var(--ink); border-radius: var(--r-box); background: var(--paper-hi); cursor: pointer;
  box-shadow: 2px 3px 0 var(--ink); rotate: var(--rot, 0deg); text-align: left;
  transition: transform var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out), background-color var(--dur-1);
}
#level-street .st-chip:hover { background: var(--paper-2); transform: translateY(-2px); }
#level-street .st-chip:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--ink); }
#level-street .st-chip[aria-pressed="true"] { background: var(--purple); cursor: default; outline: 2px solid var(--ink); outline-offset: 2px; }
#level-street .st-chip-name { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .04em; font-size: 15px; line-height: 1.05; }
#level-street .st-chip-meta { font-size: 11px; color: var(--ink-2); }
#level-street .st-chip[aria-pressed="true"] .st-chip-meta { color: var(--ink); }

/* ---------- the street lab ---------- */
#level-street .st-lab { margin: 0; }
#level-street .st-lab .card-head { flex-wrap: wrap; row-gap: 4px; }
#level-street .st-lab .card-head h3 { margin-right: auto; }
#level-street .st-reset { min-height: 34px; padding: 0 10px; font-size: 13px; }
#level-street .st-reset[hidden] { display: none; }
#level-street figcaption { margin-top: 4px; font-size: 12px; }

/* story: lead + takeaway */
#level-street .st-story { display: grid; gap: var(--s1); margin-bottom: var(--s3); }
#level-street .st-lab-lead { margin: 0; font-size: 16px; color: var(--ink-2); max-width: 80ch; }
#level-street .st-take { margin: 0; font-size: 19px; line-height: 1.35; max-width: 82ch; min-height: 2.7em; }

/* one control panel */
#level-street .st-panel {
  display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--s3) var(--s5);
  padding: var(--s3) var(--s4); margin-bottom: var(--s4); background: var(--paper); border: 1.5px solid var(--ink);
}
#level-street .st-pg { min-width: 0; }
#level-street .st-pg-k { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; min-height: 36px; font-size: var(--t-hand); }
#level-street .st-seg { display: inline-flex; gap: 0; }
#level-street .st-seg .chip { border-radius: 0; min-height: 40px; white-space: nowrap; }
#level-street .st-seg .chip:first-child { border-radius: var(--r-pill) 0 0 var(--r-pill); }
#level-street .st-seg .chip:last-child { border-radius: 0 var(--r-pill) var(--r-pill) 0; margin-left: -1.5px; }
#level-street .st-seg .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper-hi); }
#level-street .st-parts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#level-street .st-part {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 8px;
  border: 1.5px solid var(--ink); border-radius: var(--r-pill); background: var(--paper-hi); color: var(--ink); cursor: pointer;
  font-family: var(--f-hand); font-weight: 600; font-size: 13.5px; font-variation-settings: "INFM" 50; white-space: nowrap;
}
#level-street .st-part::before {
  content: ""; flex: none; width: 14px; height: 14px; border: 1.5px solid currentColor; border-radius: 3px;
  font-size: 12px; line-height: 12px; text-align: center; font-family: var(--f-text); font-weight: 700;
}
#level-street .st-part:hover { background: var(--paper-2); }
#level-street .st-part[aria-pressed="true"] { background: var(--ink); color: var(--paper-hi); }
#level-street .st-part[aria-pressed="true"]::before { content: "✓"; background: var(--paper-hi); color: var(--ink); border-color: var(--paper-hi); }
#level-street .st-ctl-top { display: flex; align-items: center; gap: 8px; min-height: 36px; }
#level-street .st-ctl-label { font-size: var(--t-hand); white-space: nowrap; }
#level-street .st-ctl-out { margin-left: auto; white-space: nowrap; font-size: 15px; background: var(--yellow); padding: 1px 8px; border-radius: var(--r-pill); border: 1.5px solid var(--ink); }
#level-street .st-rain { min-height: 32px; padding: 0 10px; font-size: 14px; }
#level-street .st-rain[aria-pressed="true"] { background: var(--water); }
#level-street .st-range-wrap { position: relative; margin-top: 6px; }
#level-street .st-real { position: absolute; top: 24px; width: 0; height: 0; translate: -6px 0; border: 6px solid transparent; border-bottom: 9px solid var(--purple-t); border-top: 0; pointer-events: none; }
#level-street .st-tick { position: absolute; top: 3px; width: 2px; height: 22px; translate: -1px 0; background: var(--ink-2); pointer-events: none; }
#level-street .st-real[hidden], #level-street .st-tick[hidden] { display: none; }
#level-street .st-ctl-note { margin: 8px 0 0; font-size: 12px; color: var(--purple-t); white-space: pre-wrap; }

/* one picture + one results panel */
#level-street .st-body { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); gap: var(--s5); align-items: start; }
#level-street .st-vis-svg { display: block; width: 100%; height: auto; }
#level-street .st-share:focus-visible { outline: none; }
#level-street .st-share:focus-visible rect { stroke: var(--purple-t); stroke-width: 3; }
#level-street .st-legend { list-style: none; margin: var(--s2) 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px var(--s4); font-size: 13px; }
#level-street .st-legend li { display: flex; align-items: center; gap: 6px; }
#level-street .st-legend li b { font-weight: 500; }
#level-street .st-legend .st-legend-n { color: var(--ink-2); font-size: 12px; }
#level-street .st-k { flex: none; width: 14px; height: 14px; border: 1.2px solid var(--ink); }
#level-street .st-k-park { background: var(--ink); border-radius: 3px; }
#level-street .st-k-stall { background: var(--paper); border-radius: 2px; }
#level-street .st-k-litter { background: var(--grey); border-radius: 50%; width: 9px; height: 9px; margin: 0 2px; }
#level-street .st-k-broken { background: repeating-linear-gradient(45deg, var(--paper-2) 0 3px, var(--grey) 3px 4px); }
#level-street .st-k-tree { background: var(--green); border-radius: 50%; opacity: .75; border-color: var(--green-t); }
#level-street .st-k-walk { background: var(--walk); border-radius: 50%; width: 10px; height: 10px; margin: 0 2px; border-color: var(--walk); }
#level-street .st-k-path { border: 1.6px dashed var(--walk); width: 18px; height: 10px; }

#level-street .st-res { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
#level-street .st-counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.5fr); gap: 6px; margin-top: var(--s3); align-items: stretch; }
#level-street .st-count { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 6px; padding: 5px 8px; border: 1.5px dashed var(--ink-3); background: var(--paper); }
#level-street .st-count b { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1; }
#level-street .st-count .small { grid-column: 1 / -1; font-size: 12px; line-height: 1.2; }
#level-street .st-counts-n { margin: 0; align-self: center; font-size: 12px; line-height: 1.35; }
#level-street .st-res-h { display: flex; gap: 6px; margin: var(--s1) 0 0; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
#level-street .st-res-h span + span::before { content: "→ "; }
#level-street .st-res-list { display: grid; gap: var(--s2); }
#level-street .st-res-row { position: relative; padding: 7px 10px 9px; background: var(--paper-hi); border: 1.5px solid var(--ink); }
#level-street .st-res-k { display: flex; align-items: center; gap: 6px; margin: 0 0 2px; font-size: 13px; color: var(--ink-2); padding-right: 52px; }
#level-street .st-res-v { margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; font-family: var(--f-display); font-size: 23px; line-height: 1.1; }
#level-street .st-res-v .mono { font-family: var(--f-display); }
#level-street .st-res-now { color: var(--ink-2); }
#level-street .st-res-arrow { font-family: var(--f-text); font-size: 18px; color: var(--ink-3); }
#level-street .st-res-aft { padding: 0 4px; }
#level-street .st-res-row.is-after .st-res-aft { background: linear-gradient(transparent 45%, var(--yellow) 45% 92%, transparent 92%); }
#level-street .st-res-row:not(.is-after) .st-res-now { color: var(--ink); }
#level-street .st-res-row:not(.is-after) .st-res-aft { color: var(--ink-3); }
#level-street .st-res-chg { position: absolute; right: 8px; top: 7px; font-size: 13px; padding: 1px 7px; border-radius: var(--r-pill); border: 1.5px solid var(--ink); background: var(--paper); }
#level-street .st-res-sub { margin: 3px 0 0; font-size: 12.5px; line-height: 1.35; }
#level-street .st-strip { display: block; width: 100%; height: 22px; margin-top: 4px; }
#level-street .st-res-note { margin: var(--s1) 0 0; font-size: 12.5px; }
#level-street .st-res-go { align-self: flex-start; min-height: 40px; padding: 0 2px; font-size: 14px; }
#level-street .st-cap { margin-top: var(--s3); }

/* ---------- motion (enter + state change) ---------- */
@media (prefers-reduced-motion: no-preference) {
  #level-street .st-chip { animation: st-drop .3s var(--ease-out) backwards; }
  #level-street .st-chip:nth-child(2) { animation-delay: 40ms; } #level-street .st-chip:nth-child(3) { animation-delay: 80ms; }
  #level-street .st-chip:nth-child(4) { animation-delay: 120ms; } #level-street .st-chip:nth-child(5) { animation-delay: 160ms; }
  #level-street .st-chip:nth-child(6) { animation-delay: 200ms; } #level-street .st-chip:nth-child(7) { animation-delay: 240ms; }
  #level-street .st-chip:nth-child(8) { animation-delay: 280ms; }
  @keyframes st-drop { from { opacity: 0; translate: 0 -10px; } }
  #level-street .st-part, #level-street .st-seg .chip { transition: background-color var(--dur-1), color var(--dur-1); }
}

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  #level-street .st-panel { grid-template-columns: 1fr 1fr; }
  #level-street .st-pg-mk { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  #level-street .st-pg-mk .st-pg-k { margin: 0; }
  #level-street .st-pg-mk .st-parts { margin-top: 0; }
}
@media (max-width: 900px) {
  #level-street .st-body { grid-template-columns: 1fr; }
  #level-street .st-res-list { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  #level-street .st-counts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #level-street .st-counts-n { grid-column: 1 / -1; }
  #level-street .st-panel { grid-template-columns: 1fr; padding: var(--s3); }
  #level-street .st-pg-mk { display: block; }
  #level-street .st-pg-mk .st-parts { margin-top: 8px; }
  #level-street .st-seg .chip { padding: 0 10px; font-size: 13px; }
  #level-street .st-take { font-size: 17px; }
  #level-street .st-res-list { grid-template-columns: 1fr; }
  #level-street .st-res-v { font-size: 21px; }
  #level-street .st-legend { gap: 4px var(--s3); font-size: 12px; }
}
#level-street .st-halo { paint-order: stroke; stroke: var(--paper-hi); stroke-width: 4px; stroke-linejoin: round; }

/* ===== levels/you.css ===== */
/* Level 5: You (finale). Every selector starts with #level-you. */
#level-you .you-h3 { font-size: 18px; letter-spacing: .04em; margin: 0; }

#level-you .you-head { grid-column: 1 / -1; }
#level-you .you-head .lead { max-width: 62ch; }

/* ---------- Find your neighbourhood ---------- */
#level-you .you-match { margin-top: var(--s6); }
#level-you .you-match:focus { outline: none; }
#level-you .you-match-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--s6); }
#level-you .you-wants { position: relative; }
#level-you .you-lens { position: absolute; right: 12px; top: -58px; width: 64px; rotate: 8deg; pointer-events: none; z-index: 2; }
#level-you .you-lens svg { display: block; width: 100%; height: auto; }
#level-you .you-wants-q { margin: 0 0 var(--s4); max-width: 15ch; }
#level-you .you-want-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
#level-you .you-want { display: grid; gap: 2px; padding: 6px; border: 1.5px dashed var(--ink-3); border-radius: 14px; background: transparent; transition: background-color var(--dur-1) ease, border-color var(--dur-1) ease; }
#level-you .you-want.on { border-style: solid; border-color: var(--ink); background: var(--paper); }
#level-you .you-want-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; justify-self: start;
  border: 1.5px solid var(--ink); border-radius: var(--r-pill); background: var(--paper-hi); cursor: pointer;
  font-family: var(--f-display); text-transform: uppercase; letter-spacing: .04em; font-size: 15px; color: var(--ink);
  transition: transform var(--dur-1) var(--ease-out), background-color var(--dur-1) ease;
}
#level-you .you-want-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper-hi); box-shadow: 2px 2px 0 var(--tape); }
#level-you .you-want-btn:active { transform: scale(.96); }
#level-you .you-want-ctl { display: grid; gap: 0; padding: 0 4px; }
#level-you .you-want:not(.on) .you-want-ctl { opacity: .55; }
#level-you .you-want-v { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
#level-you .you-want-temp { grid-column: auto; }
#level-you .you-weather { margin-top: var(--s4); }
#level-you .you-weather[hidden] { display: none; }
#level-you .you-weather-l { margin: 0 0 var(--s2); font-size: 16px; }
#level-you .you-weather-list { display: flex; flex-wrap: wrap; gap: 6px; }

#level-you .you-results { align-self: start; }
#level-you .you-res-count { margin: 0 0 var(--s3); display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; min-height: 56px; }
#level-you .you-res-n { font-family: var(--f-display); font-weight: 400; font-size: 52px; line-height: 1; }
#level-you .you-res-count .hand { font-size: var(--t-hand); }
#level-you .you-res-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
#level-you .you-res {
  display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: var(--s3); align-items: start;
  padding: var(--s3); background: var(--paper-hi); border: 1.5px solid var(--ink); border-radius: var(--r-box); box-shadow: 2px 3px 0 var(--ink);
}
#level-you .you-res.top { background: var(--purple-wash); }
#level-you .you-res:nth-child(2) { rotate: .8deg; } #level-you .you-res:nth-child(3) { rotate: -.6deg; }
@media (prefers-reduced-motion: no-preference) {
  #level-you .you-res { animation: you-deal 300ms var(--ease-out) backwards; }
  @keyframes you-deal { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
}
#level-you .you-res.you-picked { outline: 3px solid var(--ink); outline-offset: 3px; }
#level-you .you-res-t { min-width: 0; display: grid; gap: 2px; }
#level-you .you-res-rank { font-size: 14px; color: var(--purple-t); }
#level-you .you-res-rd { display: grid; justify-items: center; gap: 4px; }
#level-you .you-res-rd svg { display: block; width: 116px; height: auto; }
#level-you .you-res-score { font-family: var(--f-display); font-size: 15px; line-height: 1; padding: 3px 7px 2px; border: 1.5px solid var(--ink); border-radius: var(--r-pill); background: var(--paper-hi); }
#level-you .you-res-score::before { content: 'walk '; font-family: var(--f-hand); font-size: 11px; }
#level-you .you-res-name { font-size: 22px; margin: 0; overflow-wrap: anywhere; }
#level-you .you-res-place { margin: 0; font-size: 15px; color: var(--ink-2); }
#level-you .you-why { list-style: none; margin: 4px 0 var(--s2); padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
#level-you .you-why li { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; padding: 2px 8px; border-radius: var(--r-pill); border: 1px solid var(--ink); background: var(--paper); }
#level-you .you-why li.ok { background: var(--paper-hi); font-weight: 600; }
#level-you .you-why li.ok::before { content: '✓'; font-weight: 800; margin-right: 1px; }
#level-you .you-why li.miss { border-style: dashed; color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 1px; }
#level-you .you-go { min-height: 40px; justify-self: start; font-size: 14px; padding: 0 var(--s4); }
#level-you .you-res-note { color: var(--ink-2); margin-top: var(--s2); }
#level-you .you-takeaway { margin: var(--s4) 0 0; font-size: var(--t-hand); line-height: 1.3; }
#level-you .you-res-n.small-n { font-size: 30px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  #level-you .you-res-list { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  #level-you .you-match-body { grid-template-columns: minmax(0, 1fr); }
  #level-you .you-res-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  #level-you .you-want-list { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #level-you .you-lens { display: none; }
  #level-you .you-res-list { grid-template-columns: minmax(0, 1fr); }
  #level-you .you-res { grid-template-columns: 92px minmax(0, 1fr); }
  #level-you .you-res-rd svg { width: 92px; }
  #level-you .you-close { grid-column: 1 / -1; }
  #level-you .you-results { min-height: 0; position: relative; top: auto; }
}

#level-you .you-art { pointer-events: none; }
#level-you .you-lens .cutout { rotate: -4deg; }

/* closing card (no button) */
#level-you .you-close { grid-column: 1 / -1; margin-top: var(--s5); }
#level-you .you-close .hand-l { margin: 0; max-width: none; }
@media (max-width: 900px) { #level-you .you-close { grid-column: 1 / -1; } }

/* ===== levels/sources.css ===== */
/* Level 6: Sources. Every selector starts with #level-sources. */
#level-sources .src-key { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s4); align-self: end; padding-bottom: var(--s5); }
#level-sources .src-key .small { flex-basis: 100%; color: var(--ink-2); margin: 0; max-width: 40ch; }
#level-sources .src-h { font-size: 18px; letter-spacing: .04em; margin: 0; }
#level-sources .src-list { margin-top: var(--s6); }
#level-sources .src-filter { display: flex; flex-wrap: wrap; gap: 6px; }
#level-sources .src-filter .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper-hi); }
#level-sources .src-count { margin: var(--s2) 0 var(--s3); color: var(--ink-3); }
#level-sources .src-ol { list-style: none; margin: 0; padding: 0; columns: 2 320px; column-gap: var(--s6); column-rule: 2px dashed var(--ink-3); }
#level-sources .src-item { break-inside: avoid; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: var(--s3); padding: var(--s3) 0 var(--s4); border-bottom: 1.5px solid var(--rule); }
#level-sources .src-id { font-size: 30px; line-height: .9; color: transparent; -webkit-text-stroke: 1.5px var(--ink); }
#level-sources .src-real .src-id { color: var(--ink); -webkit-text-stroke: 0; }
#level-sources .src-mixed .src-id { color: color-mix(in srgb, var(--ink) 35%, transparent); }
#level-sources .src-body { min-width: 0; }
#level-sources .src-top { display: flex; gap: var(--s2); align-items: flex-start; justify-content: space-between; }
#level-sources .src-claim { font-family: var(--f-text); text-transform: none; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: 0; margin: 0; }
#level-sources .src-tag { flex: none; font-size: 11px; }
#level-sources .src-tag.stamp { padding: 3px 6px; border-width: 2px; }
#level-sources .src-tag.sticker { padding: 4px 8px 3px; font-size: 11px; }
#level-sources .src-num { margin: 4px 0; font-size: 16px; line-height: 1.3; background: linear-gradient(transparent 55%, color-mix(in srgb, var(--yellow) 70%, transparent) 55%); display: inline; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
#level-sources .src-source { margin: 6px 0 2px; font-size: 14px; line-height: 1.35; color: var(--ink-2); }
#level-sources .src-urlrow { margin: 0; }
#level-sources .src-url { font-family: var(--f-mono); font-size: 12.5px; color: var(--blue-t); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
#level-sources .src-status { margin: 4px 0 0; color: var(--ink-3); font-style: italic; }

#level-sources .src-side { display: grid; gap: var(--s6); align-content: start; margin-top: var(--s7); }
#level-sources .src-prov { margin-top: var(--s6); }
#level-sources .src-dl { margin: 0; columns: 3 260px; column-gap: var(--s6); column-rule: 2px dashed var(--ink-3); }
#level-sources .src-dl-pair { break-inside: avoid; padding-bottom: var(--s2); }
#level-sources .src-dl dt { display: flex; align-items: center; gap: 6px; margin-top: var(--s2); }
#level-sources .src-dl code { font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
#level-sources .src-dl dd { margin: 0 0 0 18px; font-size: 13.5px; line-height: 1.35; color: var(--ink-2); }
#level-sources .src-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink); flex: none; background: var(--yellow); }
#level-sources .src-real .src-dot { background: var(--ink); }
#level-sources .src-mixed .src-dot { background: linear-gradient(90deg, var(--ink) 50%, var(--yellow) 50%); }
#level-sources .src-credits { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); font-size: 14px; line-height: 1.35; }
#level-sources .src-credits li { display: grid; gap: 1px; }
#level-sources .src-credits b { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; }
#level-sources .src-art-h { margin: var(--s4) 0 var(--s2); font-size: 15px; }
#level-sources .src-back { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s4); margin-top: var(--s7); padding-bottom: var(--s8); }
#level-sources .src-back .hand-l { margin: 0; flex-basis: 100%; }
@media (max-width: 900px) { #level-sources .src-side { margin-top: 0; } }
@media (max-width: 640px) {
  #level-sources .src-ol { columns: 1; }
  #level-sources .src-item { grid-template-columns: 40px minmax(0, 1fr); }
  #level-sources .src-id { font-size: 24px; }
  #level-sources .src-top { flex-direction: column; }
}

#level-sources .src-art-list { font-size: 12.5px; gap: 6px; max-height: 420px; overflow: auto; padding-right: 4px; }
#level-sources .src-art-list b { font-size: 12px; }
#level-sources .src-art-list .src-url { font-size: 11px; }

      const m = (v.length - 1) / 2;
      return (v[Math.floor(m)] + v[Math.ceil(m)]) / 2;

     starts in any rolling 60 s. Order: shell lookups, the focused level, then by distance.
     Levels far from the viewport wait until they come near; when the queue is idle, one far

  const QL = { inflight: 4, gap: 100, idleGap: 1200, budget: 100, delays: [8000, 20000, 45000] };
  function createQueryLayer(app, sched) {
    const entries = new Map();   /* sig (aql + param fields) -> entry: one SDK query */

    const alias = new Map();     /* caller name -> SDK name, when the AQL is shared */
    const gate = new Set();      /* SDK queries that the next execute() may run */
    const queue = [];            /* jobs: { entry, pkey, params, callers, attempts, state, seq, level } */
    const stats = { calls: 0, sent: 0, cacheHits: 0, shared: 0, rateLimited: 0, retried: 0, gaveUp: 0, failed: 0 };
    let seq = 0, running = 0, lastStart = 0, pausedUntil = 0, timer = null;

    function condition(v) {

      const known = byName.get(name);
      if (known) {
        if (known.entry.aql !== aql) throw new Error(`Query "${name}" was declared with another AQL. Use a new name for new AQL.`);
        if (fields !== known.entry.fields) throw new Error(`Query "${name}" params must keep the same fields (${known.entry.fields || 'none'}).`);
        return known;

      if (!e) {
        const query = app.createQuery(name, { dataset: CONFIG.dataset, aql });
        /* gate: the SDK runs this query only when the queue dispatches it */
        const own = Object.getPrototypeOf(query).shouldRun;
        query.shouldRun = function (force) { return gate.has(query) && own.call(this, force); };
        const filters = Object.keys(params || {}).sort().map((field, i) => {
          const f = app.createFilter(`${name}__p${i}`, { dataset: CONFIG.dataset, field, label: field });
          app.mapControl(f, query, { field });
          return { field, f, name: `${name}__p${i}` };
        });
        e = { name, aql, fields, query, filters, cache: new Map(), jobs: new Map(), busy: null, logged: false };
        entries.set(sig, e);

    /* ----- scheduling ----- */
    function eligible(job) { return job.level === 'shell' || sched.near(job.level); }
    function prio(job) { return job.level === 'shell' ? -1 : sched.distance(job.level); }
    function pick(any) {
      let best = null;
      for (const j of queue) {
        if (j.state !== 'queued' || j.entry.busy || (!any && !eligible(j))) continue;

        if (!job) {

          if (running || starts.length >= QL.budget / 2) return;

          job.callers.forEach((c) => { if (!c.el) c.usedLevel = true; setBusy(c.el || c.levelEl, `Busy. Retrying in ${Math.round(wait / 1000)} s…`, false); });
        } else {
