      st.wantEls[k] = sync; sync();
    },
    renderWeather(st) {
      if (!st.allNbhd || st.weatherBuilt) return;
      st.weatherBuilt = true; st.weatherBox.textContent = '';
      const types = [...new Set(st.allNbhd.map((r) => r.weather_type).filter(Boolean))].sort();
      st.weatherWrap.hidden = !types.length;
      types.forEach((t) => {
        const b = H('button', { type: 'button', class: 'chip', 'aria-pressed': 'false', 'data-w': t }, st.weatherBox);
        b.appendChild(K.icon(/rain|ocean|tropic|monsoon/i.test(t) ? 'rain' : 'sun', { size: 16 })); b.appendChild(document.createTextNode(t));
        b.addEventListener('click', () => { const s2 = st.wants.weather; s2.has(t) ? s2.delete(t) : s2.add(t); b.setAttribute('aria-pressed', String(s2.has(t))); st.onWeather(); });
      });
    },
    matcherParams(st, open) {
      const w = st.wants, P = {};
      MIN_KEYS.forEach((k) => {
        P[`wk_neighbourhoods.${k}_min`] = !open && w[k].on ? { operator: 'less_than', values: [String(w[k].v + .05)] } : null;
      });
      P['wk_neighbourhoods.transit_near_pct'] = !open && w.transit.on ? { operator: 'greater_than', values: [String(w.transit.v - .05)] } : null;
      P['wk_neighbourhoods.mean_temp_c'] = !open && w.temp.on ? { operator: 'between', values: [String(w.temp.lo), String(w.temp.hi)] } : null;
      P['wk_neighbourhoods.weather_type'] = !open && w.weather.size ? { operator: 'is', values: [...w.weather] } : null;
      return P;
    },
    async runMatcher(ctx, st) {
      ctx = ctx || st._ctx;
      const box = st.matchCard.querySelector('.you-results');
      try {
        if (!st.allNbhd) {
          const all = await ctx.query('matcher', AQL.matcher, this.matcherParams(st, true), { el: box, loading: 'Looking around…' });
          if (all) { st.allNbhd = all; this.renderWeather(st); }
        }
        const rows = await ctx.query('matcher', AQL.matcher, this.matcherParams(st, false), { el: box, loading: 'Looking around…', empty: ' ' });
        if (!rows) return;
        box.dataset.qstate = 'success'; const badge = box.querySelector(':scope > .q-status'); if (badge) badge.remove();
        if (rows.length) this.renderResults(ctx, st, rows.slice(0, 4), rows.length, false);
        else this.renderResults(ctx, st, this.closest(st), 0, true);
      } catch (e) { /* the shell shows the error on the block */ }
    },
    /* documented soft ranking (data-contract.md, Matcher ranking 4) */
    closest(st) {
      const w = st.wants, all = st.allNbhd || [];
      const keys = MIN_KEYS.filter((k) => w[k].on);
      const scored = all.map((r) => {
        let s2 = 0;
        keys.forEach((k) => { const m = N(r[`${k}_min`]); s2 += m == null ? 3 : Math.max(0, m - w[k].v) / w[k].v; });
        if (w.transit.on) s2 += Math.max(0, w.transit.v - (N(r.transit_near_pct) || 0)) / w.transit.v;
        if (w.temp.on) { const t = N(r.mean_temp_c); s2 += Math.abs(t - (w.temp.lo + w.temp.hi) / 2) / 5; }
        if (w.weather.size && !w.weather.has(r.weather_type)) s2 += 1;
        return { r, s: s2 };
      });
      scored.sort((a, b) => a.s - b.s || N(b.r.walk_score) - N(a.r.walk_score));
      return scored.slice(0, 4).map((x) => x.r);
    },
    reasons(st, r) {
      const w = st.wants, out = [];
      const L = { park: 'park', beach: 'beach', river: 'river', museum: 'museum', hospital: 'hospital', cafe: 'café', restaurant: 'food', mall: 'mall' };
      Object.keys(L).forEach((k) => { if (w[k].on) { const m = N(r[`${k}_min`]); out.push({ ok: m != null && m <= w[k].v, ic: k, t: m == null ? `${L[k]}: none in walking range` : `${L[k]} ${K.fmt.dec(m, m < 10 ? 1 : 0)} min` }); } });
      if (w.transit.on) out.push({ ok: N(r.transit_near_pct) >= w.transit.v, ic: 'transit', t: `${K.fmt.int(N(r.transit_near_pct))}% near transit` });
      if (w.temp.on || w.weather.size || out.length < 2) out.push({ ok: (!w.temp.on || (N(r.mean_temp_c) >= w.temp.lo && N(r.mean_temp_c) <= w.temp.hi)) && (!w.weather.size || w.weather.has(r.weather_type)), ic: 'heat', t: `${K.fmt.dec(N(r.mean_temp_c), 1)} °C, ${r.weather_type}` });
      return out;
    },
    renderResults(ctx, st, rows, total, soft) {
      st.resCount.textContent = '';
      if (soft) { H('b', { class: 'you-res-n small-n', text: 'No exact match.' }, st.resCount); H('span', { class: 'hand', text: ' Here are the closest ones.' }, st.resCount); }
      else { H('b', { class: 'you-res-n', text: K.fmt.int(total) }, st.resCount); H('span', { class: 'hand', text: total === 1 ? ' neighbourhood fits you' : ' neighbourhoods fit you' }, st.resCount); }
      const path = ctx.state.get();
      const mine = st.allNbhd && st.allNbhd.find((x) => x.nbhd_id === path.nbhd_id);
      const list = st.resList; list.textContent = '';
      const R = 50, vb = K.radar.viewBox(R, 'icons', false);
      rows.forEach((r, i) => {
        const li = H('li', { class: `you-res ${i === 0 ? 'top' : ''}` }, list);
        if (!K.reduced()) li.style.animationDelay = `${i * 60}ms`;
        const rw = H('div', { class: 'you-res-rd' }, li);
        const svg = S('svg', { class: 'chart', viewBox: vb }, rw);
        K.radar(svg, radarComp(r), {
          r: R, labels: 'icons', values: false, interactive: false, ink: i === 0 ? 'purple' : 'grey',
          compare: mine && mine.nbhd_id !== r.nbhd_id ? radarComp(mine) : null, compareInk: i === 0 ? 'grey' : 'walk',
          title: `${K.placeName(r.neighbourhood)}: walkability radar`, name: K.placeName(r.neighbourhood), compareName: mine ? K.placeName(mine.neighbourhood) : null
        });
        H('span', { class: 'you-res-score', text: K.fmt.int(N(r.walk_score)), 'aria-label': `Walk score ${K.fmt.int(N(r.walk_score))}` }, rw);
        const tx = H('div', { class: 'you-res-t' }, li);
        H('span', { class: 'you-res-rank display', text: `#${i + 1}` }, tx);
        H('h3', { class: 'you-res-name', text: K.placeName(r.neighbourhood) }, tx);
        H('p', { class: 'you-res-place hand', text: `${K.placeName(r.city)}, ${r.country}` }, tx);
        const why = H('ul', { class: 'you-why', 'aria-label': 'Why it fits' }, tx);
        this.reasons(st, r).forEach((x) => {
          const lw = H('li', { class: x.ok ? 'ok' : 'miss' }, why);
          lw.appendChild(K.icon(x.ic, { size: 14 })); H('span', { text: x.t }, lw);
          H('span', { class: 'sr-only', text: x.ok ? ' (fits)' : ' (misses)' }, lw);
        });
        const go = H('button', { type: 'button', class: `btn ${i === 0 ? 'primary' : ''} you-go`, 'aria-label': `Go there: ${K.placeName(r.neighbourhood)}, ${K.placeName(r.city)}, ${r.country}` }, tx);
        go.appendChild(K.icon('pin')); go.appendChild(document.createTextNode('Go there'));
        go.addEventListener('click', () => this.goTo(ctx, r, li));
        const showTip = () => { const b = li.getBoundingClientRect(), pb = list.parentNode.getBoundingClientRect(); st.resTip.show(b.left - pb.left + 60, b.top - pb.top + 8, { title: K.placeName(r.neighbourhood), rows: [['Walk score', K.fmt.int(N(r.walk_score))], ['Near services', `${K.fmt.int(N(r.people_near_services_pct))}%`], ['Tree canopy', `${K.fmt.int(N(r.tree_canopy_pct))}%`], ['Rain days a year', K.fmt.int(N(r.rain_days_yr))], ...(N(r.home_value_local) != null ? [['Home value', K.fmt.money(N(r.home_value_local), r.currency_code)]] : []), ...(MIN_KEYS.filter((k) => /^(beach|river)$/.test(k) && st.wants[k].on && N(r[`${k}_min`]) == null).map((k) => [k === 'beach' ? 'Beach' : 'River', 'none in walking range']))] }); };
        rw.addEventListener('pointerenter', showTip); rw.addEventListener('pointerleave', () => st.resTip.hide());
        go.addEventListener('focus', showTip); go.addEventListener('blur', () => st.resTip.hide());
      });
      st.lastRows = rows; st.lastTotal = total; st.lastSoft = soft;
      const top = rows[0];
      st.takeaway.textContent = top ? `${soft ? 'Closest' : 'Best'} fit: ${K.placeName(top.neighbourhood)} in ${K.placeName(top.city)}, walk score ${K.fmt.int(N(top.walk_score))}${mine ? `. ${K.placeName(mine.neighbourhood)} scores ${K.fmt.int(N(mine.walk_score))}.` : '.'}` : '';
    },
    async goTo(ctx, r, fromEl) {
      fromEl.classList.add('you-picked');
      ctx.state.set({ iso3: r.iso3, city_id: r.city_id, nbhd_id: r.nbhd_id }, { source: 'matcher' });
      await ctx.scrollTo('city');
      fromEl.classList.remove('you-picked');
    }
  });
})();

/* ===== levels/sources.js ===== */
/* Level 6: Sources. Contract: walkable-v2/docs/level-contract.md
   A poster colophon: every claim with its number, source, URL and real/synthetic status (live: wk_sources),
   what is real per table (live: wk_provenance), and credits. */
(function () {
  'use strict';
  const K = window.Kit;
  const H = (t, a, p) => K.html(t, a, p);

  const AQL_SOURCES = `explore {
  dimensions {
    claim_id: wk_sources.claim_id,
    claim: wk_sources.claim,
    number_text: wk_sources.number_text,
    source: wk_sources.source,
    url: wk_sources.url,
    real_or_synthetic: wk_sources.real_or_synthetic,
    licence: wk_sources.licence,
    in_story: wk_sources.in_story,
  }
  sorts {
    claim_id ASC,
  }
}`;
  const AQL_PROV = `explore {
  dimensions {
    table_name: wk_provenance.table_name,
    column_names: wk_provenance.column_names,
    real_or_synthetic: wk_provenance.real_or_synthetic,
  }
  sorts {
    table_name ASC,
  }
}`;
  /* real | mixed | synthetic, read from the status text */
  function kind(t) {
    const s = String(t || '').toLowerCase();
    const syn = /synthetic|modelled|made-up/.test(s), real = /real|published|un |who|measured/.test(s.replace(/^synthetic/, ''));
    if (syn && real) return 'mixed';
    return syn ? 'synthetic' : 'real';
  }
  const KIND_LABEL = { real: 'real data', mixed: 'part real', synthetic: 'synthetic' };
  /* in_story = false marks claims of charts the owner cut (2026-10-21). The data says which, not this file. */
  const inStory = (r) => !(r.in_story === false || r.in_story === 'false' || r.in_story === 0 || r.in_story === '0');
  /* old glyph names in the stored claim text: show the radar names */
  const plain = (t) => String(t || '').replace(/walkability flower/gi, 'Walkability radar').replace(/\bflowers?\b/gi, 'radar').replace(/\bpetals?\b/gi, 'axes').replace(/\bzoom(ed|ing)?\b/gi, 'level');
  /* which level shows each claim (page layout, not data): claim number ranges */
  const LEVELS = [
    { k: 'planet', label: 'Planet', test: (n) => n <= 5 || n === 25 },
    { k: 'city', label: 'City', test: (n) => (n >= 6 && n <= 11) || n === 26 || n === 27 },
    { k: 'neighbourhood', label: 'Neighbourhood', test: (n) => n >= 12 && n <= 16 },
    { k: 'street', label: 'Street', test: (n) => n >= 17 && n <= 22 },
    { k: 'all-levels', label: 'Every level', test: (n) => n >= 23 }
  ];
  const levelOf = (id) => { const n = Number(String(id).replace(/\D/g, '')); const l = LEVELS.find((x) => x.test(n)); return l ? l.k : 'all-levels'; };

  Walkable.registerLevel({
    id: 'sources',
    title: 'Sources',
    bridge: '',

    mount(el, ctx) {
      const p = H('div', { class: 'poster' }, el);
      p.appendChild(ctx.ui.head({ n: 6, kicker: 'the fine print', title: 'Where the numbers come from',
        lead: 'Every claim in this zine, the study behind it, and how real each number is. Links may not open inside the app frame. Each URL is printed so you can copy it.' }));
      const key = H('aside', { class: 'span-5 src-key', 'aria-label': 'Key' }, p);
      key.appendChild(K.stamp('real data', { ink: 'ink', rot: -5 }));
      key.appendChild(K.stamp('part real', { ink: 'blue', rot: 3 }));
      key.appendChild(K.sticker('synthetic', { ink: 'yellow', rot: -3 }));
      H('p', { class: 'small', text: 'Synthetic data follows the published direction and size of each effect. It is not a measurement.' }, key);

      const list = this.list = H('section', { class: 'card span-8 src-list', 'data-anfra-block': 'sources-list', 'data-anfra-label': 'Claims and sources', 'aria-labelledby': 'src-h' }, p);
      const head = H('div', { class: 'card-head' }, list);
      head.appendChild(K.icon('bank')); H('h2', { id: 'src-h', class: 'src-h', text: 'Claims, numbers, sources' }, head);
      this.filterRow = H('div', { class: 'src-filter' }, list);
      this.count = H('p', { class: 'src-count small', role: 'status', 'aria-live': 'polite' }, list);
      this.ol = H('ol', { class: 'src-ol' }, list);

      const side = H('div', { class: 'span-4 src-side' }, p);

      const col = H('section', { class: 'card src-colophon', 'data-anfra-block': 'sources-colophon', 'data-anfra-label': 'Colophon', 'aria-labelledby': 'src-col-h' }, side);
      const chd = H('div', { class: 'card-head' }, col); chd.appendChild(K.icon('footprints')); H('h2', { id: 'src-col-h', class: 'src-h', text: 'Colophon' }, chd);
      const ul = H('ul', { class: 'src-credits' }, col);
      [
        ['Data', 'anfra Data App. Every chart runs a live AQL query on a DuckDB file.'],
        ['Type', 'Anton, Shantell Sans, Bricolage Grotesque, DM Mono (Google Fonts, OFL).'],
        ['Icons', 'Phosphor Icons, bold (MIT).'],
        ['Print look', 'Riso inks and halftone dots drawn in SVG.'],
        ['Names', 'Vietnam ended the district level on 1 July 2025. Names like Quận 3 are former districts.']
      ].forEach(([k, v]) => { const li = H('li', null, ul); H('b', { text: k }, li); H('span', { text: v }, li); });
      this.artBox = H('div', { class: 'src-art' }, col);
      this.renderArt();

      /* what is real: full width under the list, in columns (it is long; beside the list it left a gap) */
      const prov = this.prov = H('section', { class: 'card span-12 src-prov', 'data-anfra-block': 'sources-provenance', 'data-anfra-label': 'What is real', 'aria-labelledby': 'src-prov-h' }, p);
      const ph = H('div', { class: 'card-head' }, prov); ph.appendChild(K.icon('grid-four')); H('h2', { id: 'src-prov-h', class: 'src-h', text: 'What is real, table by table' }, ph);
      this.provList = H('dl', { class: 'src-dl' }, prov);

      const back = H('div', { class: 'span-12 src-back', 'data-anfra-block': 'sources-back', 'data-anfra-label': 'Back to the start' }, p);
      H('p', { class: 'hand-l', text: 'That is the whole walk. Want to go again?' }, back);
      const b = H('button', { type: 'button', class: 'btn primary' }, back);
      b.appendChild(K.icon('sun')); b.appendChild(document.createTextNode('Back to the start'));
      b.addEventListener('click', () => ctx.scrollTo('cover'));

      this.load(ctx);
    },

    renderArt() {
      const A = window.KitArt;
      if (!A) return;
      const items = Object.entries(A).filter(([, v]) => v && typeof v === 'object' && (v.credit || v.source));
      if (!items.length) return;
      H('p', { class: 'src-art-h display', text: `Cut-out art (${items.length} photos, CC0 or public domain)` }, this.artBox);
      const ul = H('ul', { class: 'src-credits src-art-list' }, this.artBox);
      items.forEach(([name, c]) => {
        const li = H('li', null, ul);
        H('b', { text: c.subject || name }, li);
        H('span', { text: [c.credit, c.licence && !(c.credit || '').includes(c.licence) ? c.licence : ''].filter(Boolean).join(', ') }, li);
        if (c.source) H('code', { class: 'src-url', text: c.source.replace(/^https?:\/\//, '') }, li);
      });
      H('p', { class: 'small', text: 'Changes: background removed, greyscale, 6 px halftone, torn paper edge.' }, this.artBox);
    },

    async load(ctx) {
      try {
        const [rows, prov] = await Promise.all([
          ctx.query('sources', AQL_SOURCES, null, { el: this.list, loading: 'Printing the fine print…' }),
          ctx.query('provenance', AQL_PROV, null, { el: this.prov })
        ]);
        if (rows) { this.rows = rows.filter(inStory); this.renderFilter(); this.renderList(); }
        if (prov) this.renderProv(prov);
      } catch (e) { /* shell shows the error on the block */ }
    },

    /* two chip rows: level (default Planet, so the page does not grow by 22 claims at once)
       and real / synthetic. "All" shows every claim. */
    renderFilter() {
      this.f = this.f || { level: 'planet', kind: 'all' };
      const counts = { all: this.rows.length, real: 0, mixed: 0, synthetic: 0 };
      const lcounts = {};
      this.rows.forEach((r) => { counts[kind(r.real_or_synthetic)]++; const l = levelOf(r.claim_id); lcounts[l] = (lcounts[l] || 0) + 1; });
      this.filterRow.textContent = '';
      const group = (label, items, key) => {
        const g = H('div', { class: 'src-fgroup', role: 'group', 'aria-label': label }, this.filterRow);
        H('span', { class: 'src-flabel hand', text: label }, g);
        items.forEach(([k, l, n]) => {
          if (!n) return;
          const b = H('button', { type: 'button', class: 'chip', 'aria-pressed': String(this.f[key] === k), 'data-k': k, text: `${l} · ${n}` }, g);
          b.addEventListener('click', () => {
            this.f[key] = k;
            [...g.querySelectorAll('button')].forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
            this.renderList();
          });
        });
      };
      group('Level', [...LEVELS.map((l) => [l.k, l.label, lcounts[l.k]]), ['all', 'All', counts.all]], 'level');
      group('Data', [['all', 'All', counts.all], ['real', 'Real', counts.real], ['mixed', 'Part real', counts.mixed], ['synthetic', 'Synthetic', counts.synthetic]], 'kind');
    },

    renderList() {
      const ol = this.ol; ol.textContent = '';
      const f = this.f;
      const rows = this.rows.filter((r) => (f.kind === 'all' || kind(r.real_or_synthetic) === f.kind) && (f.level === 'all' || levelOf(r.claim_id) === f.level));
      this.count.textContent = rows.length ? `${rows.length} of ${this.rows.length} claims` : 'No claims for this pick. Try another chip.';
      rows.forEach((r) => {
        const k = kind(r.real_or_synthetic);
        const li = H('li', { class: `src-item src-${k}` }, ol);
        H('span', { class: 'src-id display', text: r.claim_id, 'aria-hidden': 'true' }, li);
        const body = H('div', { class: 'src-body' }, li);
        const top = H('div', { class: 'src-top' }, body);
        H('h3', { class: 'src-claim', text: plain(r.claim) }, top);
        const tag = k === 'synthetic' ? K.sticker(KIND_LABEL[k], { ink: 'yellow', rot: 0 }) : K.stamp(KIND_LABEL[k], { ink: k === 'real' ? 'ink' : 'blue', rot: 0 });
        tag.classList.add('src-tag'); top.appendChild(tag);
        if (r.number_text) H('p', { class: 'src-num hand', text: plain(r.number_text) }, body);
        H('p', { class: 'src-source', text: r.source }, body);
        if (r.url) {
          const u = H('p', { class: 'src-urlrow' }, body);
          const a = H('a', { href: r.url, target: '_blank', rel: 'noopener noreferrer', class: 'src-url', 'aria-label': `${r.url} (may not open inside the app; select to copy)` }, u);
          a.textContent = r.url.replace(/^https?:\/\//, '');
        }
        if (r.licence) { const lc = H('p', { class: 'src-licence small' }, body); H('b', { text: 'Licence: ' }, lc); lc.appendChild(document.createTextNode(r.licence)); }
        H('p', { class: 'src-status small', text: r.real_or_synthetic }, body);
      });
    },

    renderProv(rows) {
      const dl = this.provList; dl.textContent = '';
      rows.forEach((r) => {
        const k = kind(r.real_or_synthetic);
        const pair = H('div', { class: 'src-dl-pair' }, dl);
        const dt = H('dt', { class: `src-${k}` }, pair);
        H('span', { class: 'src-dot', 'aria-hidden': 'true' }, dt);
        H('code', { text: r.table_name }, dt);
        H('dd', { text: plain(`${r.column_names}: ${r.real_or_synthetic}`) }, pair);
      });
    }
  });
})();
