          job.callers.forEach((c) => { if (!c.el) c.usedLevel = true; setBusy(c.el || c.levelEl, 'The data server is busy.', true); });
        }

        drop(job);
        const err = q.error || new Error('Query failed');
        console.error(`[walkable] query ${e.name} failed:`, err.message || err);
        const msg = err.name === 'PermissionError' ? 'No access to this data.' : `Could not load: ${err.message || err}`;
        const live = liveCallers(job);
        job.callers.forEach((c) => { if (live.includes(c)) { setStatus(c.el, 'error', msg); c.reject(err); } else c.resolve(null); });

    /* query(name, aql, params?, opts?, level?) -> Promise<rows | null> */
    function query(name, aql, params, opts = {}, level = 'shell') {

        const names = new Set((opts.el.getAttribute('data-anfra-query') || '').split(/\s+/).filter(Boolean)); names.add(e.name);
        opts.el.setAttribute('data-anfra-query', [...names].join(' '));

          const ctl = new Set((opts.el.getAttribute('data-anfra-control') || '').split(/\s+/).filter(Boolean));
          e.filters.forEach((p) => ctl.add(p.name));

  /* ---------- live name lookup for the breadcrumb ---------- */

    /* one request for every name. It runs through the queue like any level query, so a host
       rate limit pauses and retries it (busy badge on the breadcrumb, "Try again" at the end).
       Other errors: log, keep the fallback labels, and let the levels go on. */
    const COLS = [['iso3', 'country', null], ['city_id', 'city', 'iso3'], ['nbhd_id', 'neighbourhood', 'city_id'], ['street_id', 'street', 'nbhd_id']];
    const ready = query('shell_places', AQL.places, null, {}, 'shell')
      .then((rows) => {
        (rows || []).forEach((r) => COLS.forEach(([k, nk, pk]) => {
          const id = r[k]; if (id == null || maps[k].has(String(id))) return;
          maps[k].set(String(id), { id: String(id), name: r[nk], parent: pk && r[pk] != null ? String(r[pk]) : null });
        }));

        Object.keys(maps).forEach((k) => { maps[k] = new Map([...maps[k].entries()].sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))); });

    return {
      ready,
      queryNames: ['shell_places'],
      get,
      name(k, id) { const r = get(k, id); return Kit.placeName(r ? r.name : (CONFIG.defaultPath[k] === id ? CONFIG.defaultLabels[k] : id)); },
      country: (id) => get('iso3', id), city: (id) => get('city_id', id), nbhd: (id) => get('nbhd_id', id), street: (id) => get('street_id', id),

  const levels = new Map();           /* id -> def */

  const nearLevels = new Set();

  }

    if (!def || !def.id || typeof def.mount !== 'function') throw new Error('registerLevel needs {id, title, mount(el, ctx)}');
    if (levels.has(def.id)) throw new Error(`Level "${def.id}" is registered twice`);
    levels.set(def.id, Object.assign({ title: def.id, bridge: '' }, def, { mounted: false, mounting: null, el: null, ctx: null }));
    if (started) console.warn(`[walkable] level ${def.id} registered after start; it is not on the page`);
  }

  /* ---------- UI helpers given to levels ---------- */
  function makeUi(base) {
    return {
      /* head({kicker, title, lead, n}) -> element: level title block (misreg title, hand kicker) */
      head(o = {}) {

        if (o.n != null || o.kicker) h('p', { class: 'hand-l t-purple shell-kicker', text: [o.n != null ? `Level ${o.n}` : '', o.kicker || ''].filter(Boolean).join(' · ') }, w);

        h('button', { type: 'button', tabindex: '-1' }, card).appendChild(document.createTextNode(''));
        return card;
      },
      /* placeholder(title, note) -> dashed slot for a chart that is not built yet */
      placeholder(title, note) {
        const w = h('div', { class: 'shell-slot' });
        h('span', { class: 'shell-slot-title display', text: title }, w);
        if (note) h('span', { class: 'small', text: note }, w);
        return w;

      status: (el, state, msg) => base.queryRaw.status(el, state, msg)

  }

  /* ---------- scroll navigation (no zoom since 2026-10-21) ---------- */

  let navSeq = 0;

  const zoomTo = scrollTo;

  /* ---------- sheets (stacked overlay) ----------
     Each section is sticky with top = min(0, viewport - height) (--sheet-top): it pins once its bottom edge reaches the
     viewport bottom, and the next section slides over it. Sticky does not change flow positions, so scroll targets and
     the active level use the flow top (sum of heights), not rects. */
  const sheets = () => [...document.querySelectorAll('#main > .level')];
  /* Flow tops, cached (perf pass 2026-10-21): scroll handlers read only this cache and window.scrollY, never layout.
     A ResizeObserver on every section and the breadcrumb, plus resize, drops the cache; the next read re-measures once. */
  let flowCache = null;

    if (flowCache) return flowCache;

      y += mt;

  function sheetScroll(target, level) {

  }

  /* ---------- 0. globe: the planet from space ---------- */
  function drawGlobe() {
    const rows = S.rows.steps; if (!rows) return;
    const ui = S.ui, g0 = ui.globeG, iso = sel();
    g0.textContent = '';
    const R = 168;
    const zoom = K.el('g', { class: 'pl-zoom' }, g0);
    const rnd = K.seeded('stars');
    for (let i = 0; i < 26; i++) {
      const a = rnd() * Math.PI * 2, rr = R + 24 + rnd() * 50, x = Math.cos(a) * rr, y = Math.sin(a) * rr * 0.9;
      const s = 2 + rnd() * 3;
      K.el('path', { d: `M${x - s},${y}H${x + s}M${x},${y - s}V${y + s}`, class: 'pl-star' }, zoom);
    }
    K.el('ellipse', { rx: R + 46, ry: 44, transform: 'rotate(-16)', class: 'pl-orbit' }, zoom);
    /* duotone plate: violet under a light-blue halftone ocean */
    K.el('circle', { r: R, cx: 5, cy: 4, fill: INK.walk, style: 'mix-blend-mode:multiply', opacity: 0.85 }, zoom);
    K.el('circle', { r: R, fill: INK.paperHi }, zoom);
    K.el('circle', { r: R, fill: K.ht('water', 30), style: 'mix-blend-mode:multiply' }, zoom);
    const clipId = 'pl-globe-clip';
    if (!document.getElementById(clipId)) {
      const cp = K.el('clipPath', { id: clipId }, ui.defs);
      K.el('circle', { r: R }, cp);
    }
    const face = K.el('g', { 'clip-path': `url(#${clipId})` }, zoom);
    [0.35, 0.72].forEach((k) => K.el('ellipse', { rx: R * k, ry: R, class: 'pl-grat' }, face));
    K.el('line', { x1: 0, x2: 0, y1: -R, y2: R, class: 'pl-grat' }, face);
    [-0.5, 0, 0.5].forEach((k) => K.el('ellipse', { cy: R * k, rx: R * Math.sqrt(1 - k * k), ry: 10 * Math.sqrt(1 - k * k), class: 'pl-grat' }, face));
    const byReg = new Map();
    rows.forEach((r) => { if (!byReg.has(r.region)) byReg.set(r.region, []); byReg.get(r.region).push(r); });
    const rs = K.scale.sqrt([0, ui.maxSteps], [0, 8.5]);
    const land = K.el('g', { class: 'pl-land' }, face);
    const pins = K.el('g', { class: 'pl-pins', role: 'group', 'aria-label': 'Countries on the globe. Use the arrow keys, then Enter to pick a country.' }, zoom);
    const pos = new Map();
    byReg.forEach((list, reg) => {
      const at = REGION_AT[reg] || [0, 0], ax = at[0] * R, ay = at[1] * R;
      const blobR = 30 + 12.5 * Math.sqrt(list.length);
      K.el('path', { d: wobbleBlob(ax, ay, blobR, reg), class: 'pl-blob' }, land);
      K.el('path', { d: wobbleBlob(ax, ay, blobR, reg), class: 'pl-blob-line', transform: 'translate(2.5,-2)' }, land);
      list.forEach((r, k) => {
        const a = k * 2.39996, d = 11.5 * Math.sqrt(k + (list.length > 1 ? 0.6 : 0));
        pos.set(r.iso3, [ax + Math.cos(a) * d, ay + Math.sin(a) * d * 0.9]);
      });
    });
    const items = [];
    rows.forEach((r, i) => {
      const [x, y] = pos.get(r.iso3), on = r.iso3 === iso;
      const g = K.el('g', { class: 'pl-pin' }, pins);
      K.el('circle', { cx: x, cy: y, r: 11, class: 'hit' }, g);
      K.el('circle', { cx: x, cy: y, r: Math.max(3.4, rs(r.steps)), class: `pl-pop ${on ? 'mark sel' : 'pl-pin-dot'}`, style: `--d:${250 + Math.min(i * 10, 400)}ms` }, g);
      items.push({
        el: g, iso: r.iso3,
        label: `${r.country}: ${fmtI(r.steps)} steps a day. Press Enter to pick.`,
        tip: () => ({ title: r.country, rows: [['Steps a day', fmtI(r.steps)]], note: 'Click to pick' })
      });
    });
    const sp = pos.get(iso);
    if (sp) {
      const top = K.el('g', { class: 'pl-pop pl-you', style: '--d:650ms', 'aria-hidden': 'true' }, zoom);
      K.iconAt(top, 'pin', sp[0], sp[1] - 17, 26, INK.ink);
      const ang = Math.atan2(sp[1] - 60, sp[0]) || 0, ox = Math.cos(ang) * (R + 18), oy = Math.sin(ang) * (R + 18) * 0.85;
      const left = ox < 0;
      K.leader(top, { x1: sp[0], y1: sp[1] - 30, x2: ox, y2: oy, bend: 12 });
      svgText(top, ox + (left ? -6 : 6), oy + 6, nameOf(iso), { class: 'svg-hand halo pl-you-label', 'text-anchor': left ? 'end' : 'start' });
      svgText(top, ox + (left ? -6 : 6), oy + 26, 'you are here', { class: 'svg-hand halo pl-you-sub', 'text-anchor': left ? 'end' : 'start' });
    }
    rove(items, tipper(ui.globeTip, ui.globeCard), Math.max(0, items.findIndex((x) => x.iso === iso)));
    ui.gCount.textContent = fmtI(rows.length);
    ui.gPub.textContent = 'Dot size shows steps a day. Bigger dot, more walking.';
  }


  /* ---------- 3. compact footprint race ---------- */
  function raceRows() {
    const all = S.rows.steps, iso = sel();
    if (S.raceAll) return all.map((r) => ({ r }));
    const n = all.length, keep = new Set();
    for (let i = 0; i < 5; i++) { keep.add(i); keep.add(n - 1 - i); }
    const si = all.findIndex((r) => r.iso3 === iso);
    if (si >= 0) [si - 1, si, si + 1].forEach((i) => { if (i >= 0 && i < n) keep.add(i); });
    const idx = [...keep].sort((a, b) => a - b), out = [];
    idx.forEach((i, k) => { if (k && i - idx[k - 1] > 1) out.push({ gap: i - idx[k - 1] - 1 }); out.push({ r: all[i] }); });
    return out;
  }
  function drawRace(anim) {
    const all = S.rows.steps, ui = S.ui;
    if (!all) return;
    const svg = ui.raceSvg, iso = sel(), N = S.narrow, mean = meanSteps();
    still(ui.raceCard, anim);
    svg.textContent = '';
    const list = raceRows();
    const laneH = S.raceAll ? (N ? 20 : 22) : (N ? 24 : 27), gapH = 18;
    const top = 44, bottom = 50, nameW = N ? 96 : 120, right = N ? 54 : 70;
    const W = N ? 360 : 640;
    const bodyH = list.reduce((a, it) => a + (it.gap ? gapH : laneH), 0);
    const H = top + bodyH + bottom;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const x = K.scale.linear([0, Math.ceil(ui.maxSteps / 1000) * 1000], [nameW, W - right]);
    const trackB = top + bodyH;
    const g = K.el('g', null, svg);
    K.el('rect', { x: nameW - 6, y: top - 6, width: W - right - nameW + 12, height: bodyH + 12, class: 'pl-track' }, g);
    K.axis(g, x, { orient: 'bottom', at: trackB + 8, ticks: N ? 4 : 7, grid: trackB - top + 14, title: 'steps a day', format: (v) => (v ? `${v / 1000}k` : '0') });
    K.el('line', { x1: x(0), x2: x(0), y1: top - 10, y2: trackB + 8, class: 'pl-startline' }, g);
    const lanes = K.el('g', { role: 'group', 'aria-label': 'Countries by steps a day. Use the arrow keys, then Enter to pick a country.' }, g);
    const sz = Math.max(0.4, Math.min(0.8, laneH / 36));
    const stepPx = 30 * sz + 7;
    const items = [];
    let y = top, li = 0;
    list.forEach((it) => {
      if (it.gap) {
        svgText(g, (nameW + W - right) / 2, y + gapH / 2, `· · · ${it.gap} more · · ·`, { class: 'pl-gap', 'text-anchor': 'middle', 'dominant-baseline': 'central' });
        y += gapH; return;
      }
      const r = it.r, cy = y + laneH / 2, on = r.iso3 === iso, rank = all.indexOf(r) + 1;
      const lg = K.el('g', { class: `pl-lane${on ? ' on' : ''}` }, lanes);
      K.el('rect', { x: 0, y, width: W - right + 6, height: laneH, class: on ? 'pl-lane-sel' : 'hit' }, lg);
      K.el('line', { x1: nameW - 6, x2: W - right + 6, y1: y + laneH, y2: y + laneH, class: 'pl-laneline' }, lg);
      svgText(lg, nameW - 12, cy, shortName(r.country), { class: `pl-lane-name${on ? ' on' : ''}`, 'text-anchor': 'end', 'dominant-baseline': 'central', 'font-size': N ? 12 : 14 });
      const xe = x(r.steps), prints = K.el('g', { class: 'pl-prints' }, lg);
      let j = 0;
      for (let px = x(0) + 8; px <= xe - 4; px += stepPx, j++) {
        const side = j % 2 ? 1 : -1;
        K.el('use', {
          href: '#pl-foot', class: `pl-foot pl-pop2${on ? ' on' : ''}`,
          transform: `translate(${px.toFixed(1)},${(cy + side * laneH * 0.17).toFixed(1)}) rotate(90) scale(${(sz * (side > 0 ? -1 : 1)).toFixed(2)},${sz.toFixed(2)})`,
          style: `--d:${Math.round(j * 30 + li * 30)}ms`
        }, prints);
      }
      svgText(lg, xe + 8, cy, fmtI(r.steps), { class: `pl-lane-val pl-pop2${on ? ' on' : ''}`, 'dominant-baseline': 'central', style: `--d:${Math.round(j * 30 + li * 30)}ms` });
      items.push({
        el: lg, iso: r.iso3,
        label: `${r.country}: ${fmtI(r.steps)} steps a day, rank ${rank} of ${all.length}. Press Enter to pick.`,
        tip: () => ({ title: r.country, rows: [['Steps a day', fmtI(r.steps)], ['Rank', `${rank} of ${all.length}`]], note: 'Click to pick' })
      });
      y += laneH; li++;
    });
    if (mean != null) {
      const mx = x(mean);
      K.el('line', { x1: mx, x2: mx, y1: top - 18, y2: trackB + 6, class: 'pl-mean' }, g);
      const flag = K.el('g', { transform: `translate(${mx},${top - 18})` }, g);
      K.el('path', { d: 'M0,0 L0,-22 L40,-15 L0,-8', class: 'pl-flag' }, flag);
      svgText(g, mx + 46, top - 30, `mean ${fmtI(Math.round(mean))}`, { class: 'svg-hand halo pl-mean-label' });
    }
    rove(items, raceTip(), Math.max(0, items.findIndex((it) => it.iso === iso)));
    const per = Math.round(stepPx / (x(1000) - x(0)) * 1000 / 50) * 50;
    ui.raceCap.textContent = `One footprint = about ${fmtI(per)} steps. Mean of the ${all.length} countries. Source: Althoff et al. 2017.`;
    ui.raceBtn.textContent = S.raceAll ? 'Show fewer' : `Show all ${all.length}`;
    ui.raceBtn.setAttribute('aria-expanded', String(S.raceAll));
  }

  /* ---------- ticket: the reader's country ---------- */
  const radarVals = (r) => ({
    services: r.services / 100, density: Math.min(1, r.density / 200), canopy: r.canopy / 100,
    speed: r.speed / 100, carfree: r.carfree / 100, transit: r.transit / 100
  });
  function worldVals() {
    const rows = S.rows.radar, o = {};
    ['services', 'density', 'canopy', 'speed', 'carfree', 'transit'].forEach((k) => { o[k] = rows.reduce((a, r) => a + r[k], 0) / rows.length; });
    return radarVals(o);
  }
  function drawTicket() {
    const rows = S.rows.steps, ui = S.ui; if (!rows) return;
    const iso = shown(), r = rows.find((x) => x.iso3 === iso);
    if (!r) return;
    const mean = meanSteps(), rank = rows.indexOf(r) + 1, diff = Math.round(r.steps - mean);
    ui.pk.classList.toggle('pl-preview', !!S.preview);
    ui.pkKick.textContent = S.preview ? 'previewing. click to pick' : 'selected country';
    ui.pkName.textContent = r.country;
    ui.pkName.setAttribute('data-text', r.country);
    ui.pkSteps.textContent = fmtI(r.steps);
    ui.pkEst.textContent = 'steps a day';
    ui.pkRank.textContent = `Rank ${rank} of ${rows.length}.`;
    ui.pkDiff.textContent = `${fmtI(Math.abs(diff))} steps ${diff >= 0 ? 'over' : 'under'} the mean of ${rows.length} countries.`;
    if (ui.raceSel) ui.raceSel.textContent = `${r.country}: ${fmtI(r.steps)} steps a day, rank ${rank} of ${rows.length}.`;
    if (!ui.pkSel.options.length) {
      [...rows].sort((a, b) => a.country.localeCompare(b.country)).forEach((x) => K.html('option', { value: x.iso3, text: x.country }, ui.pkSel));
    }
    ui.pkSel.value = sel();
    const rr = (S.rows.radar || []).find((x) => x.iso3 === iso);
    if (rr) {
      const wi = (S.rows.radar.reduce((a, x) => a + x.walk, 0) / S.rows.radar.length);
      if (!ui.big) {
        ui.big = K.radar(ui.bigSvg, radarVals(rr), { r: 80, labels: 'full', ink: 'purple', compare: worldVals(), name: rr.country, compareName: 'World mean', score: Math.round(rr.walk), title: rr.country, tip: ui.pk });
      } else {
        ui.big.update(radarVals(rr), { score: Math.round(rr.walk) });
      }
      ui.bigNote.textContent = `Walk index ${Math.round(rr.walk)} of 100. World mean ${Math.round(wi)}.`;
      ui.legName.textContent = rr.country;
    }
    /* the bridge button names the country */
    const nb = S.ui.bridgeBtn, me = rows.find((x) => x.iso3 === sel());
    if (nb && nb.lastChild && me) nb.lastChild.textContent = `Next: cities in ${me.country}`;
  }

  /* ---------- 4. country radar grid ---------- */
  function radarCell(btn, r, on) {
    btn.textContent = '';
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', `${r.country}, walk index ${Math.round(r.walk)}. Pick this country.`);
    const svg = K.el('svg', { viewBox: K.radar.viewBox(40, 'none', false), class: 'pl-rd-svg', 'aria-hidden': 'true', focusable: 'false' }, btn);
    K.radar(svg, radarVals(r), { r: 40, labels: 'none', values: false, ink: on ? 'purple' : 'grey', title: r.country, misreg: on, interactive: false });
    const nm = K.html('span', { class: 'pl-rd-name' }, btn);
    nm.appendChild(document.createTextNode(shortName(r.country) + ' '));
    K.html('span', { class: 'pl-rd-num', text: String(Math.round(r.walk)) }, nm);
  }
  function drawGrid() {
    const rows = S.rows.radar, ui = S.ui; if (!rows) return;
    const iso = sel();
    if (!ui.rdCells) {
      ui.rdCells = new Map();
      rows.forEach((r) => {
        const b = K.html('button', { type: 'button', class: 'pl-rd', 'data-iso': r.iso3 }, ui.rdGrid);
        b.addEventListener('click', () => pick(r.iso3));
        ui.rdCells.set(r.iso3, { b, r, on: null });
      });
    }
    ui.rdCells.forEach((c) => { const on = c.r.iso3 === iso; if (c.on !== on) { radarCell(c.b, c.r, on); c.on = on; } });
    /* one Tab stop for the grid (the selected country); arrow keys move between radars */
    const btns = [...ui.rdCells.values()].map((c) => c.b);
    const cur = btns.find((b) => b.classList.contains('on')) || btns[0];
    btns.forEach((b) => b.setAttribute('tabindex', b === cur ? '0' : '-1'));
    if (!ui.rdKeys) {
      ui.rdKeys = true;
      ui.rdGrid.addEventListener('keydown', (e) => {
        const list = [...ui.rdGrid.querySelectorAll('button')], i = list.indexOf(document.activeElement);
        if (i < 0) return;
        let j = null;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = Math.min(list.length - 1, i + 1);
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = Math.max(0, i - 1);
        else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = list.length - 1;
        if (j == null) return;
        e.preventDefault();
        list.forEach((b) => b.setAttribute('tabindex', '-1'));
        list[j].setAttribute('tabindex', '0'); list[j].focus();
      });
    }
  }

  /* ---------- art: cut-out from the art pack, else a drawn fallback ---------- */
  function art(name, w, fallback, cls) {
    try {
      if (window.KitArt && window.KitArt[name]) {
        const f = K.cutout(name, { w, alt: '' });
        f.setAttribute('aria-hidden', 'true');
        f.classList.add('pl-art', cls);
        return f;
      }
    } catch (e) { /* fall through to the drawing */ }
    const d = fallback();
    d.classList.add(cls);
    return d;
  }
  function drawnGlobe() {

    K.el('path', { d: 'M-50,0 A50,50 0 0 0 0,50 M0,50 V64 M-20,66 H20', fill: 'none', stroke: INK.ink, 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);

  }
  function drawnShoes() {

    K.footprint(svg, { x: 22, y: -14, angle: 8, side: 'R', size: 46, ink: 'walk' });

  }

  /* ---------- level ---------- */
  Walkable.registerLevel({

      /* compact footprint race */
      const rc = card(p, 'span-7 pl-race-card', 'planet-race', 'Footprint race', 'Steps a day, country by country', 'footprints');

      ui.raceBtn = K.html('button', { type: 'button', class: 'btn pl-race-btn', 'aria-expanded': 'false', text: 'Show all' }, rc);
      ui.raceBtn.addEventListener('click', () => { S.raceAll = !S.raceAll; drawRace(true); });
      ui.raceCap = K.html('figcaption', { class: 'small', text: 'Source: Althoff et al. 2017.' }, rc);
      ui.raceTip = K.tooltip(rc);
      watch(rc);

      /* your country: the ticket */
      const pk = K.html('aside', { class: 'shell-ticket span-5 pl-pick', 'data-anfra-block': 'planet-ticket', 'data-anfra-label': 'Country card' }, p);
      ui.pk = pk;
      ui.pkKick = K.html('p', { class: 'hand t-pink pl-pick-kicker', text: 'selected country' }, pk);
      ui.pkName = K.html('h2', { class: 'misreg ink-black pl-pick-name', 'data-text': '…', text: '…' }, pk);
      const ps = K.html('p', { class: 'pl-pick-steps' }, pk);
      ui.pkSteps = K.html('span', { class: 'big-num pl-pick-num', text: '…' }, ps);
      ui.pkEst = K.html('span', { class: 'hand', text: 'steps a day' }, ps);
      ui.pkRank = K.html('p', { class: 'hand-l pl-pick-rank' }, pk);
      ui.pkDiff = K.html('p', { class: 'small' }, pk);
      ui.bigSvg = K.el('svg', { class: 'chart pl-big-svg', viewBox: K.radar.viewBox(80, 'full'), role: 'group', 'aria-label': 'Walkability radar of your country over the world mean' }, pk);
      const lg = K.html('div', { class: 'legend', 'aria-hidden': 'true' }, pk);
      lg.innerHTML = '<span><i class="sw" style="background:var(--purple)"></i><b class="pl-leg-name">your country</b></span><span><i class="sw ht ht-grey ht-50"></i>world mean</span>';

  function swarm(items, x, r, maxOff) {
    const placed = [];

    for (const i of order) {
      const px = x(items[i].v);
      let best = 0;
      for (let k = 0; k < 80; k++) {
        const off = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * r * 1.05;
        if (Math.abs(off) > maxOff) { best = off; break; }
        const hit = placed.some((p) => (p[0] - px) ** 2 + (p[1] - off) ** 2 < (2 * r + .8) ** 2);
        if (!hit) { best = off; break; }

      placed.push([px, best]); out[i] = [px, best];
    }
    return out;
  }

  /* =====================================================================
     Support B: the atlas, four small maps of the city (nbhd_list + transit_rings)
     ===================================================================== */
  const PANELS = [
    { id: 'land', n: 'A', title: 'Land use' },
    { id: 'transit', n: 'B', title: 'Transit walk rings' },
    { id: 'access', n: 'C', title: '15-minute walk' },
    { id: 'parking', n: 'D', title: 'Parking land' }
  ];
  const MAP_M = 6000;   /* one map unit = 6 km across (stylised city map) */
  function clipHalf(poly, a, b) {
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = b[0] - a[0], ny = b[1] - a[1];
    const f = (p) => (p[0] - mx) * nx + (p[1] - my) * ny;
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const P = poly[i], Q = poly[(i + 1) % poly.length], fp = f(P), fq = f(Q);
      if (fp <= 0) out.push(P);
      if ((fp <= 0) !== (fq <= 0)) { const t = fp / (fp - fq); out.push([P[0] + (Q[0] - P[0]) * t, P[1] + (Q[1] - P[1]) * t]); }
    }
    return out;
  }
  function geometry(rows) {
    const pts = rows.map((r) => [N(r.map_x), N(r.map_y)]);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), .4) + .3;
    const k = 250 / span;
    const P = ([mx, my]) => [150 + (mx - cx) * k, 150 + (my - cy) * k];
    const sites = pts.map(P);
    sites.forEach((s, i) => { for (let j = 0; j < i; j++) if (Math.hypot(s[0] - sites[j][0], s[1] - sites[j][1]) < 1) s[0] += 3; });
    const R = Math.max(...sites.map((s) => Math.hypot(s[0] - 150, s[1] - 150))) + 36;
    const rnd = K.seeded(rows.map((r) => r.nbhd_id).join(''));
    const blob = [];
    for (let i = 0; i < 44; i++) { const a = i / 44 * Math.PI * 2, rr = Math.min(146, R * (.92 + rnd() * .14)); blob.push([150 + Math.cos(a) * rr, 150 + Math.sin(a) * rr * .94]); }
    const cells = sites.map((s, i) => { let poly = blob; sites.forEach((o, j) => { if (j !== i) poly = clipHalf(poly, s, o); }); return poly; });
    const mpp = MAP_M / k;
    const stops = rows.map((r, i) => {
      const a = rnd() * Math.PI * 2, dpx = N(r.transit_stop_min) * 80 / mpp;
      return [sites[i][0] + Math.cos(a) * dpx, sites[i][1] + Math.sin(a) * dpx];
    });
    return { sites, cells, blob, mpp, stops };
  }
  const polyD = (p) => 'M' + p.map((q) => `${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('L') + 'Z';
  function arc(cx, cy, r, a0, a1) {
    if (a1 - a0 >= Math.PI * 2 - 1e-6) return `M${cx - r},${cy}a${r},${r} 0 1 0 ${2 * r},0a${r},${r} 0 1 0 ${-2 * r},0`;
    const x0 = cx + r * Math.sin(a0), y0 = cy - r * Math.cos(a0), x1 = cx + r * Math.sin(a1), y1 = cy - r * Math.cos(a1);
    return `M${cx},${cy}L${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)}Z`;
  }
  function scaleBar(svg, mpp) {

    txt(g, { class: 'svg-mono', x: 14 + px + 6, y: 290, 'font-size': 11, fill: INK.ink2 }, '1 km');
  }
  function northArrow(svg) {

  function drawAtlas() {
    const U = S.U, rows = S.rows.atlas, path = S.path;

        if (P.id === 'land') {

          const tot = parts.reduce((s, p) => s + N(r[p[0]]), 0) || 1;

          const ring = el('circle', { class: 'cty-access-ring', 'data-nid': r.nbhd_id, 'data-sel': isSel ? '1' : '0', cx: sx, cy: sy, r: 15 * 80 / G.mpp, fill: 'none', stroke: WALK_T, 'stroke-width': 2, 'stroke-dasharray': '7 5', 'pointer-events': 'none' }, top);

          txt(g, { class: 'svg-display', x: sx, y: sy - 4, 'text-anchor': 'middle', 'font-size': 13 }, 'P');

        }

        });

        const [cx0, cy0] = G.sites[0];
        el('circle', { class: 'cty-ring', cx: cx0, cy: cy0, r: railR / G.mpp, fill: 'none', stroke: WATER_T, 'stroke-width': 2, 'stroke-dasharray': '9 5', 'pointer-events': 'none' }, top);

      }

      rove(nodes, Math.max(0, si));

    U.atlasNote.textContent = sel ? `${sel.neighbourhood} is picked: ${N(sel.amenities_within_15_min)} kinds of places within a 15-minute walk. Click another patch to pick it.` : `${rows.length} neighbourhoods. Click a patch to pick one.`;

    async onSelection(ctx, path, prev, info) {

      const ch = (info && info.changed) || [];
      if (!ch.some((k) => k === 'iso3' || k === 'city_id' || k === 'nbhd_id')) return;
      await ctx.lookup.ready;
      await loadStatic();
      /* guided path: a new country clears city_id. Pick its best city. */
      if (!path.city_id && path.iso3) {
        const best = (S.rows.cities || []).find((r) => r.iso3 === path.iso3) || ctx.lookup.children('city_id', path.iso3)[0];
        const id = best && (best.city_id || best.id);
        if (id) { ctx.state.select('city_id', id, { source: 'auto' }); return; }
      }
      S.path = path;
      if (S.loaded === path.city_id && S.rows.atlas) {
        drawAtlas();                 /* only the neighbourhood moved: restyle */
        return;
      }
      const U = S.U, want = path.city_id;
      const [flowers, atlas] = await Promise.all([
        q('city_flowers', { 'wk_countries.iso3': path.iso3 }, U.ticket, 'No cities for this country.'),
        q('nbhd_list', { 'wk_cities.city_id': path.city_id }, U.atlasCard, 'No neighbourhoods for this city.')
      ]);
      if (!S.path || S.path.city_id !== want) return;   /* a newer city replaced this one */
      if (!flowers || !atlas) return;
      const prevCity = S.loaded;
      Object.assign(S.rows, { flowers, atlas });
      S.loaded = want;
      drawAll(prevCity);
    },

    onActivate() {
      if (S.played) return;
      S.played = true;
      playTwin(); playRank();
    }
  });
})();

  /* ---------- geometry: Voronoi cells for the map ---------- */
  function clipHalf(poly, a, b) {
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = b[0] - a[0], ny = b[1] - a[1];
    const side = (p) => (p[0] - mx) * nx + (p[1] - my) * ny;
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length], sp = side(p), sq = side(q);
      if (sp <= 0) out.push(p);
      if ((sp < 0 && sq > 0) || (sp > 0 && sq < 0)) { const t = sp / (sp - sq); out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]); }
    }
    return out;
  }
  function voronoi(sites, box) {
    return sites.map((a, i) => {
      let poly = [[box[0], box[1]], [box[2], box[1]], [box[2], box[3]], [box[0], box[3]]];
      sites.forEach((b, j) => { if (i !== j && poly.length) poly = clipHalf(poly, a, b); });
      return poly;
    });
  }
  function inPoly(p, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if (((yi > p[1]) !== (yj > p[1])) && (p[0] < (xj - xi) * (p[1] - yi) / ((yj - yi) || 1e-9) + xi)) c = !c;
    }
    return c;
  }
  const polyD = (poly) => 'M' + poly.map((p) => p.map((n) => n.toFixed(1)).join(',')).join('L') + 'Z';
  /* fit the city's own spread of map_x/map_y into the sheet (uniform scale, keeps the shape) */
  function sitesOf(rows) {
    const xs = rows.map((r) => num(r.map_x)), ys = rows.map((r) => num(r.map_y));
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const pad = 110, k = Math.min((MAP_W - 2 * pad) / ((x1 - x0) || 1), (MAP_H - 2 * pad) / ((y1 - y0) || 1));
    const ox = (MAP_W - (x1 - x0) * k) / 2, oy = (MAP_H - (y1 - y0) * k) / 2;
    const pts = rows.map((r, i) => [ox + (xs[i] - x0) * k, oy + (ys[i] - y0) * k]);
    /* relax: push sites apart so every district gets room for its rings and its name */
    const dmin = Math.min(260, Math.sqrt(MAP_W * MAP_H / Math.max(1, pts.length)) * .78);
    for (let it = 0; it < 80; it++) {
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[j][0] - pts[i][0], dy = pts[j][1] - pts[i][1], d = Math.hypot(dx, dy) || 1;
        if (d < dmin) { const f = (dmin - d) / 2 / d; pts[i][0] -= dx * f; pts[i][1] -= dy * f; pts[j][0] += dx * f; pts[j][1] += dy * f; }
      }
      pts.forEach((p) => { p[0] = Math.max(90, Math.min(MAP_W - 90, p[0])); p[1] = Math.max(80, Math.min(MAP_H - 80, p[1])); });
    }
    return pts;
  }
  /* CSS (.chart text) beats the SVG fill attribute: copy it to inline style */
  function fixFills(svg) { svg.querySelectorAll('text[fill]').forEach((t) => { t.style.fill = t.getAttribute('fill'); }); }

  /* =====================================================================
     2. The zine map
     ===================================================================== */
  function drawMap(animate) {
    const svg = ui.mapSvg; clear(svg);
    const rows = S.list || []; const sel = selRow(); if (!rows.length || !sel) return;
    const card = ui.mapCard, tip = ui.mapTip;
    const sites = sitesOf(rows), cells = voronoi(sites, [8, 8, MAP_W - 8, MAP_H - 8]);
    const rnd = K.seeded(String(S.path.city_id || 'x'));
    const hasRiver = rows.some((r) => r.river_min != null), hasBeach = rows.some((r) => r.beach_min != null);

    K.el('rect', { x: 0, y: 0, width: MAP_W, height: MAP_H, fill: INK.paperHi }, svg);
    const water = K.el('g', { class: 'nb-water' }, svg);

    }
    const cellsG = K.el('g', { class: 'nb-cells' }, svg);
    const treesG = K.el('g', { class: 'nb-trees', 'aria-hidden': 'true' }, svg);
    const streetsG = K.el('g', { class: 'nb-streets', 'aria-hidden': 'true' }, svg);
    if (hasRiver) {
      const y0 = MAP_H * (.25 + rnd() * .2);

      K.el('path', { d, fill: 'none', stroke: INK.ink, 'stroke-width': 30, 'stroke-linecap': 'round', opacity: .9 }, streetsG);
      K.el('path', { d, fill: 'none', stroke: INK.blue, 'stroke-width': 26, 'stroke-linecap': 'round', style: 'mix-blend-mode:multiply' }, streetsG);
      const lab = K.el('path', { d, fill: 'none', stroke: 'none' }, streetsG);

    }
    const ringsG = K.el('g', { class: 'nb-rings' }, svg);

    const amenG = K.el('g', { class: 'nb-amen' }, svg);
    const topG = K.el('g', { class: 'nb-top' }, svg);

    rows.forEach((r, i) => {

      K.el('path', { d: polyD(poly), class: 'nb-cell-fill', fill: isSel ? INK.pink : K.ht('grey', 30), style: isSel ? 'mix-blend-mode:multiply' : null }, g);
      K.el('path', { d: polyD(poly), class: 'nb-cell-hit', fill: 'transparent' }, g);
      bindTip(g, card, tip, () => ({ title: nbName(r), rows: [['Walk score', nf(num(r.walk_score))], ['Places within 15 min', String(num(r.amenities_within_15_min))], ['Trips that stay local', K.fmt.pct(num(r.local_trip_share_pct))]], note: isSel ? 'You are here.' : 'Click to move here.' }));
      activate(g, () => pick(r.nbhd_id, g));
      /* trees: one dot per 4% canopy, scattered inside the cell */
      const tr = K.seeded(String(r.nbhd_id)); const nT = Math.round(num(r.tree_canopy_pct) / 4);
      const xs = poly.map((p) => p[0]), ys = poly.map((p) => p[1]);
      const bx = [Math.min(...xs), Math.max(...xs)], by = [Math.min(...ys), Math.max(...ys)];
      for (let k = 0, tries = 0; k < nT && tries < 400; tries++) {

    });

      if (far) {
        K.el('line', { x1: cx + Math.cos(ang) * (RMAX - 40), y1: cy + Math.sin(ang) * (RMAX - 40), x2: x - Math.cos(ang) * 16, y2: y - Math.sin(ang) * 16, stroke: INK.ink3, 'stroke-width': 1.6, 'stroke-dasharray': '3 4', 'stroke-linecap': 'round' }, w);
      }

      const lb = K.el('text', { class: 'svg-hand halo nb-amen-label', x: x + (Math.cos(ang) >= 0 ? 18 : -18), y: y + 4, 'text-anchor': Math.cos(ang) >= 0 ? 'start' : 'end', 'font-size': 14 }, w);
      lb.textContent = `${it.a.label} ${K.fmt.dec(it.min, 0)}′`;
      bindTip(w, card, tip, () => ({ title: it.a.label, rows: [['Walk', `${K.fmt.dec(it.min, 0)} min`], ['About', `${nf(Math.round(it.min * M_PER_MIN / 10) * 10)} m`]], note: far ? 'Outside the 15-minute ring.' : 'Inside your 15-minute ring.' }));
      if (!far && it.min <= 15) stops.push({ x, y, it });

    });

    /* numbered errand loop: home -> nearest places in order -> home */

      const pts = [[cx, cy], ...stops.map((p) => [p.x, p.y]), [cx, cy]];

  const MODE = {

    transit: { ink: 'blue', icon: 'bus', label: 'Bus + train' },
    car: { ink: 'grey', icon: 'car', label: 'Car' }
  };
  const MODE_BY_NAME = { walk: 'walk', cycle: 'cycle', 'public transport': 'transit', transit: 'transit', car: 'car' };
  const modeKey = (r) => r.mode_key || MODE_BY_NAME[String(r.mode || '').toLowerCase()] || 'car';
  /* bag unit per currency: a round number so the tallest column is about 6 or 7 bags */
  function bagUnit(max) {
    const raw = max / 6.5; if (!(raw > 0)) return 1;
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));

    return m * pow;
  }
  function drawBags(animate) {

    const y0 = Math.max(0, base - maxStack * (bh + gap) + gap - 16 - 13 - 14);
    svg.setAttribute('viewBox', `0 ${y0} ${W} ${H - y0}`);

    let order = 0;

        K.el('path', { d: `M${x + bw * .32},${y + 2} q0,-12 ${bw * .18},-12 q${bw * .18},0 ${bw * .18},12`, fill: 'none', stroke: INK.ink, 'stroke-width': 2 }, bag);
        K.el('path', { d: bagPath(x, y, bw, bh), fill: m.ink === 'grey' ? INK.paperHi : fill, stroke: INK.ink, 'stroke-width': 1.8, 'stroke-linejoin': 'round', style: m.ink === 'grey' ? null : 'mix-blend-mode:multiply' }, bag);
        if (m.ink === 'grey') K.el('path', { d: bagPath(x, y, bw, bh), fill }, bag);
        K.el('path', { d: `M${x + 8},${y + 9}h${bw - 16}`, stroke: INK.ink, 'stroke-opacity': .35, 'stroke-width': 1.5 }, bag);
        if (animate && !K.reduced()) bag.animate([{ transform: 'translateY(-24px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320, delay: 60 + Math.min((order++) * 25, 300), easing: 'cubic-bezier(.23,1,.32,1)', fill: 'backwards' });

  function marketsOf() {
    const m = new Map();

  }
  function valueAt(pts, ws) {

  }
  /* line = home value here + local slope x (walk score - this walk score). Falls back to the USD curve. */
  function homeModel(sel) {

      const floor = hv * .12, pts = [];
      for (let w = 0; w <= 100; w += 5) pts.push([w, Math.max(floor, hv + sl * (w - ws0))]);
      return { pts, code: sel.currency_code || 'USD', slope: sl, local: true };
    }
    const mk = marketsOf(); if (!mk.length) return null;
    const cur = mk.find((m) => /typical/i.test(m.market)) || mk[Math.floor(mk.length / 2)];
    return { pts: cur.pts, code: 'USD', slope: cur.slope, local: false };
  }

    const W = v('street_width_m', v('crossing_m', 8) + 2 * swW);
    s.W = W;
    const vehPct0 = clamp(v('crossing_m', W * .5) / W * 100, 0, 90);
    s.sv = v('space_vehicles_pct', vehPct0);
    s.sg = v('space_green_pct', 0);
    s.sp = v('space_people_pct', 100 - s.sv - s.sg);
    s.lanes = Math.max(0, Math.round(v('vehicle_lanes', 2)));
    s.park = Math.max(0, Math.round(v('parking_lanes', 0)));
    s.kind = s.scenario_kind || 'lane_to_people';
    s.av = v('after_space_vehicles_pct', Math.max(0, s.sv - 15));
    s.ag = v('after_space_green_pct', s.sg + 5);
    s.ap = v('after_space_people_pct', 100 - s.av - s.ag);
    s.alanes = Math.max(0, Math.round(v('after_vehicle_lanes', s.kind === 'lane_to_people' ? Math.max(1, s.lanes - 1) : s.lanes)));
    s.apark = s.kind === 'parking_to_people' ? 0 : s.park;
    s.swW = swW;
    s.swClear = clamp(v('sidewalk_clear_width_m', swW * .5), 0, swW);
    s.pParked = clamp(v('sidewalk_parked_vehicles_pct', 20), 0, 100);
    s.pStalls = clamp(v('sidewalk_stalls_pct', 10), 0, 100);
    s.pLitter = clamp(v('sidewalk_litter_pct', 10), 0, 100);
    s.pBroken = clamp(v('sidewalk_broken_paving_pct', 10), 0, 100);
    s.score = v('sidewalk_clear_score', 60);
    s.ascore = v('after_sidewalk_clear_score', Math.min(100, s.score + 25));
    s.walk = v('walk_share_pct', 10);
    s.awalk = v('after_walk_share_pct', s.walk * 1.2);
    s.pph = v('pedestrians_per_hour', 200);
    s.footChg = v('after_foot_traffic_change_pct', 28);
    s.apph = v('after_pedestrians_per_hour', s.pph * (1 + s.footChg / 100));
    s.salesChg = v('after_shop_sales_change_pct', 29);
    s.sales = v('shop_sales_month_local', null);
    s.asales = v('after_shop_sales_month_local', s.sales != null ? s.sales * (1 + s.salesChg / 100) : null);
    s.cur = s.currency_code || 'USD';
    if (s.sales == null && fin(s.shop_sales_month_usd)) { s.sales = +s.shop_sales_month_usd; s.asales = s.sales * (1 + s.salesChg / 100); s.cur = 'USD'; }
    const fronts = v('shop_fronts', 40);
    s.nShops = Math.round(v('shops_count', fronts * .62));
    s.nAmen = Math.round(v('amenities_count', fronts * .28));
    s.nServ = Math.round(v('services_count', fronts * .1));
    s.len = v('length_m', 500);
    s.per100 = v('businesses_per_100m', (s.nShops + s.nAmen + s.nServ) / s.len * 100);
    s.anchorN = Math.round(v('anchor_n_cases', 7));
    s.casesN = Math.round(v('road_cases_total', 19));
    s.anchorFoot = v('anchor_foot_traffic_change_pct', 28);
    s.anchorSales = v('anchor_shop_sales_change_pct', 29);
    /* sidewalk after the makeover: wider by the people share it gains; 60% of the clutter cleared */
    s.aswW = swW + Math.max(0, (s.ap - s.sp) * W / 100 / 2);
    s.aswClear = clamp(s.aswW - (swW - s.swClear) * .4, 0, s.aswW);
    return s;
  }

  /* the space part of the makeover, by scenario (the clutter part is the same for every street) */
  const PART_TEXT = {
    lane_to_people: 'Give a lane to people',
    parking_to_people: 'Give the parking to people',
    narrow_lane: 'Narrow the lanes',
    green_and_seats: 'Add trees and seats'
  };

  /* ---------- module state ---------- */
  const D = { canopy: [], dry: [], wet: [] };
  let ctxRef = null;
  const ui = {};
  /* space / clear: the two parts of the makeover; ts / tc: their drawn state (0..1) while they animate */
  const st = { canopy: 30, temp: 28, rain: false, space: false, clear: false, ts: 0, tc: 0 };
  let street = null, streets = [], cityStreets = [], cityTemp = null;
  let dataReady = null, anim = null, autoPlayed = false, touched = false, seen = false;
  function autoPlay() {
    if (autoPlayed || !seen || !street || touched) return;
    autoPlayed = true;
    setTimeout(() => { if (!touched && !st.space && !st.clear) setParts(true, true); }, 900);
  }

  Walkable.registerLevel({
    id: 'street',
    title: 'Street',
    bridge: 'Now you know what to look for: shops you can walk to, a sidewalk you can walk on, and shade. Where can you find all three?',

    mount(el0, ctx) {
      ctxRef = ctx;
      K.defs();
      const p = html('div', { class: 'poster st-poster' }, el0);
      ui.head = ctx.ui.head({ n: 4, kicker: 'the street', title: 'Is your street made for people or for vehicles?', lead: 'See how your street shares its width today, and what a makeover is projected to do for walking and for local shops.' });
      p.appendChild(ui.head);
      ui.lead = ui.head.querySelector('.lead');
      buildPicker(p);
      buildLab(p);
      p.appendChild(ctx.ui.bridge(this.bridge, { next: 'you', from: 'street', label: 'Next: find your place' }));

      const q = (name, keys) => rq(ctx, name, AQL[name], null, { el: ui.lab }).then((rows) => numify(ctx, rows, keys)).catch(() => []);
      dataReady = Promise.all([
        q('canopy_temp_curve', ['canopy_pct', 'cooling_c', 'afternoon_temp_c']),
        q('weather_walk_curve', ['max_temp_c', 'activity_index'])
      ]).then(([ca, ww]) => {
        D.canopy = ca || [];
        D.dry = (ww || []).filter((r) => !truthy(r.rain_day)); D.wet = (ww || []).filter((r) => truthy(r.rain_day));
        syncControls(); render();
      });
      if (window.matchMedia) matchMedia('(max-width: 640px)').addEventListener('change', () => paint());
      /* first view: play the makeover once, unless the reader already used a control */
      onView(ui.vis.svg, () => { seen = true; autoPlay(); });
    },

    async onSelection(ctx, path, prev, info) {
      const ch = info.changed || [];
      if (!ch.some((k) => k === 'iso3' || k === 'city_id' || k === 'nbhd_id' || k === 'street_id')) return;
      await ctx.lookup.ready;
      if (!path.nbhd_id) return;
      const cid = path.city_id;
      /* reload when the city differs from the one cityTemp holds: a country change selects the city and
         neighbourhood in later events, so the city_id event can return above before the nbhd is set */
      if (!cityTemp || cityTemp.id !== cid) {
        if (cityTemp && cityTemp.id !== cid) cityTemp = null;
        rq(ctx, 'cities', AQL.cities, null, { el: ui.lab }).then((rows) => {
          const r = (rows || []).find((x) => x.city_id === ctx.state.get().city_id);
          if (!r) return;
          cityTemp = { id: r.city_id, city: r.city, temp: ctx.num(r.mean_temp_c) };
          setWeatherDefaults(); syncControls(); render();
        }).catch(() => {});
      }
      const all = await rq(ctx, 'city_streets', AQL.city_streets, { 'wk_cities.city_id': cid }, { el: ui.picker, empty: 'No streets for this city yet.' }).catch(() => null);
      if (!all) return;
      ui.lab.setAttribute('data-anfra-query', ctx.qname('city_streets'));
      cityStreets = numifyAll(ctx, all).map(fillStreet);
      streets = cityStreets.filter((r) => r.nbhd_id === path.nbhd_id);
      if (!streets.length) ctx.ui.status(ui.picker, 'empty', 'No streets for this neighbourhood yet.');
      const cur = ctx.state.get();
      if (cur.nbhd_id !== path.nbhd_id) return;
      if (!cur.street_id || !streets.some((s) => s.street_id === cur.street_id)) {
        const def = streets.find((s) => truthy(s.is_default)) || streets[0];
        if (def) { ctx.state.select('street_id', def.street_id, { source: 'auto' }); return; }
      }
      street = streets.find((s) => s.street_id === cur.street_id) || null;
      renderPicker();
      if (!street) return;
      drawLead();
      loadStreet();
      await dataReady;
      render();
    }
  });

  /* =====================================================================
     Street picker (level ticket)
     ===================================================================== */
  function buildPicker(p) {
    const w = html('div', { class: 'shell-ticket span-5 st-picker', 'data-anfra-block': 'street-picker', 'data-anfra-label': 'Pick a street' }, p);
    ui.pickHead = html('p', { class: 'hand st-pick-kicker', text: 'Pick a street' }, w);
    ui.selName = html('p', { class: 'hand-l st-sel-name', 'aria-live': 'polite' }, w);
    ui.chips = html('div', { class: 'st-chips', role: 'group', 'aria-label': 'Streets in this neighbourhood' }, w);
    ui.picker = w;
  }
  function renderPicker() {
    const ctx = ctxRef, path = ctx.state.get();
    ui.pickHead.textContent = `Pick a street in ${ctx.lookup.name('nbhd_id', path.nbhd_id)}`;
    ui.selName.textContent = street ? K.placeName(street.street) : '';
    ui.chips.textContent = '';
    streets.forEach((s, i) => {
      const sel = street && s.street_id === street.street_id;
      const b = html('button', { type: 'button', class: 'st-chip', 'aria-pressed': String(!!sel), 'aria-label': `${K.placeName(s.street)}: ${f0(s.sv)}% of the width for vehicles, ${f0(s.nShops + s.nAmen + s.nServ)} shop fronts` }, ui.chips);
      b.style.setProperty('--rot', `${((i * 37) % 7) - 3}deg`);
      html('span', { class: 'st-chip-name', text: K.placeName(s.street) }, b);
      html('span', { class: 'st-chip-meta mono', text: `${f0(s.sv)}% vehicles · ${f0(s.nShops + s.nAmen + s.nServ)} shops` }, b);
      b.addEventListener('click', () => { if (!sel) ctx.drill('street_id', s.street_id, b); });
    });
  }
  function drawLead() {
    if (!ui.lead || !street) return;
    ui.lead.textContent = `${K.placeName(street.street)} gives ${f0(street.sv)}% of its width to vehicles and ${f0(street.sp)}% to people. In the makeover below, shop sales are projected to change by ${sgn(street.salesChg)}.`;
  }
  function cityName() {
    const ctx = ctxRef, id = ctx && ctx.state.get().city_id;
    if (cityTemp && cityTemp.city && cityTemp.id === id) return K.placeName(cityTemp.city);
    return (id && ctx.lookup.name('city_id', id)) || 'this city';
  }

  /* =====================================================================
     The street lab: story, one control panel, one picture, one results panel
     ===================================================================== */
  function buildLab(p) {
    const card = html('figure', { class: 'card span-12 st-lab', 'data-anfra-block': 'street-lab', 'data-anfra-label': 'Street lab: the selected street now and after the makeover, with shade and weather' }, p);
    const head = html('div', { class: 'card-head' }, card);
    head.appendChild(K.icon('footprints')); html('h3', { text: 'Street lab: make room for people' }, head);
    ui.reset = html('button', { type: 'button', class: 'btn ghost st-reset', hidden: '' }, head);
    ui.resetTxt = html('span', { text: 'Back to the real street' }, ui.reset);
    ui.reset.addEventListener('click', resetAll);

    const story = html('div', { class: 'st-story' }, card);
    ui.labLead = html('p', { class: 'st-lab-lead' }, story);
    ui.take = html('p', { class: 'hand st-take', 'aria-live': 'polite' }, story);

    /* one control panel */
    const panel = html('div', { class: 'st-panel', role: 'group', 'aria-label': 'Change the street' }, card);
    const g1 = html('div', { class: 'st-pg st-pg-mk' }, panel);
    const k1 = html('p', { class: 'st-pg-k hand' }, g1);
    k1.appendChild(K.icon('shopping-bag', { size: 20 })); k1.appendChild(document.createTextNode('The makeover'));
    const seg = html('div', { class: 'st-seg', role: 'group', 'aria-label': 'Show the street now or after the makeover' }, g1);
    ui.bNow = html('button', { type: 'button', class: 'chip', 'aria-pressed': 'true', text: 'Now' }, seg);
    ui.bAfter = html('button', { type: 'button', class: 'chip', 'aria-pressed': 'false', text: 'After the makeover' }, seg);
    ui.bNow.addEventListener('click', () => { touched = true; setParts(false, false); });
    ui.bAfter.addEventListener('click', () => { touched = true; setParts(true, true); });
    const parts = html('div', { class: 'st-parts', role: 'group', 'aria-label': 'The two parts of the makeover' }, g1);
    ui.bSpace = html('button', { type: 'button', class: 'st-part', 'aria-pressed': 'false' }, parts);
    ui.bSpaceT = html('span', { text: 'Give a lane to people' }, ui.bSpace);
    ui.bClear = html('button', { type: 'button', class: 'st-part', 'aria-pressed': 'false' }, parts);
    html('span', { text: 'Clear the clutter' }, ui.bClear);
    ui.bSpace.addEventListener('click', () => { touched = true; setParts(!st.space, st.clear); });
    ui.bClear.addEventListener('click', () => { touched = true; setParts(st.space, !st.clear); });

    ui.ctl = {};
    const mk = (key, label, icon, min, max, step, fmtv) => {
      const c = html('div', { class: `st-pg st-ctl st-ctl-${key}` }, panel);
      const top = html('div', { class: 'st-ctl-top' }, c);
      top.appendChild(K.icon(icon, { size: 20 }));
      html('label', { class: 'hand st-ctl-label', for: `st-in-${key}`, text: label }, top);
      const out = html('output', { class: 'mono st-ctl-out', for: `st-in-${key}` }, top);
      const wrap = html('div', { class: 'st-range-wrap' }, c);
      const inp = html('input', { type: 'range', class: 'range', id: `st-in-${key}`, min, max, step }, wrap);
      const tick = html('span', { class: 'st-tick', 'aria-hidden': 'true', hidden: '' }, wrap);
      const real = html('span', { class: 'st-real', 'aria-hidden': 'true' }, wrap);
      const note = html('p', { class: 'small st-ctl-note' }, c);
      inp.addEventListener('input', () => { touched = true; st[key] = Number(inp.value); syncControls(); schedule(); });
      ui.ctl[key] = { inp, out, real, tick, note, fmtv, min, max, top };
      return c;
    };
    mk('canopy', 'Tree canopy', 'tree', 0, 100, 1, (v) => `${f0(v)}%`);
    const wc = mk('temp', 'Hottest hour', 'thermometer', -10, 42, .5, (v) => `${f1(v)} C`);
    ui.rainBtn = html('button', { type: 'button', class: 'chip st-rain', 'aria-pressed': 'false' }, wc.querySelector('.st-ctl-top'));
    ui.rainBtn.appendChild(K.icon('rain', { size: 16 })); ui.rainBtn.appendChild(document.createTextNode('Rain'));
    ui.rainBtn.addEventListener('click', () => { touched = true; st.rain = !st.rain; syncControls(); schedule(); });

    /* one picture + one results panel */
    const body = html('div', { class: 'st-body' }, card);
    const vis = html('div', { class: 'st-vis' }, body);
    const svg = el('svg', { class: 'chart st-vis-svg', viewBox: '0 0 680 560', role: 'img', 'aria-label': 'The street from the side and from above' }, vis);
    ui.legend = html('ul', { class: 'st-legend', 'aria-label': 'Key to the picture' }, vis);
    ui.counts = html('div', { class: 'st-counts', role: 'list', 'aria-label': 'Businesses along the street' }, vis);
    const res = html('div', { class: 'st-res' }, body);
    ui.resHead = html('p', { class: 'st-res-h mono', 'aria-hidden': 'true' }, res);
    ui.resList = html('div', { class: 'st-res-list' }, res);
    ui.resNote = html('p', { class: 'small st-res-note' }, res);
    const go = html('button', { type: 'button', class: 'btn ghost st-res-go' }, res);
    html('span', { text: 'See the real cases in Sources' }, go);
    go.addEventListener('click', () => { if (ctxRef) ctxRef.scrollTo('sources'); });
    html('figcaption', { class: 'small st-cap', text: 'Drawn to scale across the street, wall to wall. Top: the street from the side. Bottom: a stretch of the same street from above. Sidewalk clutter comes from the country\'s sidewalk profile, shade from Ziter et al. 2019, weather from Obradovich and Fowler 2017 (Sources).' }, card);
    ui.vis = { card, svg, tip: K.tooltip(card) };
    ui.lab = card;
  }

  /* ---------- state changes ---------- */
  function setParts(space, clear) {
    const fromS = st.ts, fromC = st.tc;
    st.space = space; st.clear = clear;
    syncToggles();
    if (anim) anim.stop();
    const toS = space ? 1 : 0, toC = clear ? 1 : 0;
    anim = K.tween(reduced() ? 0 : 850, (k) => { st.ts = lerp(fromS, toS, k); st.tc = lerp(fromC, toC, k); paint(); });
    drawResults(); drawStory(); drawLegend(); syncReset();
  }
  function syncToggles() {
    ui.bNow.setAttribute('aria-pressed', String(!st.space && !st.clear));
    ui.bAfter.setAttribute('aria-pressed', String(st.space && st.clear));
    ui.bSpace.setAttribute('aria-pressed', String(st.space));
    ui.bClear.setAttribute('aria-pressed', String(st.clear));
  }
  function realCanopy() { return street && fin(street.canopy_pct) ? Math.round(street.canopy_pct) : 20; }
  function baseTemp() { return cityTemp && cityTemp.temp != null ? Math.round(cityTemp.temp * 2) / 2 : 28; }
  function setWeatherDefaults() { st.temp = baseTemp(); st.rain = false; }
  function loadStreet() {
    if (!street) return;
    st.canopy = realCanopy();
    setWeatherDefaults();
    ui.bSpaceT.textContent = PART_TEXT[street.kind] || 'More space for people';
    ui.bSpace.setAttribute('title', SCEN_TEXT[street.kind] || '');
    ui.resetTxt.textContent = `Back to ${K.placeName(street.street)} today`;
    syncToggles(); syncControls(); render();
    autoPlay();
  }
  function resetAll() {
    touched = true;
    st.canopy = realCanopy(); setWeatherDefaults();
    syncControls(); setParts(false, false); render();
  }
  function syncReset() {
    if (!ui.reset) return;
    const moved = street && (st.space || st.clear || st.canopy !== realCanopy() || st.rain || st.temp !== baseTemp());
    ui.reset.hidden = !moved;
  }
  const tickPos = (c, v) => `calc(12px + (100% - 24px) * ${clamp((v - c.min) / (c.max - c.min), 0, 1).toFixed(4)})`;
  function syncControls() {
    if (!ui.ctl) return;
    const thr = (D.canopy.find((r) => truthy(r.above_threshold)) || {}).canopy_pct;
    const peak = D.dry.length ? D.dry.reduce((a, b) => (b.activity_index > a.activity_index ? b : a), D.dry[0]).max_temp_c : null;
    for (const key in ui.ctl) {
      const c = ui.ctl[key], v = st[key];
      c.inp.value = String(v);
      c.out.textContent = c.fmtv(v);
      c.inp.setAttribute('aria-valuetext', c.fmtv(v));
      const realV = key === 'canopy' ? (street ? realCanopy() : null) : (cityTemp ? cityTemp.temp : null);
      const tickV = key === 'canopy' ? thr : peak;
      const bits = [];
      if (fin(realV)) {
        c.real.style.left = tickPos(c, realV); c.real.hidden = false;
        bits.push(`▲ ${key === 'temp' ? `${cityName()} average` : (street ? K.placeName(street.street) : '')}: ${c.fmtv(realV)}`);
      } else c.real.hidden = true;
      if (fin(tickV)) {
        c.tick.style.left = tickPos(c, tickV); c.tick.hidden = false;
        bits.push(key === 'canopy' ? `| shade cools most past ${f0(tickV)}%` : `| most people out near ${f0(tickV)} C`);
      } else c.tick.hidden = true;
      c.note.textContent = bits.join('   ');
    }
    ui.rainBtn.setAttribute('aria-pressed', String(st.rain));
    syncReset();
  }
  let raf = 0;
  function schedule() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }
  function render() { if (!street) return; paint(); drawResults(); drawStory(); drawLegend(); syncReset(); }

  /* ---------- numbers ----------
     The data model (docs/data-changes-2026-10-21b, C34): change = anchor x moved width + a clear-sidewalk bonus
     (foot traffic .35, sales .25 per clear-score point). So each part of the makeover gets its own share;
     both parts together give the street's published after values. */
  function weatherFactor() {
    if (!D.dry.length) return 1;
    const base = interp(D.dry, 'max_temp_c', 'activity_index', baseTemp());
    const cur = interp(st.rain && D.wet.length ? D.wet : D.dry, 'max_temp_c', 'activity_index', st.temp);
    return base ? clamp(cur / base, .2, 2) : 1;
  }
  function calc() {
    const s = street;
    const dS = s.ascore - s.score, cF = .35 * dS, cS = .25 * dS;
    const any = st.space || st.clear;
    const pS = any ? st.space : true, pC = any ? st.clear : true;   /* nothing on: preview the full makeover */
    const full = pS && pC;
    const foot = full ? s.footChg : (pS ? s.footChg - cF : 0) + (pC ? cF : 0);
    const sales = full ? s.salesChg : (pS ? s.salesChg - cS : 0) + (pC ? cS : 0);
    const wf = weatherFactor();
    const cool = D.canopy.length ? Math.max(0, interp(D.canopy, 'canopy_pct', 'cooling_c', st.canopy)) : null;
    return {
      any, full, foot, sales, wf, cool,
      shadeT: cool != null ? st.temp - cool : null,
      pph0: s.pph * wf, pph1: (full ? s.apph : s.pph * (1 + foot / 100)) * wf,
      walk0: s.walk, walk1: full ? s.awalk : clamp(s.walk * (1 + .6 * foot / 100), 1, 95),
      sc0: s.score, sc1: pC ? s.ascore : s.score,
      sal0: s.sales, sal1: s.sales == null ? null : full ? s.asales : s.sales * (1 + sales / 100)
    };
  }

  /* ---------- story: lead + takeaway ---------- */
  function drawStory() {
    const s = street; if (!s) return;
    const c = calc(), name = K.placeName(s.street);
    ui.labLead.textContent = `${name} gives ${f0(s.sv)}% of its width to vehicles and ${f0(s.sp)}% to people. Change it with the controls below.`;
    let t;
    if (!c.any) t = `Now: parked vehicles cover ${f0(s.pParked)}% of the sidewalk, and ${f1(s.walk)}% of people on this street walk.`;
    else if (c.full) t = `After the makeover: ${sgn(c.foot)} people walking by and ${sgn(c.sales)} sales per business, projected from similar real streets.`;
    else if (st.space) t = `${PART_TEXT[s.kind] || 'More space for people'} alone: ${sgn(c.foot)} people walking by. Clear the clutter too for the full change.`;
    else t = `Clear the clutter alone: the clear score goes from ${f0(c.sc0)} to ${f0(c.sc1)}, and ${sgn(c.foot)} people walk by.`;
    if (Math.abs(c.wf - 1) >= .05) t += ` ${st.rain ? 'Rain' : st.temp > baseTemp() ? 'Heat' : 'Cold'} goes with about ${f0(Math.abs(1 - c.wf) * 100)}% ${c.wf < 1 ? 'fewer' : 'more'} people out.`;
    else if (c.shadeT != null && st.temp >= 30 && c.cool >= .5) t += ` Shade brings the hottest hour down to ${f1(c.shadeT)} C.`;
    ui.take.textContent = t;
  }

  /* ---------- results panel ---------- */
  function drawResults() {
    const s = street; if (!s) return;
    const c = calc();
    /* businesses along the street */
    ui.counts.textContent = '';
    [['shopping-bag', s.nShops, 'shops'], ['coffee', s.nAmen, 'cafes, places to eat'], ['first-aid', s.nServ, 'services']].forEach(([ic, n, t]) => {
      const it = html('div', { class: 'st-count', role: 'listitem' }, ui.counts);
      it.appendChild(K.icon(ic, { size: 18 }));
      html('b', { class: 'mono', text: f0(n) }, it);
      html('span', { class: 'small', text: t }, it);

      if (inRoad) x = left ? A[2] + 4 + pr() * Math.min(10, lw * .3) : A[3] - 4 - pr() * Math.min(10, lw * .3);
      else x = left ? A[1] - cw + 3 + pr() * Math.max(1, cw - 6) : A[4] + 3 + pr() * Math.max(1, cw - 6);
      const y = py0 + 8 + pr() * (planH - 16);
      el('circle', { cx: x, cy: y, r: nw ? 3.6 : 4.4, fill: I.walk, stroke: I.paperHi, 'stroke-width': 1.4 }, pg);
      if (st.rain) el('circle', { cx: x, cy: y, r: nw ? 6.5 : 8, fill: I.water, opacity: .55, style: 'mix-blend-mode:multiply' }, pg);
    }
    /* tree crowns and their shade, seen from above */
    if (hasTree) {
      const spacing = lerp(13, 5.5, can / 100), r = clamp(crownM * px, 6, nw ? 60 : 110);
      const off = K.seeded(s.street_id + 'tr')() * spacing;
      treeX.forEach((tx, side) => {
        for (let ym = off - spacing + (side ? spacing / 2 : 0); ym < Lm + spacing; ym += spacing) {
          const y = py0 + ym * px;
          el('circle', { cx: tx, cy: y, r, fill: I.green, 'fill-opacity': .62, stroke: I.greenT, 'stroke-width': 1.6, style: 'mix-blend-mode:multiply' }, pg);
          el('circle', { cx: tx, cy: y, r: 2.5, fill: I.ink }, pg);
        }
      });
    }
    if (st.rain) {
      const rr = K.seeded(s.street_id + 'drops');
      for (let i = 0; i < (nw ? 30 : 60); i++) { const x = rr() * W, y = py0 + rr() * planH; el('line', { x1: x, y1: y, x2: x - 3, y2: y + 7, stroke: I.waterT, 'stroke-width': 1.1, opacity: .7 }, pg); }
    }
    el('rect', { x: x0, y: py0, width: span, height: planH, fill: 'none', stroke: I.ink, 'stroke-width': 1.5 }, g);

    /* ---- share of the width: one 100% bar ---- */
    const shares = [['Vehicles', sv, K.ht('grey', 50), I.ink, s.sv, s.av], ['People', sp, I.paperHi, I.walkT, s.sp, s.ap], ['Green', sgp, I.green, I.greenT, s.sg, s.ag]];
    let bx = x0;
    const hits = [];
    shares.forEach(([name, v, fill, tcol]) => {
      const w = v / 100 * span;
      const grp = el('g', { class: 'st-share', role: 'img', 'aria-label': `${name}: ${f0(v)}% of the width` }, g);
      el('rect', { x: bx, y: by, width: Math.max(0, w), height: bh, fill, stroke: I.ink, 'stroke-width': 1.4 }, grp);
      const need = (name.length + 4) * (nw ? 7.6 : 8.4) + 12;
      if (w > need) el('text', { x: bx + 7, y: by + bh / 2, class: 'label', 'font-size': nw ? 12 : 13.5, 'dominant-baseline': 'central', fill: name === 'Vehicles' ? I.ink : tcol }, grp).textContent = `${name} ${f0(v)}%`;
      hits.push({ grp, fits: w > need });
      bx += w;
    });
    const small = shares.filter((sh, i) => !hits[i].fits);
    const smallTxt = small.map(([n, v]) => `${n} ${f0(v)}%`).join(' · ');
    if (nw) el('text', { x: x0, y: by + bh + 15, class: 'svg-hand', 'font-size': 11.5, fill: I.ink2 }, g).textContent = `share of the width${smallTxt ? `: ${smallTxt}` : ''}`;
    else {
      if (smallTxt) el('text', { x: x1, y: by + bh + 15, class: 'label', 'font-size': 13, 'text-anchor': 'end', fill: I.ink2 }, g).textContent = smallTxt;
      el('text', { x: x0, y: by + bh + 15, class: 'svg-hand', 'font-size': 13, fill: I.ink2 }, g).textContent = 'share of the width';
    }
    roving(hits.map((h) => h.grp), {
      show: (n, i) => { const sh = shares[i]; tipAt(V.tip, V.card, n, { title: sh[0], rows: [['Now', `${f0(sh[4])}%`], ['After the makeover', `${f0(sh[5])}%`]] }); },
      hide: () => V.tip.hide()
    });

    const state = !st.space && !st.clear ? 'now' : st.space && st.clear ? 'after the makeover' : 'with part of the makeover';
    svg.setAttribute('aria-label', `${K.placeName(s.street)}, ${state}, ${f1(s.W)} m wall to wall: vehicles ${f0(sv)}%, people ${f0(sp)}%, green ${f0(sgp)}% of the width. Sidewalk ${f1(wP)} m with a clear path of ${f1(clearM)} m. Parked vehicles on ${f0(s.pParked * kC)}% of the sidewalk length, stalls ${f0(s.pStalls * kC)}%. Tree canopy ${f0(can)}%. ${st.rain ? 'Rain' : 'Dry'}, ${f1(st.temp)} C. About ${f0(pphNow)} people walk by in the busiest hour.`);
  }
})();

/* Level 5: You (finale). Contract: walkable-v2/docs/level-contract.md

(function () {
  'use strict';
  const K = window.Kit;
  const I = K.INK;
  const H = (t, a, p) => K.html(t, a, p);
  const S = (t, a, p) => K.el(t, a, p);

  /* ---------- AQL (docs/data-contract.md) ---------- */
  const AQL = {
    matcher: `explore {

    currency_code: wk_neighbourhoods.currency_code,
    beach_min: wk_neighbourhoods.beach_min,
    river_min: wk_neighbourhoods.river_min,
    museum_min: wk_neighbourhoods.museum_min,
    hospital_min: wk_neighbourhoods.hospital_min,
    cafe_min: wk_neighbourhoods.cafe_min,
    restaurant_min: wk_neighbourhoods.restaurant_min,
    mall_min: wk_neighbourhoods.mall_min,
    mean_temp_c: wk_neighbourhoods.mean_temp_c,
    rain_days_yr: wk_neighbourhoods.rain_days_yr,

  /* ---------- helpers ---------- */
  const N = (v) => (v == null || v === '' ? null : Number(v));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  /* halftone cut-out from window.KitArt (via Kit.cutout), with a drawn fallback */

  }

  function radarComp(r) {
    const f = (v) => Math.max(0, Math.min(1, (N(v) || 0) / 100));
    return {
      services: f(r.people_near_services_pct),
      density: Math.min(1, (N(r.block_density_per_km2) || 0) / 320),
      canopy: f(r.tree_canopy_pct),
      speed: f(r.safe_speed_share_pct),

  /* wants: all are visible at once (owner note 2026-10-21) */
  const AMEN = [
    ['park', 'Park', 'park', true], ['cafe', 'Cafés', 'cafe', true], ['hospital', 'Hospital', 'hospital', true],
    ['restaurant', 'Restaurants', 'restaurant', false], ['beach', 'Beach', 'beach', false], ['river', 'River', 'river', false],
    ['museum', 'Museum', 'museum', false], ['mall', 'Mall', 'mall', false]
  ];
  const MIN_KEYS = AMEN.map((a) => a[0]);

  Walkable.registerLevel({
    id: 'you',
    title: 'You',
    bridge: '',

    mount(el, ctx) {
      K.defs();
      const st = this._st = {
        wants: { park: { on: true, v: 10 }, beach: { on: false, v: 20 }, river: { on: false, v: 15 }, museum: { on: false, v: 15 },
          hospital: { on: false, v: 15 }, cafe: { on: true, v: 10 }, restaurant: { on: false, v: 10 }, mall: { on: false, v: 20 },
          transit: { on: false, v: 70 }, temp: { on: false, lo: 15, hi: 26 }, weather: new Set() },
        allNbhd: null, _ctx: ctx

      const p = H('div', { class: 'poster' }, el);
      const head = ctx.ui.head({ n: 5, kicker: 'you', title: 'Where would you like to live?',
        lead: 'You saw what matters: daily needs close by, slow vehicles, shade. Pick what you want near home. We find the neighbourhoods that have it.' });
      head.classList.add('you-head');
      p.appendChild(head);

      const ch = H('div', { class: 'card-head' }, close);
      ch.appendChild(K.icon('footprints')); H('h2', { class: 'you-h3', text: 'That is the walk' }, ch);
      H('p', { class: 'hand-l', text: 'Every number here has a source. The list is just below.' }, close);

      this.runMatcher(ctx, st);
    },

    async onSelection(ctx, path, prev, info) {

    },

    /* =================== Find your neighbourhood (main) =================== */
    buildMatcher(p, ctx, st) {
      const card = st.matchCard = H('section', { class: 'card span-12 you-match', tabindex: '-1', 'data-anfra-block': 'you-match', 'data-anfra-label': 'Find your neighbourhood', 'aria-labelledby': 'you-match-h' }, p);
      const head = H('div', { class: 'card-head' }, card);
      head.appendChild(K.icon('map-pin')); H('h2', { id: 'you-match-h', class: 'you-h3', text: 'Find your neighbourhood' }, head);
      const body = H('div', { class: 'you-match-body' }, card);
      const left = H('div', { class: 'you-wants' }, body);
      const lens = H('div', { class: 'you-lens', 'aria-hidden': 'true' }, left);
      const a = art('binoculars', 92, null);
      if (a) lens.appendChild(a); else {
        const sv = S('svg', { viewBox: '0 0 120 90', class: 'chart' }, lens);
        S('circle', { cx: 44, cy: 40, r: 26, fill: K.ht('water', 30), stroke: I.ink, 'stroke-width': 4 }, sv);
        S('path', { d: 'M63,59 L92,84', stroke: I.ink, 'stroke-width': 10, 'stroke-linecap': 'round' }, sv);
        S('path', { d: 'M32,30 Q38,22 48,22', stroke: '#fff', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, sv);
      }
      H('p', { class: 'hand-l you-wants-q', text: 'What do you want close to home?' }, left);
      st.wantEls = {};
      const onChange = debounce(() => this.runMatcher(ctx, st), 380);
      const list = H('div', { class: 'you-want-list' }, left);
      AMEN.forEach(([k, label, ic]) => this.wantRow(list, st, k, label, ic, { min: 5, max: 30, step: 5, fmt: (v) => `within ${v} min walk` }, onChange));
      this.wantRow(list, st, 'transit', 'Transit', 'transit', { min: 50, max: 95, step: 5, fmt: (v) => `${v}% of people near a stop` }, onChange);
      /* temperature */
      const tw = H('div', { class: 'you-want you-want-temp' }, list);
      const tb = H('button', { type: 'button', class: 'you-want-btn', 'aria-pressed': 'false' }, tw); tb.appendChild(K.icon('heat', { size: 18 })); H('span', { text: 'Temperature' }, tb);
      const tr = H('div', { class: 'you-want-ctl' }, tw);
      const tl = H('p', { class: 'you-want-v hand' }, tr);
      const r1 = H('input', { type: 'range', class: 'range', min: '0', max: '30', step: '1', value: String(st.wants.temp.lo), 'aria-label': 'Coolest yearly mean temperature, °C' }, tr);
      const r2 = H('input', { type: 'range', class: 'range', min: '0', max: '30', step: '1', value: String(st.wants.temp.hi), 'aria-label': 'Warmest yearly mean temperature, °C' }, tr);
      const syncT = () => { const w = st.wants.temp; tl.textContent = `year mean ${w.lo} to ${w.hi} °C`; tb.setAttribute('aria-pressed', String(w.on)); tw.classList.toggle('on', w.on); r1.value = w.lo; r2.value = w.hi; };
      tb.addEventListener('click', () => { st.wants.temp.on = !st.wants.temp.on; syncT(); this.runMatcher(ctx, st); });
      const onR = (which) => () => { const w = st.wants.temp; let lo = +r1.value, hi = +r2.value; if (lo > hi) { if (which === 1) hi = lo; else lo = hi; } w.lo = lo; w.hi = hi; w.on = true; syncT(); onChange(); };
      r1.addEventListener('input', onR(1)); r2.addEventListener('input', onR(2));
      st.wantEls.temp = syncT; syncT();
      /* weather */
      const ww = H('div', { class: 'you-weather', role: 'group', 'aria-label': 'Weather type, any of' }, left);
      H('p', { class: 'you-weather-l display', text: 'Weather' }, ww);
      ww.hidden = true; st.weatherWrap = ww;
      st.weatherBox = H('div', { class: 'you-weather-list' }, ww);
      st.onWeather = onChange;

      const right = H('div', { class: 'you-results', 'data-anfra-query': ctx.qname('matcher') }, body);
      st.resCount = H('p', { class: 'you-res-count', role: 'status', 'aria-live': 'polite' }, right);
      st.resList = H('ol', { class: 'you-res-list' }, right);
      st.resTip = K.tooltip(right);
      st.takeaway = H('p', { class: 'hand you-takeaway' }, right);
      H('p', { class: 'small you-res-note', text: 'Pick one to see its city. Ranked by walk score. Dashed line: the neighbourhood you picked on the way.' }, right);
    },
    wantRow(list, st, k, label, ic, o, onChange) {
      const w = st.wants[k];
      const row = H('div', { class: `you-want you-want-${k}` }, list);
      const b = H('button', { type: 'button', class: 'you-want-btn', 'aria-pressed': String(w.on) }, row);
      b.appendChild(K.icon(ic, { size: 18 })); H('span', { text: label }, b);
      const ctl = H('div', { class: 'you-want-ctl' }, row);
      const v = H('p', { class: 'you-want-v hand' }, ctl);
      const r = H('input', { type: 'range', class: 'range', min: String(o.min), max: String(o.max), step: String(o.step), value: String(w.v), 'aria-label': `${label}: how close` }, ctl);
      const sync = () => { b.setAttribute('aria-pressed', String(w.on)); row.classList.toggle('on', w.on); v.textContent = o.fmt(w.v); r.value = w.v; r.setAttribute('aria-valuetext', o.fmt(w.v)); };
